, "instruccion": "Elige la opción correcta", "pregunta": "Quieres saber a qué hora empieza algo. ¿Qué palabra usas?", "opciones": ["nola", "non", "noiz", "zenbat"], "correcta": 2, "explicacion": "«Noiz» es «cuándo»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Quieres saber el precio de algo. ¿Qué palabra usas?", "opciones": ["zenbat", "zer", "zein", "zergatik"], "correcta": 0, "explicacion": "«Zenbat» sirve para cantidades y precios."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Quieres saber el motivo de algo. ¿Qué palabra usas?", "opciones": ["nola", "zergatik", "zer", "nondik"], "correcta": 1, "explicacion": "«Zergatik» es «por qué»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Quieres saber con quién va alguien. ¿Qué palabra usas?", "opciones": ["nor", "norekin", "nongoa", "zein"], "correcta": 1, "explicacion": "«Norekin»: «nor» más el sufijo de compañía «-ekin»."}]}, {"id": "u3-g03", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál es la diferencia entre «nondik» y «nongoa»?", "opciones": ["Ninguna", "«nondik» es movimiento y «nongoa» origen", "«nondik» es formal", "«nongoa» es plural"], "correcta": 1, "explicacion": "Puedes ser «Gernikakoa» y venir hoy «Bilbotik»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Te preguntan «Nongoa zara?». Te están preguntando…", "opciones": ["Dónde estás", "De dónde eres", "Adónde vas", "Por dónde has venido"], "correcta": 1, "explicacion": "«Nongoa» pregunta por el origen: dónde están tus raíces."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Te preguntan «Nondik zatoz?». Te están preguntando…", "opciones": ["De dónde eres", "Dónde vives", "De dónde vienes ahora", "Adónde vas"], "correcta": 2, "explicacion": "«Nondik» es movimiento desde un sitio."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Y «Nora zoaz?»", "opciones": ["¿De dónde eres?", "¿Dónde estás?", "¿Adónde vas?", "¿Con quién vas?"], "correcta": 2, "explicacion": "«Nora» es destino, y se responde con «-ra»: Bilbora."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Eres de Gernika pero hoy vienes de Bilbao. ¿Qué es correcto?", "opciones": ["Gernikatik naiz", "Gernikakoa naiz eta Bilbotik nator", "Bilbokoa naiz", "Gernikara naiz"], "correcta": 1, "explicacion": "«-koa» para el origen, «-tik» para el movimiento. El euskera las separa."}]}, {"id": "u3-g04", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Si «Non?» se responde con «-n», ¿cómo se responde a «Nora?»", "opciones": ["Con -n", "Con -ra", "Con -tik", "Con -koa"], "correcta": 1, "explicacion": "La pregunta y la respuesta llevan la misma terminación: Nora? — Bilbora."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué terminación pide «Nondik?»", "opciones": ["-ra", "-n", "-tik", "-koa"], "correcta": 2, "explicacion": "Nondik? — Bilbotik. Misma cola en pregunta y respuesta."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué terminación pide «Nongoa?»", "opciones": ["-koa", "-n", "-ra", "-tik"], "correcta": 0, "explicacion": "Nongoa? — Bilbokoa. El patrón se repite."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Bilbon» responde a la pregunta…", "opciones": ["Nora?", "Non?", "Nondik?", "Nongoa?"], "correcta": 1, "explicacion": "Termina en -n, así que responde a «Non?» (¿dónde?)."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué tienen en común la pregunta y su respuesta en euskera?", "opciones": ["Nada", "La misma terminación", "La misma longitud", "El mismo verbo"], "correcta": 1, "explicacion": "Es el mecanismo central del idioma: los sufijos encajan."}]}, {"id": "u3-g05", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Dónde se coloca la palabra interrogativa en euskera?", "opciones": ["Al final de la frase", "Justo antes del verbo", "Justo después del verbo", "Da igual"], "correcta": 1, "explicacion": "Interrogativa y verbo van pegados, sin nada en medio."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál de estas preguntas está bien construida?", "opciones": ["Zaude non?", "Non zaude?", "Non zu zaude?", "Zu zaude non?"], "correcta": 1, "explicacion": "«Non» pegado a «zaude». Nada puede meterse entre los dos."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál está bien?", "opciones": ["Zu nongoa zara?", "Nongoa zu zara?", "Zara zu nongoa?", "Zu zara nongoa?"], "correcta": 0, "explicacion": "El sujeto puede irse al principio, pero «nongoa» sigue pegado a «zara»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál está mal construida?", "opciones": ["Zer da hau?", "Noiz da festa?", "Nor zu zara?", "Zergatik ez?"], "correcta": 2, "explicacion": "«Zu» se ha colado entre la interrogativa y el verbo. Sería «Nor zara zu?»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En euskera el orden de palabras es bastante libre, excepto…", "opciones": ["En los adjetivos", "En las preguntas, donde la interrogativa va pegada al verbo", "En los plurales", "En los saludos"], "correcta": 1, "explicacion": "Es una de las pocas reglas de orden verdaderamente rígidas."}]}, {"id": "u3-g06", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿dónde?", "respuestas": ["non", "non?"], "pista": "Tres letras, empieza por n."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿quién?", "respuestas": ["nor", "nor?"], "pista": "Tres letras, empieza por n."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿cuándo?", "respuestas": ["noiz", "noiz?"], "pista": "Cuatro letras, empieza por n."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿por qué?", "respuestas": ["zergatik", "zergatik?"], "pista": "Una sola palabra, empieza por z."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿cuántos?", "respuestas": ["zenbat", "zenbat?"], "pista": "Empieza por z, seis letras."}]}, {"id": "u3-g07", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa «Ez dakit»?", "opciones": ["No quiero", "No sé", "No entiendo", "No es"], "correcta": 1, "explicacion": "Probablemente la frase más útil de todo el módulo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "No has entendido lo que te han dicho. ¿Qué respondes?", "opciones": ["Ez dakit", "Ez dut ulertzen", "Agian", "Beti"], "correcta": 1, "explicacion": "«Ez dut ulertzen» es «no entiendo». «Ez dakit» sería «no sé»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa «agian»?", "opciones": ["Siempre", "Nunca", "Quizás", "Ahora"], "correcta": 2, "explicacion": "Útil cuando no quieres comprometerte con un sí o un no."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Y «inoiz ez»?", "opciones": ["Alguna vez", "Nunca", "Siempre", "Todavía no"], "correcta": 1, "explicacion": "«inoiz» es «alguna vez»; junto a «ez» pasa a significar «nunca», como el «jamás» del castellano en negativa."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Quieres que te repitan algo. ¿Qué dices?", "opciones": ["Barkatu?", "Eskerrik asko", "Bai", "Gero arte"], "correcta": 0, "explicacion": "«Barkatu?» con entonación de pregunta funciona como «¿perdón?»."}]}, {"id": "u3-g08", "variantes": [{"tipo": "pares", "instruccion": "Empareja las respuestas útiles", "pares": [{"eu": "bai", "es": "sí"}, {"eu": "ez", "es": "no"}, {"eu": "ez dakit", "es": "no sé"}, {"eu": "agian", "es": "quizás"}]}, {"tipo": "pares", "instruccion": "Empareja las palabras de tiempo", "pares": [{"eu": "gaur", "es": "hoy"}, {"eu": "bihar", "es": "mañana"}, {"eu": "atzo", "es": "ayer"}, {"eu": "orain", "es": "ahora"}]}, {"tipo": "pares", "instruccion": "Empareja las palabras", "pares": [{"eu": "beti", "es": "siempre"}, {"eu": "inoiz ez", "es": "nunca"}, {"eu": "agian", "es": "quizás"}, {"eu": "orain", "es": "ahora"}]}, {"tipo": "pares", "instruccion": "Empareja las expresiones", "pares": [{"eu": "galdera", "es": "la pregunta"}, {"eu": "erantzuna", "es": "la respuesta"}, {"eu": "ez dakit", "es": "no sé"}, {"eu": "barkatu", "es": "perdón"}]}, {"tipo": "pares", "instruccion": "Empareja las frases hechas", "pares": [{"eu": "Nor zara zu?", "es": "¿Quién eres tú?"}, {"eu": "Non zaude?", "es": "¿Dónde estás?"}, {"eu": "Zer da hau?", "es": "¿Qué es esto?"}, {"eu": "Nola duzu izena?", "es": "¿Cómo te llamas?"}]}]}, {"id": "u3-g09", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Cómo te llamas?", "eu": "Nola duzu izena?", "palabras": ["Nola", "duzu", "izena?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Con quién estás tú?", "eu": "Norekin zaude zu?", "palabras": ["Norekin", "zaude", "zu?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Qué es esto?", "eu": "Zer da hau?", "palabras": ["Zer", "da", "hau?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Cuándo es la fiesta?", "eu": "Noiz da festa?", "palabras": ["Noiz", "da", "festa?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Adónde vas tú?", "eu": "Nora zoaz zu?", "palabras": ["Nora", "zoaz", "zu?"]}]}, {"id": "u3-g10", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En Gernika oyes «Zelan zagoz?». ¿Qué palabra del batua es «zelan»?", "opciones": ["non", "nola", "noiz", "zenbat"], "correcta": 1, "explicacion": "«Zelan» es el «nola» (cómo) del bizkaiera."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En Bizkaia, «¿con quién?» se dice…", "opciones": ["norekin?", "nogaz?", "nondik?", "zeren?"], "correcta": 1, "explicacion": "El bizkaiera usa el sufijo «-gaz» donde el batua usa «-rekin»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa «edonor»?", "opciones": ["Nadie", "Cualquiera", "Alguien concreto", "Nosotros"], "correcta": 1, "explicacion": "El prefijo «edo-» convierte la interrogativa en indefinido: edonor, edonon, edonora. Es batua, no solo bizkaiera."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Si «edonor» es «cualquiera», ¿qué será «edonon»?", "opciones": ["De cualquiera", "En cualquier sitio", "Cualquier cosa", "Cuando sea"], "correcta": 1, "explicacion": "«non» (dónde) + «edo-» = en cualquier sitio. Sistema muy regular."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Zelango?» en bizkaiera equivale al batua…", "opciones": ["nongoa?", "nolako?", "zenbat?", "zergatik?"], "correcta": 1, "explicacion": "«De qué tipo». Es «zelan» con el mismo «-ko» que llevan los lugares."}]}, {"id": "u3-g11", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué te preguntan con «Zenbat urte dituzu?»", "opciones": ["Cuánto cuesta", "Cuántos años tienes", "Cuántos hermanos tienes", "Cuándo naciste"], "correcta": 1, "explicacion": "«urte» es año. Literalmente: «¿cuántos años tienes?»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Y con «Nola duzu izena?»", "opciones": ["Cómo estás", "Cómo te llamas", "Cuál es tu apellido", "De dónde eres"], "correcta": 1, "explicacion": "Literalmente «¿cómo tienes nombre?»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Y con «Zer da hau?»", "opciones": ["¿Quién es este?", "¿Qué es esto?", "¿Dónde está?", "¿Cuánto es?"], "correcta": 1, "explicacion": "«hau» es «esto». La interrogativa «zer» va pegada al verbo «da»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Alguien te dice «Nor zara zu?». ¿Qué quiere saber?", "opciones": ["Cómo estás", "Quién eres", "Dónde vives", "Con quién vas"], "correcta": 1, "explicacion": "«Nor» es quién."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Con cuál de estas preguntas averiguas el precio?", "opciones": ["Zer da?", "Zenbat da?", "Nola da?", "Non da?"], "correcta": 1, "explicacion": "«Zenbat da?» es el «¿cuánto es?» de toda la vida."}]}, {"id": "u3-g12", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "no sé", "respuestas": ["ez dakit"], "pista": "Dos palabras. Empieza por «ez»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿cómo?", "respuestas": ["nola", "nola?"], "pista": "Cuatro letras. En Bizkaia sería «zelan»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿adónde?", "respuestas": ["nora", "nora?"], "pista": "Es «non» con la cola del destino."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "hoy", "respuestas": ["gaur"], "pista": "Cuatro letras, empieza por g."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿con quién?", "respuestas": ["norekin", "norekin?"], "pista": "«nor» más el sufijo de compañía."}]}]}, {"id": "u4", "numero": 4, "titulo": "Ni Ane naiz", "subtitulo": "El verbo «ser» y presentarte", "objetivo": "Tu primer verbo. Decir quién eres, a qué te dedicas y de dónde vienes.", "color": "negro", "vocabulario": [{"eu": "naiz", "es": "(yo) soy", "nota": null}, {"eu": "zara", "es": "(tú) eres", "nota": null}, {"eu": "da", "es": "(él/ella) es", "nota": null}, {"eu": "gara", "es": "(nosotros) somos", "nota": null}, {"eu": "zarete", "es": "(vosotros) sois", "nota": null}, {"eu": "dira", "es": "(ellos) son", "nota": null}, {"eu": "irakaslea", "es": "el/la profesor/a", "nota": "De «irakatsi» (enseñar)."}, {"eu": "ikaslea", "es": "el/la estudiante", "nota": "De «ikasi» (aprender)."}, {"eu": "medikua", "es": "el/la médico/a", "nota": null}, {"eu": "sukaldaria", "es": "el/la cocinero/a", "nota": "De «sukalde» (cocina)."}, {"eu": "langilea", "es": "el/la trabajador/a", "nota": "De «lan» (trabajo)."}, {"eu": "idazlea", "es": "el/la escritor/a", "nota": "De «idatzi» (escribir)."}, {"eu": "euskalduna", "es": "vascoparlante", "nota": "Su sentido básico es «que tiene el euskera», no el origen. También se usa como «del País Vasco», pero el primero es el que cuenta aquí."}, {"eu": "erdalduna", "es": "que no habla euskera", "nota": "«erdara» es cualquier lengua que no sea el euskera."}, {"eu": "laguna", "es": "el/la amigo/a", "nota": null}, {"eu": "izena", "es": "el nombre", "nota": null}, {"eu": "baina", "es": "pero", "nota": null}, {"eu": "ere", "es": "también", "nota": "Va detrás de la palabra a la que acompaña."}, {"eu": "hau", "es": "esto, este", "nota": null}, {"eu": "bai", "es": "sí", "nota": null}], "gramatica": [{"titulo": "El verbo «izan» (ser) en presente", "cuerpo": "Ya conoces los pronombres, así que este verbo va a costarte mucho menos. Es el que más vas a usar en toda tu vida en euskera:\n\n<b>ni naiz<\/b> — yo soy\n<b>zu zara<\/b> — tú eres\n<b>hura da<\/b> — él/ella es\n<b>gu gara<\/b> — nosotros somos\n<b>zuek zarete<\/b> — vosotros sois\n<b>haiek dira<\/b> — ellos son\n\nFíjate en el patrón: las formas de <i>ni<\/i> y <i>gu<\/i> empiezan por <b>n-<\/b> y <b>g-<\/b>, igual que los pronombres. Las de <i>zu<\/i> y <i>zuek<\/i> por <b>z-<\/b>. Las de tercera persona por <b>d-<\/b>. No es casualidad: el verbo lleva dentro la marca de la persona.\n\nY como ya sabes, el pronombre suele omitirse: <i>Ane naiz<\/i> ya significa «soy Ane».", "ejemplos": [{"eu": "Ni Ane naiz.", "es": "Yo soy Ane."}, {"eu": "Zu irakaslea zara.", "es": "Tú eres profesor."}, {"eu": "Hura medikua da.", "es": "Él/ella es médico."}]}, {"titulo": "El verbo va al final", "cuerpo": "En euskera el orden básico es <b>Sujeto – Objeto – Verbo<\/b>. El verbo cierra la frase casi siempre.\n\nCastellano: <i>Yo <b>soy<\/b> profesor.<\/i>\nEuskera: <i>Ni irakaslea <b>naiz<\/b>.<\/i>\n\nEs el cambio mental más grande al empezar. Piensa la frase entera antes de hablar y coloca el verbo al final.\n\nLa excepción que ya conoces: en las preguntas, la palabra interrogativa se pega delante del verbo. Y el verbo sigue estando al final. <i>Nongoa <b>zara<\/b>?<\/i>", "ejemplos": [{"eu": "Ni Bilbokoa naiz.", "es": "Yo soy de Bilbao."}, {"eu": "Gu ikasleak gara.", "es": "Nosotros somos estudiantes."}]}, {"titulo": "El artículo va pegado al final: -a", "cuerpo": "Ya lo has visto en los posesivos, pero ahora toca decirlo del todo. El euskera no tiene «el» ni «la» delante. Añade <b>-a<\/b> al final de la palabra:\n\n<b>irakasle<\/b> (profesor) → <b>irakaslea<\/b> (el profesor)\n<b>etxe<\/b> (casa) → <b>etxea<\/b> (la casa)\n<b>mediku<\/b> (médico) → <b>medikua<\/b> (el médico)\n\nEl plural es <b>-ak<\/b>: <i>irakasleak<\/i>, <i>etxeak<\/i>.\n\nSi la palabra ya termina en -a, no se dobla: <i>neska<\/i> (chica) → <i>neska<\/i> (la chica).\n\nOjo con esto: a diferencia del castellano, en euskera las profesiones <b>sí<\/b> llevan artículo. Se dice <i>Ni irakasle<b>a<\/b> naiz<\/i>, no «Ni irakasle naiz».", "ejemplos": [{"eu": "ikaslea", "es": "el/la estudiante"}, {"eu": "ikasleak", "es": "los/las estudiantes"}, {"eu": "Ni sukaldaria naiz.", "es": "Soy cocinero."}]}, {"titulo": "Decir de dónde eres: -ko / -go", "cuerpo": "En la unidad de preguntas viste que <i>Nongoa?<\/i> se responde con <b>-koa<\/b>. Aquí está el detalle.\n\nSe añade <b>-ko<\/b> al nombre del sitio, y luego el artículo <b>-a<\/b>:\n\n<b>Bilbo<\/b> → Bilbo<b>koa<\/b> naiz (soy de Bilbao)\n<b>Donostia<\/b> → Donostia<b>koa<\/b> naiz\n<b>Gernika<\/b> → Gernika<b>koa<\/b> naiz\n\nSi el nombre acaba en <b>-n<\/b> o <b>-l<\/b>, el sufijo se convierte en <b>-go<\/b>:\n\n<b>Madril<\/b> → Madril<b>goa<\/b> naiz\n<b>Jaen<\/b> → Jaen<b>goa<\/b> naiz\n\nEs solo un ajuste de pronunciación: «Madrilkoa» sería incómodo de decir.", "ejemplos": [{"eu": "Nongoa zara?", "es": "¿De dónde eres?"}, {"eu": "Gernikakoa naiz.", "es": "Soy de Gernika."}, {"eu": "Madrilgoa naiz.", "es": "Soy de Madrid."}]}, {"titulo": "Preguntar el nombre", "cuerpo": "Hay dos formas habituales, las dos correctas:\n\n<b>Nola duzu izena?<\/b> — literalmente «¿cómo tienes nombre?»\nRespuesta: <b>Ane dut izena.<\/b>\n\n<b>Nor zara zu?<\/b> — «¿quién eres tú?»\nRespuesta: <b>Ni Ane naiz.<\/b>\n\nLa primera es la más natural al presentarse. Lleva el verbo <i>ukan<\/i> (tener), que es el de la próxima unidad; de momento apréndetela entera.", "ejemplos": [{"eu": "Nola duzu izena?", "es": "¿Cómo te llamas?"}, {"eu": "Mikel dut izena.", "es": "Me llamo Mikel."}]}, {"titulo": "«ere» significa también, y va detrás", "cuerpo": "Una palabra pequeña muy útil. <b>ere<\/b> es «también», y como casi todo en euskera, va <b>detrás<\/b> de la palabra a la que acompaña:\n\n<b>Ni ere ikaslea naiz.<\/b> — Yo también soy estudiante.\n<b>Hura ere Gernikakoa da.<\/b> — Él también es de Gernika.\n\nFíjate en que <i>ere<\/i> se coloca justo después de lo que quieres subrayar. Si lo mueves, cambia el sentido, igual que en castellano con «también».", "ejemplos": [{"eu": "Ni ere euskalduna naiz.", "es": "Yo también hablo euskera."}, {"eu": "Gu ere lagunak gara.", "es": "Nosotros también somos amigos."}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "Aquí es donde el bizkaiera de Busturialdea se aleja más del batua, y es lo que hace que el euskera de Gernika suene tan reconocible.\n\n<b>naiz → naz<\/b>\nEl verbo «izan» cambia poco, pero lo que cambia se nota: <i>ni naz<\/i> en lugar de <i>ni naiz<\/i>, y <i>zuek zarie<\/i> en lugar de <i>zuek zarete<\/i>. Las demás formas (zara, da, gara, dira) son iguales.\n\n<b>La vocal del artículo se transforma<\/b>\nEste es el rasgo estrella. Cuando el artículo <b>-a<\/b> se pega a una palabra, las vocales se funden:\n\n<i>etxe + a<\/i> → batua <b>etxea<\/b>, Gernika <b>etxie<\/b>\n<i>neska + a<\/i> → batua <b>neska<\/b>, Gernika <b>neskie<\/b>\n<i>beso + a<\/i> → batua <b>besoa<\/b>, Gernika <b>besue<\/b>\n\nPor eso oyes tanta terminación en <b>-ie<\/b> y <b>-ue<\/b> por allí. Una vez sabes que es solo el artículo, dejas de perderte.\n\n<b>Las palabras en -ción<\/b>\nEl castellano <i>-ción<\/i> da <b>-ziño<\/b>: <i>erlijiño<\/i> (religión), <i>estaziño<\/i> (estación). En batua serían <i>erlijio<\/i> y <i>estazio<\/i>.", "ejemplos": [{"eu": "Ni Gernikakoa naz.", "es": "Soy de Gernika. (bizkaiera) — batua: naiz"}, {"eu": "etxie", "es": "la casa (Gernika) — batua: etxea"}, {"eu": "Zuek ikasleak zarie.", "es": "Vosotros sois estudiantes. — batua: zarete"}]}, {"titulo": "Un aviso sobre los dialectos", "cuerpo": "El habla cambia de pueblo a pueblo, y a veces de barrio a barrio. Lo que te cuento como «de Gernika» es bizkaiera de Busturialdea en general, y no todo el mundo de allí lo dice igual: quien se ha escolarizado en batua mezcla las dos cosas constantemente.\n\nTómalo como oído entrenado, no como norma. Para escribir, para exámenes y para entenderte con cualquiera, usa batua. Para captar lo que oyes en una taberna de Gernika, ten estas notas a mano.\n\nY contrástalo con alguien de allí en cuanto puedas. Ninguna app sustituye eso.", "ejemplos": []}], "ejercicios": [{"id": "u4-g01", "variantes": [{"tipo": "pares", "instruccion": "Empareja cada pronombre con su verbo", "pares": [{"eu": "naiz", "es": "ni"}, {"eu": "zara", "es": "zu"}, {"eu": "gara", "es": "gu"}, {"eu": "dira", "es": "haiek"}]}, {"tipo": "pares", "instruccion": "Empareja cada pronombre con su verbo", "pares": [{"eu": "da", "es": "hura"}, {"eu": "zarete", "es": "zuek"}, {"eu": "naiz", "es": "ni"}, {"eu": "gara", "es": "gu"}]}, {"tipo": "pares", "instruccion": "Empareja con la traducción", "pares": [{"eu": "naiz", "es": "soy"}, {"eu": "zara", "es": "eres"}, {"eu": "da", "es": "es"}, {"eu": "dira", "es": "son"}]}, {"tipo": "pares", "instruccion": "Empareja con la traducción", "pares": [{"eu": "gara", "es": "somos"}, {"eu": "zarete", "es": "sois"}, {"eu": "dira", "es": "son"}, {"eu": "da", "es": "es"}]}, {"tipo": "pares", "instruccion": "Empareja las frases", "pares": [{"eu": "Ni ikaslea naiz.", "es": "Soy estudiante."}, {"eu": "Zu medikua zara.", "es": "Eres médico."}, {"eu": "Gu lagunak gara.", "es": "Somos amigos."}, {"eu": "Haiek irakasleak dira.", "es": "Son profesores."}]}]}, {"id": "u4-g02", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni Mikel ____.", "opciones": ["da", "naiz", "zara", "gara"], "correcta": 1, "explicacion": "Con «ni» (yo) siempre va «naiz»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni Gernikakoa ____.", "opciones": ["zara", "da", "naiz", "dira"], "correcta": 2, "explicacion": "Sujeto «ni» → «naiz», y el verbo cierra la frase."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni idazlea ____.", "opciones": ["naiz", "gara", "da", "zarete"], "correcta": 0, "explicacion": "«Idazle» es escritor; con «ni» el verbo es «naiz»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni ere euskalduna ____.", "opciones": ["da", "naiz", "gara", "zara"], "correcta": 1, "explicacion": "«ere» no cambia el verbo: el sujeto sigue siendo «ni»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni langilea ____.", "opciones": ["zara", "naiz", "dira", "da"], "correcta": 1, "explicacion": "Primera persona del singular: «naiz»."}]}, {"id": "u4-g03", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zu irakaslea ____.", "opciones": ["naiz", "da", "zara", "dira"], "correcta": 2, "explicacion": "Con «zu» (tú) va «zara»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hura sukaldaria ____.", "opciones": ["da", "naiz", "zara", "gara"], "correcta": 0, "explicacion": "Con «hura» (él/ella) va «da»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zuek ikasleak ____.", "opciones": ["gara", "dira", "zarete", "zara"], "correcta": 2, "explicacion": "Con «zuek» (vosotros) va «zarete»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gu euskaldunak ____.", "opciones": ["gara", "dira", "zarete", "naiz"], "correcta": 0, "explicacion": "Con «gu» (nosotros) va «gara»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Bera medikua ____.", "opciones": ["naiz", "da", "dira", "zara"], "correcta": 1, "explicacion": "«Bera» equivale a «hura», así que el verbo es «da»."}]}, {"id": "u4-g04", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Yo soy estudiante.", "eu": "Ni ikaslea naiz.", "palabras": ["Ni", "ikaslea", "naiz."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Tú eres médico.", "eu": "Zu medikua zara.", "palabras": ["Zu", "medikua", "zara."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ella es cocinera.", "eu": "Hura sukaldaria da.", "palabras": ["Hura", "sukaldaria", "da."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Yo también soy estudiante.", "eu": "Ni ere ikaslea naiz.", "palabras": ["Ni", "ere", "ikaslea", "naiz."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Él es escritor.", "eu": "Hura idazlea da.", "palabras": ["Hura", "idazlea", "da."]}]}, {"id": "u4-g05", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál es el orden correcto en euskera?", "opciones": ["Ni naiz medikua.", "Naiz ni medikua.", "Ni medikua naiz.", "Medikua naiz ni."], "correcta": 2, "explicacion": "El verbo cierra la frase: Sujeto – Objeto – Verbo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Dónde va el verbo en una frase normal en euskera?", "opciones": ["Al principio", "Después del sujeto", "Al final", "Da igual"], "correcta": 2, "explicacion": "El orden básico es Sujeto – Objeto – Verbo. El verbo cierra."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál de estas frases está mal construida?", "opciones": ["Gu lagunak gara.", "Zu zara irakaslea.", "Hura ikaslea da.", "Ni Gernikakoa naiz."], "correcta": 1, "explicacion": "«Zu zara irakaslea» pone el verbo en medio. Sería «Zu irakaslea zara»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En una pregunta, ¿qué va justo antes del verbo?", "opciones": ["El sujeto", "La palabra interrogativa", "El adjetivo", "Nada"], "correcta": 1, "explicacion": "Interrogativa y verbo van pegados: «Nongoa zara?»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Dónde se coloca «ere» (también)?", "opciones": ["Al principio de la frase", "Detrás de la palabra a la que acompaña", "Delante del verbo siempre", "Al final"], "correcta": 1, "explicacion": "«Ni ere ikaslea naiz»: «ere» va justo después de «ni»."}]}, {"id": "u4-g06", "variantes": [{"tipo": "pares", "instruccion": "Empareja las profesiones", "pares": [{"eu": "irakaslea", "es": "profesor/a"}, {"eu": "ikaslea", "es": "estudiante"}, {"eu": "medikua", "es": "médico/a"}, {"eu": "sukaldaria", "es": "cocinero/a"}]}, {"tipo": "pares", "instruccion": "Empareja las profesiones", "pares": [{"eu": "langilea", "es": "trabajador/a"}, {"eu": "idazlea", "es": "escritor/a"}, {"eu": "medikua", "es": "médico/a"}, {"eu": "laguna", "es": "amigo/a"}]}, {"tipo": "pares", "instruccion": "Empareja cada oficio con el verbo del que viene", "pares": [{"eu": "irakaslea", "es": "irakatsi (enseñar)"}, {"eu": "ikaslea", "es": "ikasi (aprender)"}, {"eu": "idazlea", "es": "idatzi (escribir)"}, {"eu": "langilea", "es": "lan (trabajo)"}]}, {"tipo": "pares", "instruccion": "Empareja singular y plural", "pares": [{"eu": "ikaslea", "es": "ikasleak"}, {"eu": "laguna", "es": "lagunak"}, {"eu": "medikua", "es": "medikuak"}, {"eu": "etxea", "es": "etxeak"}]}, {"tipo": "pares", "instruccion": "Empareja las palabras", "pares": [{"eu": "euskalduna", "es": "que habla euskera"}, {"eu": "erdalduna", "es": "que no habla euskera"}, {"eu": "laguna", "es": "el amigo"}, {"eu": "izena", "es": "el nombre"}]}]}, {"id": "u4-g07", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo se dice «soy de Bilbao»?", "opciones": ["Bilbo naiz.", "Bilbokoa naiz.", "Bilboan naiz.", "Bilbotik naiz."], "correcta": 1, "explicacion": "«-ko» indica procedencia y «-a» es el artículo: Bilbo + ko + a."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo se dice «soy de Gernika»?", "opciones": ["Gernikan naiz.", "Gernika naiz.", "Gernikakoa naiz.", "Gernikara naiz."], "correcta": 2, "explicacion": "Gernika + ko + a. «Gernikan» sería «en Gernika»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Donostiakoa naiz» significa…", "opciones": ["Estoy en San Sebastián", "Soy de San Sebastián", "Voy a San Sebastián", "Vengo de San Sebastián"], "correcta": 1, "explicacion": "El sufijo «-ko» marca origen o pertenencia a un lugar."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué pregunta responde «Gernikakoa naiz»?", "opciones": ["Non zaude?", "Nongoa zara?", "Nora zoaz?", "Nor zara?"], "correcta": 1, "explicacion": "Respuesta en «-koa» → pregunta con «Nongoa?»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo dirías «somos de Gernika»?", "opciones": ["Gu Gernikakoa gara.", "Gu Gernikakoak gara.", "Gu Gernikan gara.", "Gu Gernika gara."], "correcta": 1, "explicacion": "Sujeto plural, así que el atributo también va en plural: «-koak»."}]}, {"id": "u4-g08", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Madril» termina en -l. ¿Cómo se dice «soy de Madrid»?", "opciones": ["Madrilkoa naiz.", "Madrilgoa naiz.", "Madrila naiz.", "Madrilekoa naiz."], "correcta": 1, "explicacion": "Tras -n y -l, el sufijo -ko se convierte en -go."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Jaen» acaba en -n. ¿Cómo se dice «soy de Jaén»?", "opciones": ["Jaengoa naiz.", "Jaenkoa naiz.", "Jaena naiz.", "Jaenean naiz."], "correcta": 0, "explicacion": "Misma regla: tras -n y -l, el -ko pasa a -go."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Tras qué letras el sufijo «-ko» se convierte en «-go»?", "opciones": ["Tras vocal", "Tras -n y -l", "Tras -s y -z", "Tras -k y -t"], "correcta": 1, "explicacion": "Solo tras -n y -l: Madrilgoa, Jaengoa."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Por qué existe la variante «-go»?", "opciones": ["Por tradición literaria", "Porque «-lko» y «-nko» serían incómodos de pronunciar", "Para marcar el plural", "Para distinguir países de ciudades"], "correcta": 1, "explicacion": "Es un ajuste fonético, no una regla gramatical de fondo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál de estas está bien escrita?", "opciones": ["Irungoa naiz.", "Irunkoa naiz.", "Irunekoa naiz.", "Iruna naiz."], "correcta": 0, "explicacion": "«Irun» acaba en -n, así que toca «-go»."}]}, {"id": "u4-g09", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿De dónde eres tú?", "eu": "Nongoa zara zu?", "palabras": ["Nongoa", "zara", "zu?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Yo soy de Gernika.", "eu": "Ni Gernikakoa naiz.", "palabras": ["Ni", "Gernikakoa", "naiz."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Quién eres tú?", "eu": "Nor zara zu?", "palabras": ["Nor", "zara", "zu?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ella también es de Bilbao.", "eu": "Hura ere Bilbokoa da.", "palabras": ["Hura", "ere", "Bilbokoa", "da."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Nosotros somos de Madrid.", "eu": "Gu Madrilgoak gara.", "palabras": ["Gu", "Madrilgoak", "gara."]}]}, {"id": "u4-g10", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Soy estudiante.", "respuestas": ["ni ikaslea naiz", "ikaslea naiz"], "pista": "No olvides el artículo -a al final de «ikasle»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Soy médico.", "respuestas": ["ni medikua naiz", "medikua naiz"], "pista": "«mediku» + artículo, y el verbo al final."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Somos amigos.", "respuestas": ["gu lagunak gara", "lagunak gara"], "pista": "Plural: «-ak». Con «gu» el verbo es «gara»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Soy de Gernika.", "respuestas": ["ni gernikakoa naiz", "gernikakoa naiz", "gernikakoa naiz ni"], "pista": "Gernika + ko + a, y el verbo cerrando."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Yo también soy profesor.", "respuestas": ["ni ere irakaslea naiz"], "pista": "«ere» va justo detrás de «ni»."}]}, {"id": "u4-g11", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿Cómo te llamas?", "respuestas": ["nola duzu izena", "nola duzu izena?"], "pista": "Literalmente: «¿cómo tienes nombre?»"}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿De dónde eres?", "respuestas": ["nongoa zara", "nongoa zara zu", "nongoa zara?"], "pista": "Empieza por la palabra interrogativa."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Me llamo Ane.", "respuestas": ["ane dut izena", "ni ane naiz", "ane naiz"], "pista": "Vale «Ane dut izena» o simplemente «Ane naiz»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿Quién eres tú?", "respuestas": ["nor zara zu", "nor zara", "nor zara zu?"], "pista": "«nor» pegado al verbo."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Ellos son estudiantes.", "respuestas": ["haiek ikasleak dira", "ikasleak dira", "beraiek ikasleak dira"], "pista": "Plural en el sustantivo y en el verbo."}]}, {"id": "u4-g12", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa «euskalduna»?", "opciones": ["Nacido en el País Vasco", "Que habla euskera", "Profesor de euskera", "Del País Vasco francés"], "correcta": 1, "explicacion": "«Euskaldun» = «el que tiene euskera». En su sentido básico es cuestión de lengua, no de origen (aunque también se oiga como «del País Vasco»)."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Y «erdalduna»?", "opciones": ["Extranjero", "Que no habla euskera", "Bilingüe", "Del sur"], "correcta": 1, "explicacion": "«Erdara» es cualquier lengua que no sea el euskera; «erdaldun» quien solo habla esas."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Alguien nacido en Sevilla que habla euskera perfectamente es…", "opciones": ["erdalduna", "euskalduna", "ninguna de las dos", "las dos a la vez"], "correcta": 1, "explicacion": "«Euskaldun» se define por la lengua, no por el lugar de nacimiento."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En Gernika oirás «Ni Gernikakoa naz». ¿Qué forma del batua sustituye «naz»?", "opciones": ["da", "naiz", "gara", "zara"], "correcta": 1, "explicacion": "En bizkaiera «naiz» se dice «naz». Las demás formas de «izan» apenas cambian."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En bizkaiera, «zuek zarete» se dice…", "opciones": ["zuek zarie", "zuek zaraz", "zuek dozue", "zuek gara"], "correcta": 0, "explicacion": "«Zarete» pasa a «zarie». Junto con «naz», son los dos cambios de «izan»."}]}]}, {"id": "u5", "numero": 5, "titulo": "Zenbat?", "subtitulo": "Números, edad y tener", "objetivo": "Contar hasta veinte, decir tu edad y usar el verbo «ukan» (tener). Aquí llega el ergativo.", "color": "azul", "vocabulario": [{"eu": "bat", "es": "uno", "nota": null}, {"eu": "bi", "es": "dos", "nota": null}, {"eu": "hiru", "es": "tres", "nota": null}, {"eu": "lau", "es": "cuatro", "nota": null}, {"eu": "bost", "es": "cinco", "nota": null}, {"eu": "sei", "es": "seis", "nota": null}, {"eu": "zazpi", "es": "siete", "nota": null}, {"eu": "zortzi", "es": "ocho", "nota": null}, {"eu": "bederatzi", "es": "nueve", "nota": null}, {"eu": "hamar", "es": "diez", "nota": null}, {"eu": "hamaika", "es": "once", "nota": "También significa «un montón», coloquialmente."}, {"eu": "hamabi", "es": "doce", "nota": "hamar + bi"}, {"eu": "hamahiru", "es": "trece", "nota": null}, {"eu": "hamalau", "es": "catorce", "nota": null}, {"eu": "hamabost", "es": "quince", "nota": null}, {"eu": "hamasei", "es": "dieciséis", "nota": null}, {"eu": "hamazazpi", "es": "diecisiete", "nota": null}, {"eu": "hemezortzi", "es": "dieciocho", "nota": "El prefijo cambia a «heme-». También se oye «hamazortzi»."}, {"eu": "hemeretzi", "es": "diecinueve", "nota": "heme- + bederatzi, contraído."}, {"eu": "hogei", "es": "veinte", "nota": null}, {"eu": "dut", "es": "(yo) tengo", "nota": null}, {"eu": "duzu", "es": "(tú) tienes", "nota": null}, {"eu": "du", "es": "(él/ella) tiene", "nota": null}, {"eu": "ditut", "es": "(yo) tengo (varias cosas)", "nota": null}, {"eu": "urtea", "es": "el año", "nota": null}, {"eu": "anaia", "es": "hermano (de un chico)", "nota": null}, {"eu": "arreba", "es": "hermana (de un chico)", "nota": null}, {"eu": "neba", "es": "hermano (de una chica)", "nota": "Palabra especialmente viva en Bizkaia."}, {"eu": "ahizpa", "es": "hermana (de una chica)", "nota": null}, {"eu": "aita", "es": "padre", "nota": null}, {"eu": "ama", "es": "madre", "nota": null}, {"eu": "semea", "es": "el hijo", "nota": null}, {"eu": "alaba", "es": "la hija", "nota": null}, {"eu": "txakurra", "es": "el perro", "nota": null}, {"eu": "katua", "es": "el gato", "nota": null}], "gramatica": [{"titulo": "Del once al diecinueve", "cuerpo": "De 12 a 17 se construye con <b>hama-<\/b> (de «hamar», diez) más el número:\n\nhama + bi → <b>hamabi<\/b> (12)\nhama + hiru → <b>hamahiru<\/b> (13)\nhama + lau → <b>hamalau<\/b> (14)\nhama + bost → <b>hamabost<\/b> (15)\nhama + sei → <b>hamasei<\/b> (16)\nhama + zazpi → <b>hamazazpi<\/b> (17)\n\nEl 11 se sale del todo:\n\n<b>hamaika<\/b> (11) — aquí no hay «bat» por ninguna parte. Hay que memorizarlo.\n\nEl 18 y el 19 siguen el mismo patrón que los demás, pero con la vocal cambiada:\n\nhama + zortzi → <b>hemezortzi<\/b> (18)\nhama + bederatzi → <b>hemeretzi<\/b> (19)\n\nSiguen siendo diez y ocho, y diez y nueve, igual que <i>hamasei<\/i> es diez y seis. Lo único que pasa es que el prefijo suena <b>heme-<\/b> en vez de <b>hama-<\/b>, y que en el 19 el «bederatzi» se queda en <b>-retzi<\/b>. No es otra lógica: es la misma con desgaste.", "ejemplos": []}, {"titulo": "El sistema es de base veinte", "cuerpo": "El euskera cuenta de veinte en veinte, como el francés con <i>quatre-vingts<\/i> pero llevado hasta el final:\n\n<b>hogei<\/b> (20)\n<b>berrogei<\/b> (40) = dos veintes\n<b>hirurogei<\/b> (60) = tres veintes\n<b>laurogei<\/b> (80) = cuatro veintes\n\nY 35 es <i>hogeita hamabost<\/i>: «veinte y quince». No hace falta que lo domines ahora, pero conviene saber por qué los números altos suenan tan largos.", "ejemplos": []}, {"titulo": "El verbo «ukan» (tener) en presente", "cuerpo": "Cuando lo que tienes es <b>una sola cosa<\/b>:\n\n<b>nik dut<\/b> — yo tengo\n<b>zuk duzu<\/b> — tú tienes\n<b>hark du<\/b> — él/ella tiene\n<b>guk dugu<\/b> — nosotros tenemos\n<b>zuek duzue<\/b> — vosotros tenéis\n<b>haiek dute<\/b> — ellos tienen\n\n¿Te acuerdas del aviso de la unidad de pronombres? Aquí está. Ya no es <i>ni<\/i> sino <b>nik<\/b>, ni <i>zu<\/i> sino <b>zuk<\/b>. Es la misma raíz con una <b>-k<\/b> pegada, y esa -k tiene nombre: <b>ergativo<\/b>.\n\n(Existe otro verbo, <b>eduki<\/b>, para posesión física: <i>nik daukat<\/i>. Los dos se usan; por ahora quédate con «ukan».)", "ejemplos": [{"eu": "Nik txakurra dut.", "es": "Yo tengo un perro."}, {"eu": "Zuk katua duzu.", "es": "Tú tienes un gato."}]}, {"titulo": "La -k del ergativo", "cuerpo": "Esta es la idea más rara del euskera para un hispanohablante, y la más importante. Merece la pena entenderla despacio.\n\nEl sujeto lleva la marca <b>-k<\/b> solo cuando el verbo tiene complemento directo:\n\n<i>Ni ikaslea <b>naiz<\/b>.<\/i> → sin -k, porque «ser» no lleva objeto\n<i><b>Nik<\/b> txakurra <b>dut<\/b>.<\/i> → con -k, porque tengo <i>algo<\/i>\n\nDicho de otra forma: quien <b>hace<\/b> algo a algo lleva -k. Quien simplemente <b>es<\/b> o <b>está<\/b>, no.\n\nEn castellano el sujeto es siempre igual y no marcas nada. En euskera tienes que decidir cada vez. Al principio se falla mucho, y es completamente normal: es una categoría que tu lengua materna no tiene.", "ejemplos": [{"eu": "Ni Bilbokoa naiz.", "es": "Soy de Bilbao. (sin -k)"}, {"eu": "Nik anaia bat dut.", "es": "Tengo un hermano. (con -k)"}, {"eu": "Hura irakaslea da.", "es": "Ella es profesora. (sin -k)"}, {"eu": "Hark bi katu ditu.", "es": "Ella tiene dos gatos. (con -k)"}]}, {"titulo": "Cuando tienes varias cosas: dut → ditut", "cuerpo": "El verbo también cambia según <b>cuántas<\/b> cosas tienes. Si son varias, entra una <b>-it-<\/b>:\n\n<b>nik ditut<\/b> — yo tengo (varios)\n<b>zuk dituzu<\/b> — tú tienes\n<b>hark ditu<\/b> — él/ella tiene\n<b>guk ditugu<\/b> — nosotros tenemos\n<b>zuek dituzue<\/b> — vosotros tenéis\n<b>haiek dituzte<\/b> — ellos tienen\n\nCompara: <i>katu bat <b>dut<\/b><\/i> (tengo un gato) frente a <i>bi katu <b>ditut<\/b><\/i> (tengo dos gatos). Lo que cambia es el verbo, no el nombre: <i>katu<\/i> se queda igual.\n\nEsto es lo que hace que el verbo vasco parezca complicado, y también lo que lo hace potente: lleva dentro la información de quién hace, a quién y cuántos.", "ejemplos": [{"eu": "Nik katu bat dut.", "es": "Tengo un gato."}, {"eu": "Nik hiru katu ditut.", "es": "Tengo tres gatos."}]}, {"titulo": "Decir tu edad", "cuerpo": "La edad se «tiene», como en castellano, pero en plural porque son varios años:\n\n<b>Zenbat urte dituzu?<\/b> — ¿Cuántos años tienes?\n<b>Hogei urte ditut.<\/b> — Tengo veinte años.\n\nY fíjate: <i>urte<\/i> va sin artículo y en singular detrás del número. Se dice <i>hogei urte<\/i>, nunca «hogei urteak». Es una regla general: <b>detrás de un número, el sustantivo no lleva artículo ni plural<\/b>.", "ejemplos": [{"eu": "Zenbat urte dituzu?", "es": "¿Cuántos años tienes?"}, {"eu": "Hamabost urte ditut.", "es": "Tengo quince años."}, {"eu": "bi katu", "es": "dos gatos — sin artículo, sin -ak"}]}, {"titulo": "Hermano y hermana dependen de quién los tiene", "cuerpo": "Aquí el euskera es más preciso que el castellano. La palabra cambia según el sexo de <b>quien tiene ese hermano<\/b>, no del hermano:\n\nSi es un chico quien lo tiene: <b>anaia<\/b> (hermano), <b>arreba<\/b> (hermana)\nSi es una chica: <b>neba<\/b> (hermano), <b>ahizpa<\/b> (hermana)\n\nNormalmente coincide con quien habla, pero no siempre: en <i>Anek ahizpa bat du<\/i> manda Ane, no el hablante.\n\nDos hermanos, chico y chica, usan palabras distintas para referirse el uno al otro. Curiosamente, en una lengua sin género gramatical.", "ejemplos": [{"eu": "Mikelek arreba bat du.", "es": "Mikel tiene una hermana."}, {"eu": "Anek ahizpa bat du.", "es": "Ane tiene una hermana."}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "El verbo «tener» es donde el bizkaiera se separa del batua de forma más llamativa. Si oyes <i>dot<\/i> en vez de <i>dut<\/i>, estás en Bizkaia sin ninguna duda.\n\n<b>ukan en bizkaiera<\/b>\n\n<b>nik dot<\/b> — batua: dut\n<b>zuk dozu<\/b> — duzu\n<b>hark dau<\/b> — du\n<b>guk dogu<\/b> — dugu\n<b>zuek dozue<\/b> — duzue\n<b>haiek dabe<\/b> — dute\n\n<b>El plural se hace con -z<\/b>\nDonde el batua mete una <i>-it-<\/i>, el bizkaiera añade una <b>-z<\/b> al final:\n\n<i>ditugu<\/i> → <b>doguz<\/b>\n<i>ditut<\/i> → <b>dodaz<\/b>\n<i>daude<\/i> → <b>dagoz<\/b>\n\nAsí que «¿cuántos años tienes?» en Gernika es <b>Zenbat urte dozuz?<\/b>\n\n<b>neba y ahizpa<\/b>\nEl sistema de cuatro palabras para hermanos está vivo en toda Euskal Herria, pero <i>neba<\/i> se conserva con especial fuerza en Bizkaia. En zonas de Gipuzkoa se ha ido perdiendo a favor de <i>anaia<\/i> para todo.", "ejemplos": [{"eu": "Nik txakurra dot.", "es": "Tengo un perro. (bizkaiera) — batua: dut"}, {"eu": "Zenbat urte dozuz?", "es": "¿Cuántos años tienes? — batua: dituzu"}, {"eu": "Haiek etxe bat dabe.", "es": "Ellos tienen una casa. — batua: dute"}]}, {"titulo": "Un aviso sobre los dialectos", "cuerpo": "El habla cambia de pueblo a pueblo, y a veces de barrio a barrio. Lo que te cuento como «de Gernika» es bizkaiera de Busturialdea en general, y no todo el mundo de allí lo dice igual: quien se ha escolarizado en batua mezcla las dos cosas constantemente.\n\nTómalo como oído entrenado, no como norma. Para escribir, para exámenes y para entenderte con cualquiera, usa batua. Para captar lo que oyes en una taberna de Gernika, ten estas notas a mano.\n\nY contrástalo con alguien de allí en cuanto puedas. Ninguna app sustituye eso.", "ejemplos": []}], "ejercicios": [{"id": "u5-g01", "variantes": [{"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "hiru", "es": "3"}, {"eu": "bost", "es": "5"}, {"eu": "zazpi", "es": "7"}, {"eu": "hamar", "es": "10"}]}, {"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "bi", "es": "2"}, {"eu": "lau", "es": "4"}, {"eu": "sei", "es": "6"}, {"eu": "zortzi", "es": "8"}]}, {"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "bat", "es": "1"}, {"eu": "bederatzi", "es": "9"}, {"eu": "hiru", "es": "3"}, {"eu": "hamar", "es": "10"}]}, {"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "lau", "es": "4"}, {"eu": "zazpi", "es": "7"}, {"eu": "bederatzi", "es": "9"}, {"eu": "bost", "es": "5"}]}, {"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "bat", "es": "1"}, {"eu": "bi", "es": "2"}, {"eu": "sei", "es": "6"}, {"eu": "zortzi", "es": "8"}]}]}, {"id": "u5-g02", "variantes": [{"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "hamabi", "es": "12"}, {"eu": "hamabost", "es": "15"}, {"eu": "hemezortzi", "es": "18"}, {"eu": "hogei", "es": "20"}]}, {"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "hamaika", "es": "11"}, {"eu": "hamahiru", "es": "13"}, {"eu": "hamasei", "es": "16"}, {"eu": "hemeretzi", "es": "19"}]}, {"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "hamalau", "es": "14"}, {"eu": "hamazazpi", "es": "17"}, {"eu": "hemezortzi", "es": "18"}, {"eu": "hamaika", "es": "11"}]}, {"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "hamahiru", "es": "13"}, {"eu": "hamabost", "es": "15"}, {"eu": "hemeretzi", "es": "19"}, {"eu": "hogei", "es": "20"}]}, {"tipo": "pares", "instruccion": "Empareja los números", "pares": [{"eu": "hamabi", "es": "12"}, {"eu": "hamalau", "es": "14"}, {"eu": "hamasei", "es": "16"}, {"eu": "hamazazpi", "es": "17"}]}]}, {"id": "u5-g03", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo se dice «11»?", "opciones": ["hamabat", "hamaika", "hamar bat", "hamabi"], "correcta": 1, "explicacion": "«Hamaika» es irregular: no sigue el patrón hama- + número."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿En cuál de estos cambia la vocal del prefijo?", "opciones": ["hamabi", "hamalau", "hemeretzi", "hamasei"], "correcta": 2, "explicacion": "En 18 y 19 el «hama-» suena «heme-»: hemezortzi, hemeretzi. Los números que hay debajo son los de siempre."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Si «hamar» es 10 y «lau» es 4, ¿cómo se dice 14?", "opciones": ["hamarlau", "hamalau", "lauhamar", "hemelau"], "correcta": 1, "explicacion": "El «hamar» pierde la -r: hama + lau."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«hemezortzi» (18) se compone de «hamar» (10) y «zortzi» (8). ¿Qué le pasa al «hama-»?", "opciones": ["Se queda igual", "Suena «heme-»", "Desaparece", "Se pone detrás"], "correcta": 1, "explicacion": "Los números son los mismos que en el resto de la serie. Lo único distinto es la vocal del prefijo: «heme-» en lugar de «hama-»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "El euskera cuenta en base…", "opciones": ["diez", "doce", "veinte", "cinco"], "correcta": 2, "explicacion": "Base veinte: berrogei (40) es «dos veintes», laurogei (80) «cuatro veintes»."}]}, {"id": "u5-g04", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nik txakurra ____.", "opciones": ["naiz", "dut", "da", "ditut"], "correcta": 1, "explicacion": "«Nik» + un objeto en singular («txakurra») → «dut»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hark etxe bat ____.", "opciones": ["du", "dut", "da", "ditu"], "correcta": 0, "explicacion": "«Hark» + objeto singular → «du»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Guk katu bat ____.", "opciones": ["dugu", "ditugu", "gara", "dute"], "correcta": 0, "explicacion": "«Guk» + objeto singular → «dugu»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zuk laguna ____.", "opciones": ["zara", "duzu", "dituzu", "du"], "correcta": 1, "explicacion": "«Zuk» + objeto singular → «duzu»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek etxe bat ____.", "opciones": ["dira", "dute", "dituzte", "du"], "correcta": 1, "explicacion": "«Haiek» + objeto singular → «dute»."}]}, {"id": "u5-g05", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nik hiru katu ____.", "opciones": ["dut", "ditut", "naiz", "dira"], "correcta": 1, "explicacion": "Son tres gatos, objeto plural: entra la -it- de «ditut»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek bi etxe ____.", "opciones": ["dute", "dituzte", "dira", "ditugu"], "correcta": 1, "explicacion": "«Haiek» + objeto plural («bi etxe») → «dituzte»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué cambia entre «katu bat dut» y «bi katu ditut»?", "opciones": ["El nombre", "El verbo", "Los dos", "Ninguno"], "correcta": 1, "explicacion": "El nombre «katu» no se pluraliza; lo que marca el plural es el verbo."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Guk lau lagun ____.", "opciones": ["dugu", "ditugu", "gara", "dituzue"], "correcta": 1, "explicacion": "«Guk» + objeto plural → «ditugu»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué sílaba marca el objeto plural en el verbo?", "opciones": ["-te-", "-it-", "-zu-", "-gu-"], "correcta": 1, "explicacion": "dut → ditut, dugu → ditugu, du → ditu."}]}, {"id": "u5-g06", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿En cuál de estas frases el sujeto lleva -k?", "opciones": ["___ ikaslea naiz.", "___ Bilbokoa naiz.", "___ bi anaia ditut.", "___ oso ondo nago."], "correcta": 2, "explicacion": "Solo cuando el verbo tiene complemento directo el sujeto lleva -k: «Nik bi anaia ditut»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Por qué se dice «Nik txakurra dut» pero «Ni ikaslea naiz»?", "opciones": ["Por costumbre", "Porque «tener» lleva complemento directo y «ser» no", "Porque «txakurra» es masculino", "Porque son frases de distinta longitud"], "correcta": 1, "explicacion": "El ergativo -k aparece cuando el verbo tiene objeto directo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál de estas frases tiene el sujeto mal marcado?", "opciones": ["Nik bi katu ditut.", "Ni medikua naiz.", "Ni hiru anaia ditut.", "Hark etxea du."], "correcta": 2, "explicacion": "Debería ser «Nik hiru anaia ditut»: hay complemento directo, así que toca ergativo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo se llama esa marca «-k» del sujeto?", "opciones": ["Genitivo", "Ergativo", "Locativo", "Dativo"], "correcta": 1, "explicacion": "El caso ergativo. Es la seña de identidad gramatical del euskera."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Hark» es la forma ergativa de…", "opciones": ["haiek", "hura", "gu", "zu"], "correcta": 1, "explicacion": "hura → hark, igual que ni → nik y zu → zuk."}]}, {"id": "u5-g07", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Tengo veinte años.", "eu": "Hogei urte ditut.", "palabras": ["Hogei", "urte", "ditut."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Tengo dieciocho años.", "eu": "Hemezortzi urte ditut.", "palabras": ["Hemezortzi", "urte", "ditut."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ella tiene doce años.", "eu": "Hark hamabi urte ditu.", "palabras": ["Hark", "hamabi", "urte", "ditu."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Tengo quince años.", "eu": "Hamabost urte ditut.", "palabras": ["Hamabost", "urte", "ditut."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Tú tienes diez años.", "eu": "Zuk hamar urte dituzu.", "palabras": ["Zuk", "hamar", "urte", "dituzu."]}]}, {"id": "u5-g08", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Cuántos años tienes?", "eu": "Zenbat urte dituzu?", "palabras": ["Zenbat", "urte", "dituzu?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Yo tengo dos hermanas.", "eu": "Nik bi ahizpa ditut.", "palabras": ["Nik", "bi", "ahizpa", "ditut."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Nosotros tenemos un gato.", "eu": "Guk katu bat dugu.", "palabras": ["Guk", "katu", "bat", "dugu."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Yo tengo un perro.", "eu": "Nik txakur bat dut.", "palabras": ["Nik", "txakur", "bat", "dut."]}, {"ti ["zenbat urte dituzu", "zenbat urte dituzu?"], "pista": "Empieza por «zenbat»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Tengo doce años.", "respuestas": ["hamabi urte ditut", "nik hamabi urte ditut"], "pista": "hamar + bi."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Ella tiene dieciocho años.", "respuestas": ["hark hemezortzi urte ditu", "hemezortzi urte ditu", "berak hemezortzi urte ditu"], "pista": "Diez y ocho, pero con el prefijo en «heme-»."}]}, {"id": "u5-g11", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Ane es una chica y habla de su hermana. ¿Qué palabra usa?", "opciones": ["arreba", "ahizpa", "anaia", "neba"], "correcta": 1, "explicacion": "Una chica dice «ahizpa» para su hermana. Un chico diría «arreba»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Ane es una chica y habla de su hermano. ¿Qué palabra usa?", "opciones": ["anaia", "neba", "arreba", "ahizpa"], "correcta": 1, "explicacion": "Una chica dice «neba». Un chico diría «anaia»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿De qué depende que se diga «anaia» o «neba»?", "opciones": ["De la edad del hermano", "Del sexo de quien tiene ese hermano", "Del dialecto", "De si es mayor o menor"], "correcta": 1, "explicacion": "Depende del sexo de quien tiene el hermano: «anaia» si es un chico, «neba» si es una chica."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Mikel es un chico y habla de su hermana. ¿Qué palabra usa?", "opciones": ["arreba", "ahizpa", "neba", "alaba"], "correcta": 0, "explicacion": "Un chico dice «arreba». Una chica diría «ahizpa»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Mikel es un chico y habla de su hermano. ¿Qué palabra usa?", "opciones": ["neba", "ahizpa", "anaia", "arreba"], "correcta": 2, "explicacion": "Un chico dice «anaia». Una chica diría «neba»."}]}, {"id": "u5-g12", "variantes": [{"tipo": "pares", "instruccion": "Empareja la familia", "pares": [{"eu": "aita", "es": "padre"}, {"eu": "ama", "es": "madre"}, {"eu": "txakurra", "es": "el perro"}, {"eu": "katua", "es": "el gato"}]}, {"tipo": "pares", "instruccion": "Empareja la familia", "pares": [{"eu": "semea", "es": "el hijo"}, {"eu": "alaba", "es": "la hija"}, {"eu": "aita", "es": "padre"}, {"eu": "ama", "es": "madre"}]}, {"tipo": "pares", "instruccion": "Empareja los hermanos", "pares": [{"eu": "anaia", "es": "hermano (de un chico)"}, {"eu": "arreba", "es": "hermana (de un chico)"}, {"eu": "neba", "es": "hermano (de una chica)"}, {"eu": "ahizpa", "es": "hermana (de una chica)"}]}, {"tipo": "pares", "instruccion": "Empareja el batua con el bizkaiera", "pares": [{"eu": "dut", "es": "dot"}, {"eu": "du", "es": "dau"}, {"eu": "dugu", "es": "dogu"}, {"eu": "dute", "es": "dabe"}]}, {"tipo": "pares", "instruccion": "Empareja cada forma ergativa con su pronombre", "pares": [{"eu": "nik", "es": "ni"}, {"eu": "zuk", "es": "zu"}, {"eu": "hark", "es": "hura"}, {"eu": "guk", "es": "gu"}]}]}]}, {"id": "u6", "numero": 6, "titulo": "Non zaude?", "subtitulo": "Lugares y la casa", "objetivo": "Decir dónde estás y describir tu casa con el verbo «egon» y el caso locativo.", "color": "ocre", "vocabulario": [{"eu": "nago", "es": "(yo) estoy", "nota": null}, {"eu": "zaude", "es": "(tú) estás", "nota": null}, {"eu": "dago", "es": "(él/ella) está", "nota": null}, {"eu": "daude", "es": "(ellos) están", "nota": null}, {"eu": "etxea", "es": "la casa", "nota": null}, {"eu": "gela", "es": "la habitación / el aula", "nota": null}, {"eu": "logela", "es": "el dormitorio", "nota": "De «lo» (sueño) + «gela» (habitación)."}, {"eu": "sukaldea", "es": "la cocina", "nota": "De «su» (fuego) + «alde» (zona)."}, {"eu": "komuna", "es": "el baño", "nota": null}, {"eu": "atea", "es": "la puerta", "nota": null}, {"eu": "leihoa", "es": "la ventana", "nota": null}, {"eu": "mahaia", "es": "la mesa", "nota": null}, {"eu": "aulkia", "es": "la silla", "nota": null}, {"eu": "ohea", "es": "la cama", "nota": null}, {"eu": "kalea", "es": "la calle", "nota": null}, {"eu": "eskola", "es": "la escuela", "nota": null}, {"eu": "lana", "es": "el trabajo", "nota": null}, {"eu": "taberna", "es": "el bar", "nota": null}, {"eu": "herria", "es": "el pueblo", "nota": "También «el pueblo» en sentido de nación."}, {"eu": "hemen", "es": "aquí", "nota": null}, {"eu": "hor", "es": "ahí", "nota": null}, {"eu": "han", "es": "allí", "nota": null}, {"eu": "handia", "es": "grande", "nota": null}, {"eu": "txikia", "es": "pequeño/a", "nota": null}, {"eu": "berria", "es": "nuevo/a", "nota": "Como en «Bilbo Berria»."}, {"eu": "zaharra", "es": "viejo/a", "nota": "Como en «Parte Zaharra»."}, {"eu": "polita", "es": "bonito/a", "nota": null}, {"eu": "bizi naiz", "es": "vivo", "nota": "Frase hecha: «bizi» + el verbo «izan»."}], "gramatica": [{"titulo": "El verbo «egon» (estar) en presente", "cuerpo": "El euskera distingue <b>ser<\/b> (izan) de <b>estar<\/b> (egon), igual que el castellano:\n\n<b>ni nago<\/b> — yo estoy\n<b>zu zaude<\/b> — tú estás\n<b>hura dago<\/b> — él/ella está\n<b>gu gaude<\/b> — nosotros estamos\n<b>zuek zaudete<\/b> — vosotros estáis\n<b>haiek daude<\/b> — ellos están\n\nFíjate en que el sujeto <b>no lleva -k<\/b>. «Estar» no tiene complemento directo, así que se comporta como «ser»: <i>ni nago<\/i>, no «nik nago».\n\nSe usa para ubicación y para estados pasajeros, más o menos como en castellano.", "ejemplos": [{"eu": "Ni etxean nago.", "es": "Estoy en casa."}, {"eu": "Non zaude?", "es": "¿Dónde estás?"}, {"eu": "Oso ondo nago.", "es": "Estoy muy bien."}]}, {"titulo": "«En» se dice con -n al final", "cuerpo": "Lo anticipamos en la unidad de preguntas: <b>Non?<\/b> se responde con <b>-n<\/b>. Aquí van los detalles.\n\nEl euskera no tiene preposiciones delante: pone sufijos detrás. El <b>-n<\/b> va después del artículo:\n\n<b>etxea<\/b> (la casa) → <b>etxean<\/b> (en la casa)\n<b>eskola<\/b> (la escuela) → <b>eskolan<\/b>\n<b>kalea<\/b> (la calle) → <b>kalean<\/b>\n\nCon nombres de lugar, se añade <b>-n<\/b> directamente si acaba en vocal:\n\n<b>Bilbo<\/b> → <b>Bilbon<\/b>\n<b>Gernika<\/b> → <b>Gernikan<\/b>\n\nSi acaba en consonante, se intercala una -e-: <b>Gasteiz<\/b> → <b>Gasteizen<\/b>.", "ejemplos": [{"eu": "Gernikan bizi naiz.", "es": "Vivo en Gernika."}, {"eu": "Lanean nago.", "es": "Estoy en el trabajo."}, {"eu": "Sukaldean dago.", "es": "Está en la cocina."}]}, {"titulo": "Las cuatro preguntas de lugar, completas", "cuerpo": "Ahora ya puedes cerrar el cuadro que empezaste en la tercera unidad:\n\n<b>Non?<\/b> (¿dónde?) → <b>-n<\/b>: <i>Bilbo<b>n<\/b><\/i>, en Bilbao\n<b>Nora?<\/b> (¿adónde?) → <b>-ra<\/b>: <i>Bilbo<b>ra<\/b><\/i>, a Bilbao\n<b>Nondik?<\/b> (¿de dónde?) → <b>-tik<\/b>: <i>Bilbo<b>tik<\/b><\/i>, desde Bilbao\n<b>Nongoa?<\/b> (¿de dónde eres?) → <b>-koa<\/b>: <i>Bilbo<b>koa<\/b><\/i>, de Bilbao\n\nCuatro preguntas, cuatro sufijos, y la respuesta lleva siempre la misma cola que la pregunta.\n\nEste sistema de sufijos que encajan unos con otros es el corazón del euskera. Cuando llegues a los casos que faltan (a quién, con quién, para quién), ya sabrás cómo funciona el mecanismo.", "ejemplos": [{"eu": "Non zaude? — Etxean nago.", "es": "¿Dónde estás? — Estoy en casa."}, {"eu": "Nongoa zara? — Gernikakoa naiz.", "es": "¿De dónde eres? — Soy de Gernika."}, {"eu": "Nora zoaz? — Bilbora.", "es": "¿Adónde vas? — A Bilbao."}]}, {"titulo": "Adjetivos: detrás, y con el artículo al final", "cuerpo": "Ya lo viste en la primera unidad y con los posesivos. Aquí queda del todo:\n\n<b>etxe<\/b> + <b>handi<\/b> + <b>-a<\/b> → <b>etxe handia<\/b> (la casa grande)\n<b>gela<\/b> + <b>txiki<\/b> + <b>-a<\/b> → <b>gela txikia<\/b>\n\nNo se dice «etxea handia». <b>El artículo aparece una sola vez, al final del grupo.<\/b>\n\nY si además hay posesivo, va delante de todo:\n\n<b>nire etxe handia<\/b> — mi casa grande", "ejemplos": [{"eu": "etxe handia", "es": "la casa grande"}, {"eu": "logela txikia", "es": "el dormitorio pequeño"}, {"eu": "nire herri polita", "es": "mi pueblo bonito"}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "<b>egon en bizkaiera<\/b>\n\n<b>ni nago<\/b> — igual que en batua\n<b>zu zagoz<\/b> — batua: zaude\n<b>hura dago<\/b> — igual\n<b>gu gagoz<\/b> — gaude\n<b>zuek zagoze<\/b> — zaudete\n<b>haiek dagoz<\/b> — daude\n\nOtra vez esa <b>-z<\/b> del plural que ya viste en <i>doguz<\/i>. Es un rasgo sistemático del bizkaiera, no un capricho suelto.\n\nAsí que «¿dónde estás?» en Gernika es <b>Non zagoz?<\/b>\n\n<b>El locativo con la vocal cambiada<\/b>\nSi el artículo <i>-ea<\/i> se convierte en <i>-ie<\/i>, el locativo arrastra el cambio: <i>etxean<\/i> pasa a <b>etxien<\/b>. Por eso «estoy en casa» suena por allí algo así como <i>etxien nago<\/i>.\n\n<b>Zelan y zelango<\/b>\nAl <i>zelan<\/i> (cómo) se le añade el mismo <i>-ko<\/i> que a los lugares: <b>zelango<\/b> = «de qué tipo». Donde el batua dice <i>nolako etxea?<\/i>, el bizkaiera dice <b>zelango etxie?<\/b>", "ejemplos": [{"eu": "Non zagoz?", "es": "¿Dónde estás? (bizkaiera) — batua: Non zaude?"}, {"eu": "Etxien nago.", "es": "Estoy en casa. — batua: Etxean nago."}, {"eu": "Haiek tabernan dagoz.", "es": "Ellos están en el bar. — batua: daude."}]}, {"titulo": "Un aviso sobre los dialectos", "cuerpo": "El habla cambia de pueblo a pueblo, y a veces de barrio a barrio. Lo que te cuento como «de Gernika» es bizkaiera de Busturialdea en general, y no todo el mundo de allí lo dice igual: quien se ha escolarizado en batua mezcla las dos cosas constantemente.\n\nTómalo como oído entrenado, no como norma. Para escribir, para exámenes y para entenderte con cualquiera, usa batua. Para captar lo que oyes en una taberna de Gernika, ten estas notas a mano.\n\nY contrástalo con alguien de allí en cuanto puedas. Ninguna app sustituye eso.", "ejemplos": []}], "ejercicios": [{"id": "u6-g01", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni etxean ____.", "opciones": ["naiz", "nago", "dut", "dago"], "correcta": 1, "explicacion": "Ubicación → «egon». Con «ni» va «nago»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zu tabernan ____.", "opciones": ["zara", "zaude", "dago", "gaude"], "correcta": 1, "explicacion": "Con «zu» + «egon» va «zaude»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hura eskolan ____.", "opciones": ["da", "dago", "dut", "daude"], "correcta": 1, "explicacion": "Ubicación → «egon». Con «hura» va «dago»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni oso ondo ____.", "opciones": ["naiz", "nago", "dut", "gara"], "correcta": 1, "explicacion": "«Egon» también sirve para estados pasajeros, como en castellano."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Bera kalean ____.", "opciones": ["da", "dago", "daude", "nago"], "correcta": 1, "explicacion": "«Bera» equivale a «hura», así que el verbo es «dago»."}]}, {"id": "u6-g02", "variantes": [{"tipo": "pares", "instruccion": "Empareja las partes de la casa", "pares": [{"eu": "sukaldea", "es": "la cocina"}, {"eu": "logela", "es": "el dormitorio"}, {"eu": "komuna", "es": "el baño"}, {"eu": "atea", "es": "la puerta"}]}, {"tipo": "pares", "instruccion": "Empareja los muebles", "pares": [{"eu": "mahaia", "es": "la mesa"}, {"eu": "aulkia", "es": "la silla"}, {"eu": "ohea", "es": "la cama"}, {"eu": "leihoa", "es": "la ventana"}]}, {"tipo": "pares", "instruccion": "Empareja cada palabra con sus piezas", "pares": [{"eu": "logela", "es": "lo (sueño) + gela"}, {"eu": "sukaldea", "es": "su (fuego) + alde"}, {"eu": "etxea", "es": "etxe + artículo -a"}, {"eu": "atea", "es": "ate + artículo -a"}]}, {"tipo": "pares", "instruccion": "Empareja las palabras de la casa", "pares": [{"eu": "gela", "es": "la habitación"}, {"eu": "ohea", "es": "la cama"}, {"eu": "komuna", "es": "el baño"}, {"eu": "leihoa", "es": "la ventana"}]}, {"tipo": "pares", "instruccion": "Empareja los muebles y aperturas", "pares": [{"eu": "atea", "es": "la puerta"}, {"eu": "leihoa", "es": "la ventana"}, {"eu": "mahaia", "es": "la mesa"}, {"eu": "aulkia", "es": "la silla"}]}]}, {"id": "u6-g03", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo se dice «en Bilbao»?", "opciones": ["Bilbokoa", "Bilbon", "Bilbora", "Bilbotik"], "correcta": 1, "explicacion": "«-n» indica ubicación. «-koa» sería procedencia y «-ra» destino."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo se dice «en Gernika»?", "opciones": ["Gernikara", "Gernikakoa", "Gernikan", "Gernika"], "correcta": 2, "explicacion": "Acaba en vocal, así que se añade la -n directamente."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Gasteiz» acaba en consonante. ¿Cómo se dice «en Vitoria»?", "opciones": ["Gasteizn", "Gasteizen", "Gasteiza", "Gasteizko"], "correcta": 1, "explicacion": "Tras consonante se intercala una -e-: Gasteiz + e + n."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Donostian» significa…", "opciones": ["De San Sebastián", "En San Sebastián", "A San Sebastián", "Desde San Sebastián"], "correcta": 1, "explicacion": "Termina en -n: ubicación."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál de estas frases significa «vivo en Gernika»?", "opciones": ["Gernikakoa naiz.", "Gernikan bizi naiz.", "Gernikara noa.", "Gernikatik nator."], "correcta": 1, "explicacion": "«Bizi naiz» es «vivo», y el lugar lleva el sufijo -n."}]}, {"id": "u6-g04", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Estoy en la cocina» se dice…", "opciones": ["Sukalde nago.", "Sukaldean nago.", "Sukaldekoa naiz.", "Sukaldea nago."], "correcta": 1, "explicacion": "sukalde + a (artículo) + n (en) → sukaldean."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Está en la calle» se dice…", "opciones": ["Kalean dago.", "Kalea dago.", "Kalekoa da.", "Kalera dago."], "correcta": 0, "explicacion": "kale + a + n → kalean, y con «hura» el verbo es «dago»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿En qué orden se montan los sufijos en «etxean»?", "opciones": ["raíz + n + a", "raíz + a + n", "raíz + ko + n", "raíz + n solo"], "correcta": 1, "explicacion": "Primero el artículo, después el caso: etxe + a + n."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Estoy en el trabajo» se dice…", "opciones": ["Lan nago.", "Lanean nago.", "Lanekoa naiz.", "Lanera nago."], "correcta": 1, "explicacion": "lan + a + n → lanean."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Están en la escuela» se dice…", "opciones": ["Eskolan daude.", "Eskola daude.", "Eskolakoak dira.", "Eskolara daude."], "correcta": 0, "explicacion": "Ubicación con -n, y «haiek» pide «daude»."}]}, {"id": "u6-g05", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Dónde estás tú?", "eu": "Non zaude zu?", "palabras": ["Non", "zaude", "zu?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Yo estoy en casa.", "eu": "Ni etxean nago.", "palabras": ["Ni", "etxean", "nago."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ellos están en el bar.", "eu": "Haiek tabernan daude.", "palabras": ["Haiek", "tabernan", "daude."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Vivo en Gernika.", "eu": "Gernikan bizi naiz.", "palabras": ["Gernikan", "bizi", "naiz."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ella está en la cocina.", "eu": "Hura sukaldean dago.", "palabras": ["Hura", "sukaldean", "dago."]}]}, {"id": "u6-g06", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«La casa grande» se dice…", "opciones": ["handia etxea", "etxea handia", "etxe handia", "handi etxea"], "correcta": 2, "explicacion": "El adjetivo va detrás y el artículo -a se pega solo al adjetivo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«El dormitorio pequeño» se dice…", "opciones": ["logela txikia", "txiki logela", "logelea txiki", "txikia logela"], "correcta": 0, "explicacion": "Sustantivo, adjetivo, y el artículo al final del grupo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Por qué está mal «etxea handia»?", "opciones": ["El adjetivo va delante", "El artículo aparece dos veces", "«handia» no existe", "Falta el verbo"], "correcta": 1, "explicacion": "El artículo -a se pone una sola vez, al final: «etxe handia»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«La ventana nueva» se dice…", "opciones": ["leiho berria", "leihoa berria", "berria leihoa", "berri leihoa"], "correcta": 0, "explicacion": "El artículo -a se pega al adjetivo, no al sustantivo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuántas veces aparece el artículo -a en «etxe handia»?", "opciones": ["Ninguna", "Una, al final del grupo", "Dos, en cada palabra", "Depende del adjetivo"], "correcta": 1, "explicacion": "Una sola vez, pegada al adjetivo. Por eso «etxe» va sin -a."}]}, {"id": "u6-g07", "variantes": [{"tipo": "pares", "instruccion": "Empareja los adjetivos", "pares": [{"eu": "handia", "es": "grande"}, {"eu": "txikia", "es": "pequeño"}, {"eu": "berria", "es": "nuevo"}, {"eu": "zaharra", "es": "viejo"}]}, {"tipo": "pares", "instruccion": "Empareja los adverbios de lugar", "pares": [{"eu": "hemen", "es": "aquí"}, {"eu": "hor", "es": "ahí"}, {"eu": "han", "es": "allí"}, {"eu": "non", "es": "dónde"}]}, {"tipo": "pares", "instruccion": "Empareja las palabras", "pares": [{"eu": "polita", "es": "bonito"}, {"eu": "zaharra", "es": "viejo"}, {"eu": "herria", "es": "el pueblo"}, {"eu": "kalea", "es": "la calle"}]}, {"tipo": "pares", "instruccion": "Empareja los contrarios", "pares": [{"eu": "handia", "es": "≠ txikia"}, {"eu": "berria", "es": "≠ zaharra"}, {"eu": "hemen", "es": "≠ han"}, {"eu": "bai", "es": "≠ ez"}]}, {"tipo": "pares", "instruccion": "Empareja las expresiones", "pares": [{"eu": "etxe handia", "es": "la casa grande"}, {"eu": "gela txikia", "es": "la habitación pequeña"}, {"eu": "kale zaharra", "es": "la calle vieja"}, {"eu": "herri polita", "es": "el pueblo bonito"}]}]}, {"id": "u6-g08", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Estoy en casa.", "respuestas": ["etxean nago", "ni etxean nago"], "pista": "etxe + a + n, y el verbo al final."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Estoy en el trabajo.", "respuestas": ["lanean nago", "ni lanean nago"], "pista": "«lan» + a + n."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Vivo en Gernika.", "respuestas": ["gernikan bizi naiz", "ni gernikan bizi naiz"], "pista": "«bizi naiz» es «vivo». El lugar va delante."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Estoy en la cocina.", "respuestas": ["sukaldean nago", "ni sukaldean nago"], "pista": "sukalde + a + n."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Estoy muy bien.", "respuestas": ["oso ondo nago", "ni oso ondo nago"], "pista": "Estado pasajero, así que «egon»."}]}, {"id": "u6-g09", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek tabernan ____.", "opciones": ["dago", "daude", "dira", "dute"], "correcta": 1, "explicacion": "Con «haiek» + egon → «daude»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gu eskolan ____.", "opciones": ["gara", "gaude", "daude", "nago"], "correcta": 1, "explicacion": "Ubicación → «egon». Con «gu» va «gaude»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zuek kalean ____.", "opciones": ["zarete", "zaudete", "daude", "zaude"], "correcta": 1, "explicacion": "Con «zuek» + egon → «zaudete»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Lleva -k el sujeto con el verbo «egon»?", "opciones": ["Sí, siempre", "No, porque no hay complemento directo", "Solo en plural", "Solo en preguntas"], "correcta": 1, "explicacion": "«Ni nago», no «nik nago». El ergativo solo aparece con objeto directo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál de estas frases está mal?", "opciones": ["Ni etxean nago.", "Nik etxean nago.", "Hura kalean dago.", "Gu lanean gaude."], "correcta": 1, "explicacion": "«Egon» no lleva objeto directo, así que el sujeto va sin -k."}]}, {"id": "u6-g10", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Mi casa es pequeña.", "eu": "Nire etxea txikia da.", "palabras": ["Nire", "etxea", "txikia", "da."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "La calle es vieja.", "eu": "Kalea zaharra da.", "palabras": ["Kalea", "zaharra", "da."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Mi pueblo es bonito.", "eu": "Nire herria polita da.", "palabras": ["Nire", "herria", "polita", "da."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Nuestra casa es grande.", "eu": "Gure etxea handia da.", "palabras": ["Gure", "etxea", "handia", "da."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "La cocina es nueva.", "eu": "Sukaldea berria da.", "palabras": ["Sukaldea", "berria", "da."]}]}, {"id": "u6-g11", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Alguien te pregunta «Nongoa zara?». ¿Qué te está preguntando?", "opciones": ["Dónde estás", "De dónde eres", "Adónde vas", "Cómo te llamas"], "correcta": 1, "explicacion": "«Non» es dónde; «Nongoa» es de dónde. La diferencia está en el -ko."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Y si te preguntan «Nora zoaz?»", "opciones": ["De dónde eres", "Dónde estás", "Adónde vas", "Con quién vas"], "correcta": 2, "explicacion": "«Nora» es «adónde», y se responde con el sufijo -ra: «Bilbora»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál es la pregunta para «Etxean nago»?", "opciones": ["Nongoa zara?", "Nora zoaz?", "Non zaude?", "Nor zara?"], "correcta": 2, "explicacion": "Respuesta con -n → pregunta con «Non»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál es la pregunta para «Gernikakoa naiz»?", "opciones": ["Non zaude?", "Nongoa zara?", "Nondik zatoz?", "Nora zoaz?"], "correcta": 1, "explicacion": "Respuesta con -koa → pregunta con «Nongoa»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué tienen en común la pregunta y su respuesta?", "opciones": ["El verbo", "La misma terminación", "La longitud", "Nada"], "correcta": 1, "explicacion": "Non/-n, Nora/-ra, Nondik/-tik, Nongoa/-koa. El sistema encaja."}]}, {"id": "u6-g12", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál de estos sufijos significa «hacia / adónde»?", "opciones": ["-n", "-ko", "-ra", "-a"], "correcta": 2, "explicacion": "«-ra» es destino: Bilbora = a Bilbao. Responde a «Nora?»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa «Bilbora»?", "opciones": ["En Bilbao", "De Bilbao", "A Bilbao", "Desde Bilbao"], "correcta": 2, "explicacion": "El sufijo -ra marca destino."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En Gernika oyes «Non zagoz?». ¿Qué forma del batua es «zagoz»?", "opciones": ["zara", "zaude", "zaudete", "dago"], "correcta": 1, "explicacion": "«Zagoz» es el «zaude» del bizkaiera. También cambian gaude→gagoz y daude→dagoz."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En bizkaiera, «etxean» suena a menudo…", "opciones": ["etxien", "etxeon", "etxan", "etxaan"], "correcta": 0, "explicacion": "La asimilación del artículo (-ea → -ie) arrastra también al locativo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué tienen en común «doguz», «dagoz» y «dodaz» en bizkaiera?", "opciones": ["Son del pasado", "Llevan la -z del plural", "Son preguntas", "Son de tercera persona"], "correcta": 1, "explicacion": "El bizkaiera marca el plural con -z donde el batua usa -it-."}]}]}, {"id": "u7", "numero": 7, "titulo": "Zer ordu da?", "subtitulo": "La hora, los días y la rutina", "objetivo": "Decir la hora, los días de la semana y a qué hora haces las cosas.", "color": "azul", "vocabulario": [{"eu": "ordua", "es": "la hora", "nota": null}, {"eu": "Zer ordu da?", "es": "¿Qué hora es?", "nota": null}, {"eu": "eta erdiak", "es": "y media", "nota": "Aquí la hora NO lleva -ak: «hiru eta erdiak» (las tres y media). El plural lo lleva solo «erdiak»."}, {"eu": "eta laurden", "es": "y cuarto", "nota": null}, {"eu": "laurden gutxi", "es": "menos cuarto", "nota": "«gutxi» es «poco»: «cuarto de menos»."}, {"eu": "eguna", "es": "el día", "nota": null}, {"eu": "astea", "es": "la semana", "nota": null}, {"eu": "asteburua", "es": "el fin de semana", "nota": "De «aste» (semana) + «buru» (cabeza)."}, {"eu": "astelehena", "es": "el lunes", "nota": null}, {"eu": "asteartea", "es": "el martes", "nota": null}, {"eu": "asteazkena", "es": "el miércoles", "nota": null}, {"eu": "osteguna", "es": "el jueves", "nota": null}, {"eu": "ostirala", "es": "el viernes", "nota": null}, {"eu": "larunbata", "es": "el sábado", "nota": null}, {"eu": "igandea", "es": "el domingo", "nota": null}, {"eu": "goiza", "es": "la mañana", "nota": null}, {"eu": "eguerdia", "es": "el mediodía", "nota": "De «egu-» (día) + «erdi» (mitad)."}, {"eu": "arratsaldea", "es": "la tarde", "nota": null}, {"eu": "iluntzea", "es": "el anochecer", "nota": "De «ilun» (oscuro)."}, {"eu": "gaua", "es": "la noche", "nota": null}, {"eu": "gaur", "es": "hoy", "nota": null}, {"eu": "
