bihar", "es": "mañana", "nota": null}, {"eu": "atzo", "es": "ayer", "nota": null}, {"eu": "etzi", "es": "pasado mañana", "nota": null}, {"eu": "bart", "es": "anoche", "nota": null}, {"eu": "orain", "es": "ahora", "nota": null}, {"eu": "gero", "es": "luego, después", "nota": null}, {"eu": "beti", "es": "siempre", "nota": null}, {"eu": "askotan", "es": "a menudo", "nota": null}, {"eu": "batzuetan", "es": "a veces", "nota": null}, {"eu": "inoiz ez", "es": "nunca", "nota": "«inoiz» solo significa «alguna vez»; el «ez» es lo que lo niega."}, {"eu": "goiz", "es": "temprano", "nota": "Sin artículo es «temprano»; con él, «la mañana»."}, {"eu": "berandu", "es": "tarde", "nota": "Adverbio. No confundir con «arratsaldea», que es el rato de la tarde."}], "gramatica": [{"titulo": "La hora va en plural", "cuerpo": "En euskera las horas son <b>plurales<\/b>, porque se cuentan campanadas. Por eso llevan la <b>-ak<\/b> del plural que ya conoces y el verbo va en <b>dira<\/b> (son):\n\n<b>Ordu bata da.<\/b> — Es la una.\n<b>Ordu biak dira.<\/b> — Son las dos.\n<b>Hirurak dira.<\/b> — Son las tres.\n<b>Laurak dira.<\/b> — Son las cuatro.\n<b>Bostak dira.<\/b> — Son las cinco.\n<b>Seiak dira.<\/b> — Son las seis.\n<b>Zazpiak dira.<\/b> — Son las siete.\n<b>Zortziak dira.<\/b> — Son las ocho.\n<b>Bederatziak dira.<\/b> — Son las nueve.\n<b>Hamarrak dira.<\/b> — Son las diez.\n<b>Hamaikak dira.<\/b> — Son las once.\n<b>Hamabiak dira.<\/b> — Son las doce.\n\nLa una y las dos son la excepción: llevan <b>ordu<\/b> delante, y la una va en singular (<i>ordu bata <b>da<\/b><\/i>).\n\nSon los números de la quinta unidad con el artículo pegado. <i>hiru<\/i> → <i>hirurak<\/i>, <i>lau<\/i> → <i>laurak<\/i>, <i>bost<\/i> → <i>bostak<\/i>.", "ejemplos": [{"eu": "Zer ordu da?", "es": "¿Qué hora es?"}, {"eu": "Ordu bata da.", "es": "Es la una."}, {"eu": "Hamarrak dira.", "es": "Son las diez."}]}, {"titulo": "Y media, y cuarto, menos cuarto", "cuerpo": "Los minutos se cuelgan detrás con <b>eta<\/b> (y) o con <b>gutxi<\/b> (menos):\n\n<b>Hirurak eta bost.<\/b> — Las tres y cinco.\n<b>Hirurak eta laurden.<\/b> — Las tres y cuarto.\n<b>Hiru eta erdiak.<\/b> — Las tres y media.\n<b>Laurak bost gutxi.<\/b> — Las cuatro menos cinco.\n<b>Laurak laurden gutxi.<\/b> — Las cuatro menos cuarto.\n\nOjo con <b>eta erdiak<\/b>: es la única forma que rompe el patrón. Aquí la hora <b>pierde la -ak<\/b> y se queda desnuda — <i>hiru<\/i> eta erdiak, <i>bost<\/i> eta erdiak, <i>zortzi<\/i> eta erdiak. El plural lo lleva solo <b>erdiak<\/b>, y el verbo va en <b>dira<\/b>. Decir <i>*hirurak eta erdiak<\/i> es un error corriente, pero error (Euskaltzaindia, araua 35).\n\nCon <b>laurden<\/b> y con los minutos, en cambio, la hora sí conserva la -ak: <i>hirurak<\/i> eta laurden, <i>laurak<\/i> bost gutxi.\n\nFíjate en el orden de «menos»: primero los minutos y luego <b>gutxi<\/b>, al revés que en castellano.\n\nY dos horas que se dicen con nombre propio:\n<b>eguerdia<\/b> — el mediodía\n<b>gauerdia<\/b> — la medianoche", "ejemplos": [{"eu": "Zortzi eta erdiak dira.", "es": "Son las ocho y media."}, {"eu": "Bostak laurden gutxi dira.", "es": "Son las cinco menos cuarto."}, {"eu": "Eguerdia da.", "es": "Es mediodía."}]}, {"titulo": "«A las…» se dice con -etan", "cuerpo": "Para decir <b>a qué hora<\/b> pasa algo se usa el locativo <b>-n<\/b> de la unidad anterior, pero sobre un plural. La forma que sale es <b>-etan<\/b>:\n\n<b>hirurak<\/b> (las tres) → <b>hiruretan<\/b> (a las tres)\n<b>bostak<\/b> → <b>bostetan<\/b>\n<b>zazpiak<\/b> → <b>zazpietan<\/b>\n<b>hamarrak<\/b> → <b>hamarretan<\/b>\n\nY las dos excepciones de siempre:\n<b>ordu batean<\/b> — a la una\n<b>ordu bietan<\/b> — a las dos\n\nY con «y media» el <b>-etan<\/b> se pega a <b>erdiak<\/b>, dejando la hora desnuda igual que antes:\n<b>hiru eta erdietan<\/b> — a las tres y media\n<b>zortzi eta erdietan<\/b> — a las ocho y media\n\nEse <b>-etan<\/b> no es solo para las horas: es el locativo de <b>plural<\/b> en general. <i>etxe<b>etan<\/b><\/i> = en las casas, <i>herri<b>etan<\/b><\/i> = en los pueblos. Compáralo con el singular: <i>etxe<b>an<\/b><\/i>, en la casa.", "ejemplos": [{"eu": "Zortzietan nago etxean.", "es": "A las ocho estoy en casa."}, {"eu": "Ordu bietan bazkaria.", "es": "A las dos, la comida."}, {"eu": "Hamarretan lanean nago.", "es": "A las diez estoy en el trabajo."}]}, {"titulo": "Los días de la semana", "cuerpo": "<b>astelehena<\/b> — lunes\n<b>asteartea<\/b> — martes\n<b>asteazkena<\/b> — miércoles\n<b>osteguna<\/b> — jueves\n<b>ostirala<\/b> — viernes\n<b>larunbata<\/b> — sábado\n<b>igandea<\/b> — domingo\n\nLos tres primeros empiezan por <b>aste-<\/b> (semana): <i>aste-lehena<\/i> es «el primero de la semana», <i>aste-artea<\/i> «el de en medio», <i>aste-azkena<\/i> «el último»… aunque el miércoles no sea el último. El nombre viene de una semana antigua más corta.\n\nPara decir <b>el lunes<\/b>, en el sentido de «ese día», otra vez la <b>-n<\/b>:\n\n<b>astelehenean, asteartean, asteazkenean, ostegunean, ostiralean, larunbatean, igandean<\/b>.\n\nY el fin de semana es <b>asteburua<\/b>, «la cabeza de la semana».", "ejemplos": [{"eu": "Larunbatean etxean nago.", "es": "El sábado estoy en casa."}, {"eu": "Gaur asteartea da.", "es": "Hoy es martes."}, {"eu": "Asteburua polita da.", "es": "El fin de semana es bonito."}]}, {"titulo": "Cuándo: el día, el rato y la costumbre", "cuerpo": "Los ratos del día llevan la misma <b>-n<\/b>:\n\n<b>goizean<\/b> — por la mañana\n<b>eguerdian<\/b> — a mediodía\n<b>arratsaldean<\/b> — por la tarde\n<b>iluntzean<\/b> — al anochecer\n<b>gauean<\/b> — por la noche\n\nLos días sueltos, en cambio, no llevan nada: <b>gaur<\/b> (hoy), <b>bihar<\/b> (mañana), <b>atzo<\/b> (ayer), <b>etzi<\/b> (pasado mañana), <b>bart<\/b> (anoche).\n\nSe combinan sin más: <b>gaur goizean<\/b> (esta mañana), <b>bihar arratsaldean<\/b> (mañana por la tarde).\n\nY para la frecuencia: <b>beti<\/b> (siempre), <b>askotan<\/b> (a menudo), <b>batzuetan<\/b> (a veces), <b>gutxitan<\/b> (pocas veces), <b>inoiz ez<\/b> (nunca).\n\nLo habitual es que la expresión de tiempo vaya <b>al principio de la frase<\/b>: <i>Gaur goizean etxean nago.<\/i>", "ejemplos": [{"eu": "Gaur goizean etxean nago.", "es": "Esta mañana estoy en casa."}, {"eu": "Bihar Bilbon nago.", "es": "Mañana estoy en Bilbao."}, {"eu": "Gauean beti nekatuta nago.", "es": "Por la noche siempre estoy cansado."}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "Aquí el bizkaiera no cambia un detalle: cambia <b>los nombres de los días<\/b>. Y es de lo primero que descoloca a quien llega con batua aprendido.\n\n<b>astelehena<\/b> — igual (a veces <i>astelena<\/i>)\n<b>martitzena<\/b> — batua: asteartea\n<b>eguaztena<\/b> — batua: asteazkena\n<b>eguena<\/b> — batua: osteguna\n<b>barikua<\/b> — batua: ostirala\n<b>zapatua<\/b> — batua: larunbata\n<b>domeka<\/b> — batua: igandea\n\nAsí que «el viernes por la noche» por allí es <b>barikuan gabean<\/b>, no <i>ostiralean gauean<\/i>. Los carteles y la prensa usan batua; la gente, en casa, sigue con estos.\n\n<b>gaua → gaba<\/b>\nLa noche es <b>gaba<\/b> en bizkaiera, de donde sale el <i>gabon<\/i> de «buenas noches» (gau on). En batua, <i>gaua<\/i>.\n\n<b>Ze ordu da?<\/b>\nEl <i>zer<\/i> del batua se acorta en <b>ze<\/b> delante de un nombre: <b>Ze ordu da?<\/b>, <b>Ze egun da gaur?<\/b>", "ejemplos": [{"eu": "Zapatuan Gernikan nago.", "es": "El sábado estoy en Gernika. — batua: Larunbatean."}, {"eu": "Ze ordu da?", "es": "¿Qué hora es? — batua: Zer ordu da?"}, {"eu": "Barikuan gabean.", "es": "El viernes por la noche. — batua: Ostiralean gauean."}]}], "ejercicios": [{"id": "u7-g01", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Son las tres. → ____ dira.", "opciones": ["Hiru", "Hirurak", "Hiruretan", "Hirugarren"], "correcta": 1, "explicacion": "Las horas van en plural: «hiru» + el artículo plural = «hirurak»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Son las cinco. → ____ dira.", "opciones": ["Bost", "Bostetan", "Bostak", "Bosgarren"], "correcta": 2, "explicacion": "«bost» + -ak = «bostak»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Es la una. → ____ da.", "opciones": ["Bata", "Ordu bata", "Orduak", "Ordu biak"], "correcta": 1, "explicacion": "La una es la excepción: lleva «ordu» delante y va en singular."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Son las diez. → ____ dira.", "opciones": ["Hamar", "Hamarrak", "Hamarretan", "Hamaikak"], "correcta": 1, "explicacion": "«hamar» duplica la erre al llevar artículo: «hamarrak»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Son las dos. → ____ dira.", "opciones": ["Biak", "Ordu biak", "Bi", "Ordu bata"], "correcta": 1, "explicacion": "Como la una, las dos llevan «ordu» delante. Pero el verbo ya va en plural: «dira»."}]}, {"id": "u7-g02", "variantes": [{"tipo": "pares", "instruccion": "Empareja los días de la semana", "pares": [{"eu": "astelehena", "es": "lunes"}, {"eu": "asteartea", "es": "martes"}, {"eu": "asteazkena", "es": "miércoles"}, {"eu": "osteguna", "es": "jueves"}]}, {"tipo": "pares", "instruccion": "Empareja los días de la semana", "pares": [{"eu": "osteguna", "es": "jueves"}, {"eu": "ostirala", "es": "viernes"}, {"eu": "larunbata", "es": "sábado"}, {"eu": "igandea", "es": "domingo"}]}, {"tipo": "pares", "instruccion": "Empareja las palabras del calendario", "pares": [{"eu": "astea", "es": "la semana"}, {"eu": "asteburua", "es": "el fin de semana"}, {"eu": "eguna", "es": "el día"}, {"eu": "ordua", "es": "la hora"}]}, {"tipo": "pares", "instruccion": "Empareja los ratos del día", "pares": [{"eu": "goiza", "es": "la mañana"}, {"eu": "eguerdia", "es": "el mediodía"}, {"eu": "arratsaldea", "es": "la tarde"}, {"eu": "gaua", "es": "la noche"}]}, {"tipo": "pares", "instruccion": "Empareja los días", "pares": [{"eu": "gaur", "es": "hoy"}, {"eu": "bihar", "es": "mañana"}, {"eu": "atzo", "es": "ayer"}, {"eu": "etzi", "es": "pasado mañana"}]}]}, {"id": "u7-g03", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A las siete. → ____", "opciones": ["zazpiak", "zazpietan", "zazpi", "zazpirak"], "correcta": 1, "explicacion": "«A las…» se dice con el locativo de plural: -etan."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A las tres. → ____", "opciones": ["hiruretan", "hirurak", "hiruan", "hirutan"], "correcta": 0, "explicacion": "hirurak → hiruretan."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A las diez. → ____", "opciones": ["hamarrak", "hamarrean", "hamarretan", "hamarrera"], "correcta": 2, "explicacion": "hamarrak → hamarretan."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A la una. → ____", "opciones": ["ordu batetan", "ordu batean", "ordu bata", "ordu bietan"], "correcta": 1, "explicacion": "La una es singular, así que lleva -ean, no -etan."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A las dos. → ____", "opciones": ["ordu bietan", "ordu biak", "ordu bian", "bietan"], "correcta": 0, "explicacion": "Las dos llevan «ordu» delante también aquí: «ordu bietan»."}]}, {"id": "u7-g04", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Son las ocho y media. → Zortzi eta ____ dira.", "opciones": ["erdi", "erdiak", "laurden", "gutxi"], "correcta": 1, "explicacion": "El plural lo lleva «erdiak»; la hora se queda sin -ak: «zortzi eta erdiak»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Las cuatro y cuarto. → Laurak eta ____.", "opciones": ["erdiak", "laurden", "gutxi", "laurdenak"], "correcta": 1, "explicacion": "«laurden» es el cuarto, y aquí no lleva plural."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Las cinco menos cuarto. → Bostak laurden ____.", "opciones": ["gutxi", "eta", "gehiago", "erdiak"], "correcta": 0, "explicacion": "«gutxi» (poco) es el «menos», y va al final."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Las nueve menos diez. → Bederatziak hamar ____.", "opciones": ["eta", "gutxi", "erdiak", "laurden"], "correcta": 1, "explicacion": "Primero los minutos, luego «gutxi». Al revés que en castellano."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Es mediodía. → ____ da.", "opciones": ["Gauerdia", "Eguerdia", "Goiza", "Iluntzea"], "correcta": 1, "explicacion": "«eguerdia» = egu (día) + erdi (mitad)."}]}, {"id": "u7-g05", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Hoy es lunes.", "eu": "Gaur astelehena da.", "palabras": ["Gaur", "astelehena", "da."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Esta mañana estoy en casa.", "eu": "Gaur goizean etxean nago.", "palabras": ["Gaur", "goizean", "etxean", "nago."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Mañana estoy en Bilbao.", "eu": "Bihar Bilbon nago.", "palabras": ["Bihar", "Bilbon", "nago."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "El sábado estoy en Gernika.", "eu": "Larunbatean Gernikan nago.", "palabras": ["Larunbatean", "Gernikan", "nago."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Por la noche siempre estoy en casa.", "eu": "Gauean beti etxean nago.", "palabras": ["Gauean", "beti", "etxean", "nago."]}]}, {"id": "u7-g06", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Por la mañana. → ____", "opciones": ["goiza", "goizean", "goizera", "goiz"], "correcta": 1, "explicacion": "Los ratos del día llevan la -n del locativo."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Por la tarde. → ____", "opciones": ["arratsaldea", "arratsaldean", "arratsaldera", "arratsalde"], "correcta": 1, "explicacion": "arratsaldea → arratsaldean."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Por la noche. → ____", "opciones": ["gauean", "gaua", "gauera", "gauetan"], "correcta": 0, "explicacion": "gaua → gauean."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A mediodía. → ____", "opciones": ["eguerdia", "eguerdian", "eguerdira", "eguerdiak"], "correcta": 1, "explicacion": "eguerdia → eguerdian."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "El domingo. → ____", "opciones": ["igandea", "igandean", "igandera", "igandeak"], "correcta": 1, "explicacion": "Los días también llevan -n cuando dices «el domingo»."}]}, {"id": "u7-g07", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gaur asteartea da. Bihar ____ da.", "opciones": ["astelehena", "asteazkena", "osteguna", "igandea"], "correcta": 1, "explicacion": "Después del martes viene el miércoles: asteazkena."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gaur ostirala da. Bihar ____ da.", "opciones": ["osteguna", "larunbata", "igandea", "asteartea"], "correcta": 1, "explicacion": "Después del viernes, el sábado: larunbata."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gaur igandea da. Bihar ____ da.", "opciones": ["larunbata", "ostirala", "astelehena", "asteazkena"], "correcta": 2, "explicacion": "Después del domingo empieza la semana: astelehena."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Asteazkena, osteguna, ____, larunbata.", "opciones": ["igandea", "ostirala", "asteartea", "astelehena"], "correcta": 1, "explicacion": "Entre el jueves y el sábado está el viernes: ostirala."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Larunbata eta igandea: ____ da.", "opciones": ["astea", "asteburua", "eguna", "ordua"], "correcta": 1, "explicacion": "Sábado y domingo son el «asteburua», el fin de semana."}]}, {"id": "u7-g08", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Son las cuatro.", "respuestas": ["laurak dira"], "pista": "El número lleva el artículo plural."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿Qué hora es?", "respuestas": ["zer ordu da", "ze ordu da"], "pista": "Tres palabras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Hoy es viernes.", "respuestas": ["gaur ostirala da"], "pista": "Empieza por «gaur»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "A las ocho estoy en casa.", "respuestas": ["zortzietan etxean nago", "zortzietan ni etxean nago", "ni zortzietan etxean nago", "etxean nago zortzietan"], "pista": "«A las ocho» lleva -etan."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Mañana por la tarde.", "respuestas": ["bihar arratsaldean"], "pista": "Dos palabras."}]}, {"id": "u7-g09", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Son las siete y media.", "eu": "Zazpi eta erdiak dira.", "palabras": ["Zazpi", "eta", "erdiak", "dira."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "A las diez estoy en el trabajo.", "eu": "Hamarretan lanean nago.", "palabras": ["Hamarretan", "lanean", "nago."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "El domingo por la mañana estoy en casa.", "eu": "Igande goizean etxean nago.", "palabras": ["Igande", "goizean", "etxean", "nago."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ahora son las doce.", "eu": "Orain hamabiak dira.", "palabras": ["Orain", "hamabiak", "dira."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "A las dos estoy en la escuela.", "eu": "Ordu bietan eskolan nago.", "palabras": ["Ordu", "bietan", "eskolan", "nago."]}]}, {"id": "u7-g10", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Siempre. → ____", "opciones": ["beti", "batzuetan", "askotan", "gero"], "correcta": 0, "explicacion": "«beti» es siempre."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A veces. → ____", "opciones": ["beti", "batzuetan", "inoiz ez", "orain"], "correcta": 1, "explicacion": "«batzuetan» es a veces. Lleva ese -etan de plural que ya conoces."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nunca. → ____", "opciones": ["inoiz ez", "askotan", "gero", "bart"], "correcta": 0, "explicacion": "«inoiz» solo es «alguna vez»: hace falta el «ez» para negar."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ahora. → ____", "opciones": ["gero", "orain", "gaur", "bihar"], "correcta": 1, "explicacion": "«orain» es ahora; «gero», luego."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Anoche. → ____", "opciones": ["atzo", "bart", "etzi", "gaur"], "correcta": 1, "explicacion": "«bart» es concretamente anoche; «atzo» es ayer en general."}]}, {"id": "u7-g11", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«El sábado» en bizkaiera de Gernika: ____", "opciones": ["larunbatean", "zapatuan", "domekan", "barikuan"], "correcta": 1, "explicacion": "En bizkaiera el sábado es «zapatua». En batua, «larunbata»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«El domingo» en bizkaiera: ____", "opciones": ["igandean", "domekan", "zapatuan", "eguenean"], "correcta": 1, "explicacion": "«domeka» es el domingo en bizkaiera."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«El viernes» en bizkaiera: ____", "opciones": ["ostiralean", "barikuan", "martitzenean", "eguaztenean"], "correcta": 1, "explicacion": "«barikua» es el viernes en bizkaiera."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«gaua» (la noche) en bizkaiera: ____", "opciones": ["gaba", "goiza", "eguna", "gaur"], "correcta": 0, "explicacion": "«gaba», de donde sale el «gabon» de buenas noches."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Zer ordu da?» se acorta en bizkaiera como ____", "opciones": ["Zeren ordu da?", "Ze ordu da?", "Zein ordu da?", "Nor ordu da?"], "correcta": 1, "explicacion": "Delante de un nombre, «zer» se queda en «ze»."}]}, {"id": "u7-g12", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zortzietan gosaria, ordu bietan ____.", "opciones": ["afaria", "bazkaria", "gosaria", "gaua"], "correcta": 1, "explicacion": "A las dos toca la comida: «bazkaria»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gaur goizean etxean nago; gaur ____ Bilbon.", "opciones": ["atzo", "arratsaldean", "bart", "etzi"], "correcta": 1, "explicacion": "«gaur arratsaldean» = esta tarde. Los otros tres no son hoy."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Astelehena, asteartea, ____, osteguna.", "opciones": ["ostirala", "asteazkena", "larunbata", "igandea"], "correcta": 1, "explicacion": "Falta el miércoles: asteazkena."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hamaika eta erdiak dira. Ordu bat gero, ____ eta erdiak.", "opciones": ["hamar", "hamabi", "bederatzi", "hamaika"], "correcta": 1, "explicacion": "Una hora después de las once y media son las doce y media."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Berandu da: ____ dira.", "opciones": ["zortziak goizean", "gaueko hamabiak", "goizeko zortziak", "eguerdia"], "correcta": 1, "explicacion": "«berandu» es tarde: las doce de la noche encaja."}]}]}, {"id": "u8", "numero": 8, "titulo": "Zer egiten duzu?", "subtitulo": "El presente habitual y la negación", "objetivo": "Contar lo que haces cada día, negarlo y hablar de comida.", "color": "verde", "vocabulario": [{"eu": "jan", "es": "comer", "nota": "Forma de diccionario. Para «como» hace falta «jaten dut»."}, {"eu": "jaten dut", "es": "(yo) como", "nota": null}, {"eu": "edan", "es": "beber", "nota": null}, {"eu": "edaten dut", "es": "(yo) bebo", "nota": null}, {"eu": "egin", "es": "hacer", "nota": null}, {"eu": "egiten dut", "es": "(yo) hago", "nota": null}, {"eu": "lan egin", "es": "trabajar", "nota": "Literalmente «hacer trabajo»."}, {"eu": "hitz egin", "es": "hablar", "nota": "Literalmente «hacer palabra»."}, {"eu": "ikasi", "es": "estudiar, aprender", "nota": "Una sola palabra para las dos cosas."}, {"eu": "irakurri", "es": "leer", "nota": null}, {"eu": "idatzi", "es": "escribir", "nota": null}, {"eu": "entzun", "es": "escuchar, oír", "nota": null}, {"eu": "ikusi", "es": "ver", "nota": null}, {"eu": "erosi", "es": "comprar", "nota": null}, {"eu": "hartu", "es": "coger, tomar", "nota": null}, {"eu": "saldu", "es": "vender", "nota": "Sale en la regla del -t(z)en: saldu → saltzen."}, {"eu": "jarri", "es": "poner", "nota": "Irregular en -t(z)en: jarri → jartzen."}, {"eu": "dirua", "es": "el dinero", "nota": null}, {"eu": "arazoa", "es": "el problema", "nota": "«Ez dago arazorik» — no hay problema."}, {"eu": "berandu", "es": "tarde", "nota": "Lo contrario es «goiz» (temprano)."}, {"eu": "nahi dut", "es": "quiero", "nota": "Se usa con la forma de diccionario: «ura nahi dut»."}, {"eu": "ogia", "es": "el pan", "nota": null}, {"eu": "ura", "es": "el agua", "nota": null}, {"eu": "kafea", "es": "el café", "nota": null}, {"eu": "esnea", "es": "la leche", "nota": null}, {"eu": "ardoa", "es": "el vino", "nota": null}, {"eu": "garagardoa", "es": "la cerveza", "nota": "De «garagar» (cebada) + «ardo» (vino)."}, {"eu": "arraina", "es": "el pescado", "nota": null}, {"eu": "haragia", "es": "la carne", "nota": null}, {"eu": "barazkiak", "es": "las verduras", "nota": null}, {"eu": "sagarra", "es": "la manzana", "nota": "De ahí «sagardoa», la sidra: sagar + ardo."}, {"eu": "gosaria", "es": "el desayuno", "nota": null}, {"eu": "bazkaria", "es": "la comida (del mediodía)", "nota": null}, {"eu": "afaria", "es": "la cena", "nota": null}, {"eu": "liburua", "es": "el libro", "nota": null}, {"eu": "musika", "es": "la música", "nota": null}, {"eu": "euskara", "es": "el euskera", "nota": "Sin artículo cuando es objeto genérico: «euskara ikasten dut»."}, {"eu": "ez", "es": "no", "nota": null}, {"eu": "ezer ez", "es": "nada", "nota": null}], "gramatica": [{"titulo": "Lo que haces cada día: verbo en -t(z)en + dut", "cuerpo": "Hasta ahora solo has usado verbos que se conjugan solos: <i>naiz, dut, nago<\/i>. La mayoría no funcionan así. La mayoría se parten en <b>dos piezas<\/b>:\n\n<b>jaten<\/b> + <b>dut<\/b> = como\n\nLa primera pieza dice <b>qué<\/b> se hace, y no cambia nunca. La segunda dice <b>quién<\/b>, y es el <i>ukan<\/i> de la quinta unidad:\n\n<b>nik jaten dut<\/b> — yo como\n<b>zuk jaten duzu<\/b> — tú comes\n<b>hark jaten du<\/b> — él come\n<b>guk jaten dugu<\/b> — nosotros comemos\n<b>zuek jaten duzue<\/b> — vosotros coméis\n<b>haiek jaten dute<\/b> — ellos comen\n\nY como hay complemento directo, el sujeto lleva la <b>-k<\/b> del ergativo: <i>ni<b>k<\/b><\/i>, <i>zu<b>k<\/b><\/i>, <i>har<b>k<\/b><\/i>.\n\nEsta forma sirve para lo habitual y para lo general, como el presente castellano: «como pescado» (todos los días), no «estoy comiendo ahora mismo».", "ejemplos": [{"eu": "Nik ogia jaten dut.", "es": "Yo como pan."}, {"eu": "Zuk kafea edaten duzu.", "es": "Tú bebes café."}, {"eu": "Haiek euskara ikasten dute.", "es": "Ellos aprenden euskera."}]}, {"titulo": "Cómo se forma el -t(z)en", "cuerpo": "La regla es corta y tiene pocas excepciones.\n\n<b>Si acaba en -n<\/b>, añade <b>-ten<\/b>:\n<i>jan<\/i> (comer) → <b>jaten<\/b>\n<i>edan<\/i> (beber) → <b>edaten<\/b>\n<i>egin<\/i> (hacer) → <b>egiten<\/b>\n<i>entzun<\/i> (escuchar) → <b>entzuten<\/b>\n\n<b>Si acaba en -i<\/b>, añade <b>-ten<\/b>:\n<i>ikasi<\/i> (estudiar) → <b>ikasten<\/b>\n<i>ikusi<\/i> (ver) → <b>ikusten<\/b>\n<i>erosi<\/i> (comprar) → <b>erosten<\/b>\n\n<b>Si acaba en -tu o -du<\/b>, cámbialo por <b>-tzen<\/b>:\n<i>hartu<\/i> (coger) → <b>hartzen<\/b>\n<i>sartu<\/i> (entrar) → <b>sartzen<\/b>\n<i>saldu<\/i> (vender) → <b>saltzen<\/b>\n\nY tres que se salen de la regla y conviene memorizar:\n<i>irakurri<\/i> (leer) → <b>irakurtzen<\/b>\n<i>idatzi<\/i> (escribir) → <b>idazten<\/b>\n<i>jarri<\/i> (poner) → <b>jartzen<\/b>\n\nDe toda esta lista, las palabras nuevas son <i>sartu<\/i> (entrar), <i>saldu<\/i> (vender) y <i>jarri<\/i> (poner). Las tres están en el vocabulario de la unidad, así que entrarán en los repasos.", "ejemplos": [{"eu": "Liburua irakurtzen dut.", "es": "Leo el libro."}, {"eu": "Musika entzuten dugu.", "es": "Escuchamos música."}, {"eu": "Ogia erosten duzu.", "es": "Compras pan."}]}, {"titulo": "Cuando no hay objeto, el auxiliar es izan", "cuerpo": "Si el verbo no lleva complemento directo, la segunda pieza no es <i>dut<\/i> sino <b>naiz<\/b>. Y entonces el sujeto <b>no lleva -k<\/b>.\n\nTres verbos nuevos para verlo, con su forma de diccionario delante:\n\n<i>etorri<\/i> (venir) → <b>Ni etortzen naiz.<\/b> — Yo vengo.\n<i>joan<\/i> (ir) → <b>Zu joaten zara.<\/b> — Tú vas.\n<i>egon<\/i> (estar, ya de la sexta unidad) → <b>Hura egoten da.<\/b> — Él suele estar.\n\n<i>joan<\/i> y <i>etorri<\/i> los verás a fondo en la novena unidad; aquí solo te hacen falta para ver la diferencia.\n\nCompara las dos familias:\n\n<b>Nik ogia jaten dut.<\/b> — hay objeto (el pan) → <i>dut<\/i>, y <i>nik<\/i>\n<b>Ni etxera joaten naiz.<\/b> — no hay objeto → <i>naiz<\/i>, y <i>ni<\/i>\n\nEsta división entre verbos con objeto y verbos sin objeto atraviesa toda la gramática vasca. Si te acostumbras ahora a preguntarte «¿esto lleva objeto?», el resto del camino es mucho más llano.", "ejemplos": [{"eu": "Ni goizean etxetik joaten naiz.", "es": "Por la mañana salgo de casa. (etxe-tik = desde casa; el -tik llega en la unidad 9)"}, {"eu": "Nik gosaria etxean hartzen dut.", "es": "Desayuno en casa."}, {"eu": "Gu berandu etortzen gara.", "es": "Nosotros venimos tarde."}]}, {"titulo": "La negación: «ez» y el auxiliar dan un salto", "cuerpo": "Para negar se pone <b>ez<\/b> delante… pero pasa algo más: <b>el auxiliar se coloca justo detrás del ez<\/b>, y el resto de la frase se queda después.\n\n<b>Nik ogia jaten dut.<\/b>\n<b>Nik ez dut ogia jaten.<\/b> — No como pan.\n\nEl <i>dut<\/i> ha saltado desde el final hasta detrás del <i>ez<\/i>. Con las formas de una sola pieza es más simple, porque no hay nada que mover:\n\n<b>Ni ikaslea naiz.<\/b> → <b>Ni ez naiz ikaslea.<\/b>\n<b>Etxean nago.<\/b> → <b>Ez nago etxean.<\/b>\n\nEl salto del auxiliar es de los pocos sitios donde el orden de palabras del euskera es rígido. Merece la pena practicarlo hasta que salga solo.", "ejemplos": [{"eu": "Ez dut kafea edaten.", "es": "No bebo café."}, {"eu": "Ez naiz Bilbokoa.", "es": "No soy de Bilbao."}, {"eu": "Zuk ez duzu haragia jaten.", "es": "Tú no comes carne."}]}, {"titulo": "«Nada de eso»: el partitivo -(r)ik", "cuerpo": "En castellano dices «no como pan», con el mismo «pan» que en afirmativa. En euskera, cuando niegas o preguntas, el objeto suele cambiar de forma: pierde el artículo y coge <b>-rik<\/b>.\n\n<b>Ogia jaten dut.<\/b> — Como pan.\n<b>Ez dut <u>ogirik<\/u> jaten.<\/b> — No como pan.\n\nLa terminación es <b>-rik<\/b> tras vocal y <b>-ik<\/b> tras consonante:\n<i>ogi<\/i> (pan) → <b>ogirik<\/b>\n<i>diru<\/i> (dinero) → <b>dirurik<\/b>\n<i>ur<\/i> (agua) → <b>urik<\/b>\n<i>lan<\/i> (trabajo) → <b>lanik<\/b>\n\nFíjate en que aquí las palabras van <b>sin el artículo -a<\/b>: no es <i>ogia<\/i> sino <i>ogi<\/i>. El partitivo lo sustituye.\n\nSe usa igual con <i>egon<\/i> para decir que algo no hay:\n<b>Ez dago ardorik.<\/b> — No hay vino.\n<b>Ez dago arazorik.<\/b> — No hay problema. (<i>arazoa<\/i> = el problema)\n\nEs opcional en muchos casos y nadie te va a corregir si no lo pones, pero suena mucho más natural con él.", "ejemplos": [{"eu": "Ez dut dirurik.", "es": "No tengo dinero."}, {"eu": "Ez dago urik.", "es": "No hay agua."}, {"eu": "Ez dut ezer nahi.", "es": "No quiero nada."}]}, {"titulo": "Si el objeto es plural: ditut", "cuerpo": "Cuando lo que comes, ves o compras va en <b>plural<\/b>, el auxiliar cambia. Donde había <i>dut<\/i>, ahora hay <b>ditut<\/b>:\n\n<b>nik ditut<\/b> — yo los/las…\n<b>zuk dituzu<\/b> — tú\n<b>hark ditu<\/b> — él/ella\n<b>guk ditugu<\/b> — nosotros\n<b>zuek dituzue<\/b> — vosotros\n<b>haiek dituzte<\/b> — ellos\n\n<b>Sagarra jaten dut.<\/b> — Como la manzana.\n<b>Sagarrak jaten ditut.<\/b> — Como las manzanas.\n\nEse <b>-it-<\/b> que se cuela en medio es la marca de plural del objeto. Es el mismo que ya viste en <i>ditugu<\/i> cuando hablaste de tener varias cosas.\n\nCon los verbos sin objeto no pasa nada de esto: allí lo que manda es el sujeto (<i>naiz, gara<\/i>).", "ejemplos": [{"eu": "Barazkiak erosten ditut.", "es": "Compro las verduras."}, {"eu": "Liburuak irakurtzen ditugu.", "es": "Leemos los libros."}, {"eu": "Ez ditut haragia eta arraina jaten.", "es": "No como carne ni pescado."}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "<b>El auxiliar, otra vez con o<\/b>\nYa sabes que <i>dut<\/i> es <b>dot<\/b> en bizkaiera. Aquí se ve en cada frase:\n\n<b>jaten dot<\/b> — batua: jaten dut\n<b>jaten dozu<\/b> — duzu\n<b>jaten dau<\/b> — du\n<b>jaten dogu<\/b> — dugu\n<b>jaten dozue<\/b> — duzue\n<b>jaten dabe<\/b> — dute\n\nY con objeto plural, la <b>-z<\/b> de siempre: <b>jaten dodaz<\/b>, donde el batua dice <i>jaten ditut<\/i>.\n\n<b>La negación es igual<\/b>\nEl salto del auxiliar funciona idéntico: <b>Ez dot ogirik jaten.<\/b>\n\n<b>-ten donde el batua pone -tzen<\/b>\nEl bizkaiera tiende a la forma corta: donde el batua dice <i>joaten / etortzen<\/i>, por allí se oye <b>joaten / etorten<\/b>. Y <i>egiten<\/i> es <b>egiten<\/b> en los dos.\n\n<b>Ezer ez<\/b>\n«Nada» se dice igual, pero oirás mucho <b>ezebez<\/b>, todo pegado.", "ejemplos": [{"eu": "Nik ez dot kafea edaten.", "es": "Yo no bebo café. — batua: ez dut."}, {"eu": "Zer egiten dozu?", "es": "¿Qué haces? — batua: Zer egiten duzu?"}, {"eu": "Berandu etorten naz.", "es": "Vengo tarde. — batua: berandu etortzen naiz."}]}], "ejercicios": [{"id": "u8-g01", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nik ogia ____ dut.", "opciones": ["jan", "jaten", "jango", "jatea"], "correcta": 1, "explicacion": "Para lo habitual, el verbo va en -t(z)en: «jaten»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zuk kafea ____ duzu.", "opciones": ["edan", "edaten", "edango", "edatea"], "correcta": 1, "explicacion": "edan → edaten. Acaba en -n, así que se le añade -ten."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Guk euskara ____ dugu.", "opciones": ["ikasi", "ikasten", "ikasiko", "ikastea"], "correcta": 1, "explicacion": "ikasi → ikasten."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hark liburua ____ du.", "opciones": ["irakurri", "irakurtzen", "irakurriko", "irakurtea"], "correcta": 1, "explicacion": "«irakurri» es de las irregulares: irakurtzen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek musika ____ dute.", "opciones": ["entzun", "entzuten", "entzungo", "entzutea"], "correcta": 1, "explicacion": "entzun → entzuten."}]}, {"id": "u8-g02", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nik ogia jaten ____.", "opciones": ["naiz", "dut", "nago", "dute"], "correcta": 1, "explicacion": "Hay objeto (el pan), así que el auxiliar es «dut»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni etxera joaten ____.", "opciones": ["dut", "naiz", "du", "nago"], "correcta": 1, "explicacion": "«joan» no lleva objeto: el auxiliar es «naiz»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zuk musika entzuten ____.", "opciones": ["zara", "duzu", "zaude", "duzue"], "correcta": 1, "explicacion": "«la música» es el objeto → «duzu»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gu berandu etortzen ____.", "opciones": ["dugu", "gara", "gaude", "ditugu"], "correcta": 1, "explicacion": "«etorri» no lleva objeto → «gara»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek euskara ikasten ____.", "opciones": ["dira", "dute", "daude", "ditu"], "correcta": 1, "explicacion": "«el euskera» es el objeto → «dute»."}]}, {"id": "u8-g03", "variantes": [{"tipo": "pares", "instruccion": "Empareja los verbos", "pares": [{"eu": "jan", "es": "comer"}, {"eu": "edan", "es": "beber"}, {"eu": "ikasi", "es": "aprender"}, {"eu": "ikusi", "es": "ver"}]}, {"tipo": "pares", "instruccion": "Empareja los verbos", "pares": [{"eu": "irakurri", "es": "leer"}, {"eu": "idatzi", "es": "escribir"}, {"eu": "entzun", "es": "escuchar"}, {"eu": "erosi", "es": "comprar"}]}, {"tipo": "pares", "instruccion": "Empareja la comida y la bebida", "pares": [{"eu": "ogia", "es": "el pan"}, {"eu": "ura", "es": "el agua"}, {"eu": "esnea", "es": "la leche"}, {"eu": "kafea", "es": "el café"}]}, {"tipo": "pares", "instruccion": "Empareja las comidas del día", "pares": [{"eu": "gosaria", "es": "el desayuno"}, {"eu": "bazkaria", "es": "la comida"}, {"eu": "afaria", "es": "la cena"}, {"eu": "sagarra", "es": "la manzana"}]}, {"tipo": "pares", "instruccion": "Empareja las expresiones", "pares": [{"eu": "lan egin", "es": "trabajar"}, {"eu": "hitz egin", "es": "hablar"}, {"eu": "hartu", "es": "coger"}, {"eu": "nahi dut", "es": "quiero"}]}]}, {"id": "u8-g04", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No como pan. → Nik ____ ogia jaten.", "opciones": ["ez dut", "dut ez", "ez jaten", "jaten ez"], "correcta": 0, "explicacion": "En negativa el auxiliar salta justo detrás del «ez»: «ez dut … jaten»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No bebo café. → ____ kafea edaten.", "opciones": ["Edaten ez dut", "Ez dut", "Dut ez", "Ez edaten dut"], "correcta": 1, "explicacion": "«Ez dut kafea edaten»: ez + auxiliar, y el verbo al final."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No soy de Bilbao. → Ni ____ Bilbokoa.", "opciones": ["naiz ez", "ez naiz", "ez da", "ez naiz ez"], "correcta": 1, "explicacion": "Con las formas de una pieza basta con poner «ez» delante."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No estoy en casa. → ____ etxean.", "opciones": ["Nago ez", "Ez naiz", "Ez nago", "Etxean ez"], "correcta": 2, "explicacion": "Ubicación → «egon». En negativa: «Ez nago etxean»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Tú no comes carne. → Zuk ____ haragia jaten.", "opciones": ["ez duzu", "duzu ez", "ez zara", "ez jaten"], "correcta": 0, "explicacion": "El auxiliar de objeto es «duzu», y va detrás del «ez»."}]}, {"id": "u8-g05", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Yo como pan.", "eu": "Nik ogia jaten dut.", "palabras": ["Nik", "ogia", "jaten", "dut."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Tú bebes café.", "eu": "Zuk kafea edaten duzu.", "palabras": ["Zuk", "kafea", "edaten", "duzu."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Nosotros aprendemos euskera.", "eu": "Guk euskara ikasten dugu.", "palabras": ["Guk", "euskara", "ikasten", "dugu."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Escucho música en casa.", "eu": "Nik etxean musika entzuten dut.", "palabras": ["Nik", "etxean", "musika", "entzuten", "dut."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ella lee un libro.", "eu": "Hark liburua irakurtzen du.", "palabras": ["Hark", "liburua", "irakurtzen", "du."]}]}, {"id": "u8-g06", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No tengo dinero. → Ez dut ____.", "opciones": ["dirua", "dirurik", "diruak", "dirura"], "correcta": 1, "explicacion": "En negativa el objeto lleva el partitivo: diru → dirurik."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No hay vino. → Ez dago ____.", "opciones": ["ardoa", "ardorik", "ardoak", "ardoan"], "correcta": 1, "explicacion": "ardo + -rik = ardorik."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No hay agua. → Ez dago ____.", "opciones": ["ura", "urik", "urak", "uretan"], "correcta": 1, "explicacion": "«ur» acaba en consonante, así que el partitivo es -ik: urik."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No como pan. → Ez dut ____ jaten.", "opciones": ["ogia", "ogirik", "ogiak", "ogian"], "correcta": 1, "explicacion": "ogi + -rik = ogirik."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No hay problema. → Ez dago ____.", "opciones": ["arazoa", "arazorik", "arazoak", "arazoan"], "correcta": 1, "explicacion": "«Ez dago arazorik» es una frase que oirás mucho."}]}, {"id": "u8-g07", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Como las manzanas. → Sagarrak jaten ____.", "opciones": ["dut", "ditut", "dugu", "naiz"], "correcta": 1, "explicacion": "Objeto plural → «ditut»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Compro las verduras. → Barazkiak erosten ____.", "opciones": ["dut", "ditut", "dira", "ditu"], "correcta": 1, "explicacion": "«barazkiak» es plural, así que «ditut»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Leemos los libros. → Liburuak irakurtzen ____.", "opciones": ["dugu", "ditugu", "gara", "dituzte"], "correcta": 1, "explicacion": "Nosotros + objeto plural = «ditugu»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Como la manzana. → Sagarra jaten ____.", "opciones": ["ditut", "dut", "dugu", "naiz"], "correcta": 1, "explicacion": "Aquí el objeto es singular: «dut»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ellos ven las casas. → Haiek etxeak ikusten ____.", "opciones": ["dute", "dituzte", "dira", "ditugu"], "correcta": 1, "explicacion": "Ellos + objeto plural = «dituzte»."}]}, {"id": "u8-g08", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "No como carne.", "respuestas": ["ez dut haragia jaten", "nik ez dut haragia jaten", "ez dut haragirik jaten"], "pista": "El auxiliar va detrás del «ez»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Bebo agua.", "respuestas": ["ura edaten dut", "nik ura edaten dut"], "pista": "Tres palabras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿Qué haces?", "respuestas": ["zer egiten duzu", "ze egiten duzu"], "pista": "Tres palabras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Aprendo euskera.", "respuestas": ["euskara ikasten dut", "nik euskara ikasten dut"], "pista": "«euskara» va sin artículo aquí."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "No hay pan.", "respuestas": ["ez dago ogirik"], "pista": "Con «egon» y el partitivo."}]}, {"id": "u8-g09", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "No bebo vino.", "eu": "Nik ez dut ardoa edaten.", "palabras": ["Nik", "ez", "dut", "ardoa", "edaten."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ella no come pescado.", "eu": "Hark ez du arraina jaten.", "palabras": ["Hark", "ez", "du", "arraina", "jaten."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "No estoy en el trabajo.", "eu": "Ni ez nago lanean.", "palabras": ["Ni", "ez", "nago", "lanean."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "No compro carne.", "eu": "Nik ez dut haragia erosten.", "palabras": ["Nik", "ez", "dut", "haragia", "erosten."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "No hay leche en casa.", "eu": "Etxean ez dago esnerik.", "palabras": ["Etxean", "ez", "dago", "esnerik."]}]}, {"id": "u8-g10", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "hartu → ____", "opciones": ["harten", "hartzen", "hartuten", "hartuzen"], "correcta": 1, "explicacion": "Los verbos en -tu cambian a -tzen: hartzen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "idatzi → ____", "opciones": ["idatziten", "idazten", "idatzitzen", "idatzten"], "correcta": 1, "explicacion": "«idatzi» es irregular: idazten."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "erosi → ____", "opciones": ["erosten", "erostzen", "erositen", "erosizen"], "correcta": 0, "explicacion": "Acaba en -i, así que -ten: erosten."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "egin → ____", "opciones": ["egiten", "egintzen", "eginten", "egizen"], "correcta": 0, "explicacion": "Acaba en -n: egiten."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "saldu → ____", "opciones": ["salduten", "saltzen", "salten", "saldutzen"], "correcta": 1, "explicacion": "Los verbos en -du también pasan a -tzen: saltzen."}]}, {"id": "u8-g11", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«No bebo café» en bizkaiera: Nik ez ____ kafea edaten.", "opciones": ["dut", "dot", "dau", "dogu"], "correcta": 1, "explicacion": "El «dut» del batua es «dot» en bizkaiera."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«¿Qué haces?» en bizkaiera: Zer egiten ____?", "opciones": ["duzu", "dozu", "dozue", "dau"], "correcta": 1, "explicacion": "duzu → dozu."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Ellos comen» en bizkaiera: Haiek jaten ____.", "opciones": ["dute", "dabe", "dabez", "dira"], "correcta": 1, "explicacion": "dute → dabe."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Vengo tarde» en bizkaiera: Berandu ____ naz.", "opciones": ["etortzen", "etorten", "etorriko", "etorri"], "correcta": 1, "explicacion": "El bizkaiera prefiere la forma corta: «etorten»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Como las manzanas» en bizkaiera: Sagarrak jaten ____.", "opciones": ["ditut", "dodaz", "dot", "dabe"], "correcta": 1, "explicacion": "Objeto plural en bizkaiera: «dodaz», con esa -z de siempre."}]}, {"id": "u8-g12", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Goizean ____ hartzen dut.", "opciones": ["afaria", "gosaria", "bazkaria", "gaua"], "correcta": 1, "explicacion": "Por la mañana se toma el desayuno: gosaria."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nik ez dut haragirik jaten: ____ jaten ditut.", "opciones": ["ardoak", "barazkiak", "liburuak", "orduak"], "correcta": 1, "explicacion": "Quien no come carne, come verduras: barazkiak."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Liburua ____ dut, eta musika entzuten dut.", "opciones": ["edaten", "irakurtzen", "erosten", "jaten"], "correcta": 1, "explicacion": "Un libro se lee: irakurtzen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ez dago ____: ura edaten dut.", "opciones": ["kaferik", "kafea", "kafeak", "kafean"], "correcta": 0, "explicacion": "«Ez dago» pide partitivo: kaferik."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nik euskara ikasten dut. Zuk ere euskara ikasten ____.", "opciones": ["dut", "duzu", "du", "dugu"], "correcta": 1, "explicacion": "Con «zuk» el auxiliar es «duzu»."}]}]}, {"id": "u9", "numero": 9, "titulo": "Nora zoaz?", "subtitulo": "Ir, venir y moverse por el mapa", "objetivo": "Decir adónde vas, de dónde vienes y cómo llegas, y pedir una dirección.", "color": "rojo", "vocabulario": [{"eu": "joan", "es": "ir", "nota": null}, {"eu": "noa", "es": "(yo) voy", "nota": null}, {"eu": "zoaz", "es": "(tú) vas", "nota": null}, {"eu": "doa", "es": "(él/ella) va", "nota": null}, {"eu": "etorri", "es": "venir", "nota": null}, {"eu": "nator", "es": "(yo) vengo", "nota": null}, {"eu": "zatoz", "es": "(tú) vienes", "nota": null}, {"eu": "dator", "es": "(él/ella) viene", "nota": null}, {"eu": "ibili", "es": "andar, andar por ahí", "nota": null}, {"eu": "nabil", "es": "(yo) ando", "nota": null}, {"eu": "dabil", "es": "(él/ella) anda", "nota": null}, {"eu": "irten", "es": "salir", "nota": "También «atera» en muchos sitios."}, {"eu": "sartu", "es": "entrar", "nota": null}, {"eu": "iritsi", "es": "llegar", "nota": null}, {"eu": "geltokia", "es": "la estación, la parada", "nota": null}, {"eu": "autobusa", "es": "el autobús", "nota": null}, {"eu": "trena", "es": "el tren", "nota": null}, {"eu": "kotxea", "es": "el coche", "nota": "También «autoa»."}, {"eu": "bizikleta", "es": "la bicicleta", "nota": null}, {"eu": "oinez", "es": "a pie", "nota": "De «oin» (pie) + la -z de «por medio de»."}, {"eu": "hondartza", "es": "la playa", "nota": null}, {"eu": "mendia", "es": "el monte", "nota": null}, {"eu": "merkatua", "es": "el mercado", "nota": null}, {"eu": "azoka", "es": "la feria, el mercado", "nota": "La de Gernika, los lunes, es la más conocida."}, {"eu": "denda", "es": "la tienda", "nota": null}, {"eu": "liburutegia", "es": "la biblioteca", "nota": "De «liburu» (libro) + «tegi» (lugar de)."}, {"eu": "ospitalea", "es": "el hospital", "nota": null}, {"eu": "hiria", "es": "la ciudad", "nota": null}, {"eu": "urrun", "es": "lejos", "nota": null}, {"eu": "gertu", "es": "cerca", "nota": "También «hurbil»."}, {"eu": "zuzen", "es": "recto, derecho", "nota": null}, {"eu": "ezkerrera", "es": "a la izquierda", "nota": null}, {"eu": "eskuinera", "es": "a la derecha", "nota": null}, {"eu": "hona", "es": "aquí (con movimiento)", "nota": null}, {"eu": "hara", "es": "allí (con movimiento)", "nota": null}, {"eu": "hemendik", "es": "desde aquí", "nota": null}], "gramatica": [{"titulo": "«Joan»: ir, en una sola pieza", "cuerpo": "Unos pocos verbos muy usados se conjugan solos, sin auxiliar, igual que <i>naiz<\/i> o <i>nago<\/i>. <b>Joan<\/b> (ir) es uno:\n\n<b>ni noa<\/b> — yo voy\n<b>zu zoaz<\/b> — tú vas\n<b>hura doa<\/b> — él/ella va\n<b>gu goaz<\/b> — nosotros vamos\n<b>zuek zoazte<\/b> — vosotros vais\n<b>haiek doaz<\/b> — ellos van\n\nNo lleva objeto, así que el sujeto <b>no lleva -k<\/b>: <i>ni noa<\/i>, nunca «nik noa».\n\nHay otra forma más larga, <b>joaten naiz<\/b>, que ya viste en la unidad anterior. La diferencia es de matiz: <b>noa<\/b> es «voy ahora», y <b>joaten naiz<\/b> es «suelo ir». En castellano las dos se dicen «voy».", "ejemplos": [{"eu": "Bilbora noa.", "es": "Voy a Bilbao."}, {"eu": "Nora zoaz?", "es": "¿Adónde vas?"}, {"eu": "Astelehenero azokara joaten naiz.", "es": "Todos los lunes voy a la feria."}]}, {"titulo": "«Etorri» e «ibili»", "cuerpo": "<b>Etorri<\/b> (venir), también en una pieza:\n\n<b>ni nator<\/b> — yo vengo\n<b>zu zatoz<\/b> — tú vienes\n<b>hura dator<\/b> — él viene\n<b>gu gatoz<\/b> — nosotros venimos\n<b>zuek zatozte<\/b> — vosotros venís\n<b>haiek datoz<\/b> — ellos vienen\n\n<b>Ibili<\/b> es «andar», pero también «andar por ahí» y «andar haciendo algo»:\n\n<b>ni nabil<\/b>, <b>zu zabiltza<\/b>, <b>hura dabil<\/b>, <b>gu gabiltza<\/b>, <b>zuek zabiltzate<\/b>, <b>haiek dabiltza<\/b>\n\n<b>Zer moduz zabiltza?<\/b> es un «¿qué tal andas?» de lo más corriente, y responde a lo mismo que el <i>Zer moduz?<\/i> de la primera unidad.", "ejemplos": [{"eu": "Bihar nator.", "es": "Mañana vengo."}, {"eu": "Nondik zatoz?", "es": "¿De dónde vienes?"}, {"eu": "Zer moduz zabiltza?", "es": "¿Qué tal andas?"}]}, {"titulo": "Adónde y de dónde, ahora con plurales", "cuerpo": "Ya conoces la familia entera:\n\n<b>Non?<\/b> → <b>-n<\/b>: <i>etxean<\/i>, en casa\n<b>Nora?<\/b> → <b>-ra<\/b>: <i>etxera<\/i>, a casa\n<b>Nondik?<\/b> → <b>-tik<\/b>: <i>etxetik<\/i>, desde casa\n\nEn plural, las tres se alargan con esa <b>-eta-<\/b> que viste en las horas:\n\n<b>-etan<\/b>: <i>mendietan<\/i>, en los montes\n<b>-etara<\/b>: <i>mendietara<\/i>, a los montes\n<b>-etatik<\/b>: <i>mendietatik<\/i>, desde los montes\n\nY los tres demostrativos también se mueven:\n\n<b>hemen / hona / hemendik<\/b> — aquí / hacia aquí / desde aquí\n<b>hor / horra / hortik<\/b>\n<b>han / hara / handik<\/b>", "ejemplos": [{"eu": "Hondartzara noa.", "es": "Voy a la playa."}, {"eu": "Bilbotik nator.", "es": "Vengo de Bilbao."}, {"eu": "Hona zatoz?", "es": "¿Vienes aquí?"}]}, {"titulo": "Cómo vas: la -z de «por medio de»", "cuerpo": "Para decir <b>en qué<\/b> vas, el euskera no usa preposición: pega una <b>-z<\/b> al medio de transporte.\n\n<b>kotxe<\/b> → <b>kotxez<\/b> — en coche\n<b>tren<\/b> → <b>trenez<\/b> — en tren\n<b>autobus<\/b> → <b>autobusez<\/b> — en autobús\n<b>bizikleta<\/b> → <b>bizikletaz<\/b> — en bici\n<b>oin<\/b> (pie) → <b>oinez<\/b> — a pie\n\nTras consonante se cuela una <b>-e-<\/b>: <i>tren<b>ez<\/b><\/i>, <i>autobus<b>ez<\/b><\/i>.\n\nEse mismo sufijo sirve para «por medio de» en general, y ahí está el nombre de esta aplicación: <b>euskara<\/b> + <b>-z<\/b> = <b>euskaraz<\/b>, «en euskera».\n\n<b>Euskaraz hitz egiten dut.<\/b> — Hablo en euskera.\n<b>Eskuz idazten dut.<\/b> — Escribo a mano.", "ejemplos": [{"eu": "Trenez noa Bilbora.", "es": "Voy a Bilbao en tren."}, {"eu": "Oinez nator.", "es": "Vengo a pie."}, {"eu": "Euskaraz hitz egiten dugu.", "es": "Hablamos en euskera."}]}, {"titulo": "Dar indicaciones", "cuerpo": "Con lo que ya sabes se pide y se da una dirección entera:\n\n<b>Non dago geltokia?<\/b> — ¿Dónde está la estación?\n<b>Hemendik gertu dago.<\/b> — Está cerca de aquí.\n<b>Zuzen, eta gero ezkerrera.<\/b> — Recto, y luego a la izquierda.\n\nFíjate en que <b>ezkerrera<\/b> y <b>eskuinera<\/b> ya llevan dentro el <b>-ra<\/b> de movimiento: son «hacia la izquierda» y «hacia la derecha». Sin él serían <i>ezkerra<\/i> y <i>eskuina<\/i>, la izquierda y la derecha a secas.\n\nY dos palabras que salvan cualquier apuro:\n<b>Non dago…?<\/b> — ¿Dónde está…?\n<b>Urrun dago?<\/b> — ¿Está lejos?", "ejemplos": [{"eu": "Non dago hondartza?", "es": "¿Dónde está la playa?"}, {"eu": "Hemendik urrun dago.", "es": "Está lejos de aquí."}, {"eu": "Zuzen joan, mesedez.", "es": "Vaya recto, por favor."}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "<b>El «de dónde» pierde la k<\/b>\nDonde el batua dice <b>-tik<\/b>, el bizkaiera dice <b>-ti<\/b>:\n\n<b>Bilboti nator.<\/b> — batua: Bilbotik.\n<b>Etxeti urten dot.<\/b> — He salido de casa.\n\nEs de los rasgos más fáciles de pillar de oído, porque aparece en cuanto alguien cuenta de dónde viene.\n\n<b>Salir se dice «urten»<\/b>\nEl <i>irten<\/i> del batua por allí es <b>urten<\/b>, y se conjuga con <i>dut<\/i>: <b>urten dot<\/b>.\n\n<b>Joan y etorri<\/b>\nLas formas de una pieza aguantan bastante parecidas: <b>noa, zoaz, doa<\/b> se oyen igual; en plural asoma otra vez la <b>-z<\/b>, <b>doiaz<\/b> por <i>doaz<\/i>. Y para lo habitual el bizkaiera prefiere <b>joaten naz<\/b> y <b>etorten naz<\/b>.\n\n<b>Un apunte de geografía<\/b>\nLa <b>azoka<\/b> de Gernika es el mercado del lunes, y es lo bastante conocida como para que «astelehenean azokara» se entienda sin más contexto en toda Busturialdea.", "ejemplos": [{"eu": "Gernikati nator.", "es": "Vengo de Gernika. — batua: Gernikatik."}, {"eu": "Etxeti urten dot.", "es": "He salido de casa. — batua: Etxetik irten dut."}, {"eu": "Astelehenean azokara joaten naz.", "es": "Los lunes voy a la feria. — batua: joaten naiz."}]}], "ejercicios": [{"id": "u9-g01", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni Bilbora ____.", "opciones": ["noa", "zoaz", "doa", "goaz"], "correcta": 0, "explicacion": "Con «ni», el verbo «joan» hace «noa»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zu etxera ____.", "opciones": ["noa", "zoaz", "doa", "doaz"], "correcta": 1, "explicacion": "Con «zu» va «zoaz»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hura hondartzara ____.", "opciones": ["noa", "zoaz", "doa", "goaz"], "correcta": 2, "explicacion": "Con «hura» va «doa»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gu mendira ____.", "opciones": ["goaz", "doaz", "zoazte", "noa"], "correcta": 0, "explicacion": "Con «gu» va «goaz»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek Gernikara ____.", "opciones": ["goaz", "zoazte", "doaz", "doa"], "correcta": 2, "explicacion": "Con «haiek» va «doaz»."}]}, {"id": "u9-g02", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni bihar ____.", "opciones": ["nator", "zatoz", "dator", "gatoz"], "correcta": 0, "explicacion": "«etorri» con «ni» hace «nator»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nondik ____?  (tú)", "opciones": ["nator", "zatoz", "dator", "datoz"], "correcta": 1, "explicacion": "Con «zu» va «zatoz»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hura trenez ____.", "opciones": ["nator", "zatoz", "dator", "gatoz"], "correcta": 2, "explicacion": "Con «hura» va «dator»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gu oinez ____.", "opciones": ["gatoz", "datoz", "zatozte", "nator"], "correcta": 0, "explicacion": "Con «gu» va «gatoz»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek Bilbotik ____.", "opciones": ["gatoz", "zatozte", "datoz", "dator"], "correcta": 2, "explicacion": "Con «haiek» va «datoz»."}]}, {"id": "u9-g03", "variantes": [{"tipo": "pares", "instruccion": "Empareja los verbos de movimiento", "pares": [{"eu": "joan", "es": "ir"}, {"eu": "etorri", "es": "venir"}, {"eu": "ibili", "es": "andar"}, {"eu": "sartu", "es": "entrar"}]}, {"tipo": "pares", "instruccion": "Empareja los transportes", "pares": [{"eu": "trena", "es": "el tren"}, {"eu": "autobusa", "es": "el autobús"}, {"eu": "kotxea", "es": "el coche"}, {"eu": "bizikleta", "es": "la bicicleta"}]}, {"tipo": "pares", "instruccion": "Empareja los lugares", "pares": [{"eu": "hondartza", "es": "la playa"}, {"eu": "mendia", "es": "el monte"}, {"eu": "denda", "es": "la tienda"}, {"eu": "geltokia", "es": "la estación"}]}, {"tipo": "pares", "instruccion": "Empareja las indicaciones", "pares": [{"eu": "urrun", "es": "lejos"}, {"eu": "gertu", "es": "cerca"}, {"eu": "zuzen", "es": "recto"}, {"eu": "ezkerrera", "es": "a la izquierda"}]}, {"tipo": "pares", "instruccion": "Empareja el aquí y el allí", "pares": [{"eu": "hona", "es": "hacia aquí"}, {"eu": "hara", "es": "hacia allí"}, {"eu": "hemendik", "es": "desde aquí"}, {"eu": "handik", "es": "desde allí"}]}]}, {"id": "u9-g04", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Voy a la playa. → ____ noa.", "opciones": ["Hondartzan", "Hondartzara", "Hondartzatik", "Hondartza"], "correcta": 1, "explicacion": "Movimiento hacia un sitio → -ra."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Vengo de Bilbao. → ____ nator.", "opciones": ["Bilbon", "Bilbora", "Bilbotik", "Bilbo"], "correcta": 2, "explicacion": "Procedencia → -tik."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Estoy en el monte. → ____ nago.", "opciones": ["Mendian", "Mendira", "Menditik", "Mendi"], "correcta": 0, "explicacion": "Ubicación → -n."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Voy a los montes. → ____ noa.", "opciones": ["Mendian", "Mendietan", "Mendietara", "Mendietatik"], "correcta": 2, "explicacion": "Plural + movimiento: -etara."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Vengo de las tiendas. → ____ nator.", "opciones": ["Dendetan", "Dendetara", "Dendetatik", "Dendatik"], "correcta": 2, "explicacion": "Plural + procedencia: -etatik."}]}, {"id": "u9-g05", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Voy a Bilbao en tren.", "eu": "Ni trenez Bilbora noa.", "palabras": ["Ni", "trenez", "Bilbora", "noa."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿De dónde vienes?", "eu": "Nondik zatoz zu?", "palabras": ["Nondik", "zatoz", "zu?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Mañana vamos al monte.", "eu": "Bihar mendira goaz.", "palabras": ["Bihar", "mendira", "goaz."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ellos vienen a pie.", "eu": "Haiek oinez datoz.", "palabras": ["Haiek", "oinez", "datoz."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Dónde está la estación?", "eu": "Non dago geltokia?", "palabras": ["Non", "dago", "geltokia?"]}]}, {"id": "u9-g06", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "En coche. → ____", "opciones": ["kotxean", "kotxez", "kotxera", "kotxetik"], "correcta": 1, "explicacion": "El medio de transporte lleva -z."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "En tren. → ____", "opciones": ["trena", "trenean", "trenez", "trenetik"], "correcta": 2, "explicacion": "tren + -ez (se cuela una e tras consonante)."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A pie. → ____", "opciones": ["oina", "oinean", "oinez", "oinera"], "correcta": 2, "explicacion": "«oin» (pie) + -ez = oinez."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "En euskera. → ____", "opciones": ["euskara", "euskaraz", "euskaran", "euskarara"], "correcta": 1, "explicacion": "La misma -z: «euskaraz». De ahí el nombre de esta app."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "En bici. → ____", "opciones": ["bizikletan", "bizikletaz", "bizikletara", "bizikleta"], "correcta": 1, "explicacion": "bizikleta + -z = bizikletaz."}]}, {"id": "u9-g07", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zer moduz ____? (¿qué tal andas?)", "opciones": ["zoaz", "zatoz", "zabiltza", "zaude"], "correcta": 2, "explicacion": "«ibili» con «zu»: zabiltza."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni ondo ____.", "opciones": ["nabil", "dabil", "gabiltza", "zabiltza"], "correcta": 0, "explicacion": "«ibili» con «ni»: nabil."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hura Gernikan ____.", "opciones": ["nabil", "dabil", "dabiltza", "zabiltzate"], "correcta": 1, "explicacion": "«ibili» con «hura»: dabil."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gu hondartzan ____.", "opciones": ["gabiltza", "dabiltza", "nabil", "zabiltza"], "correcta": 0, "explicacion": "«ibili» con «gu»: gabiltza."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek mendian ____.", "opciones": ["gabiltza", "dabiltza", "zabiltzate", "dabil"], "correcta": 1, "explicacion": "«ibili» con «haiek»: dabiltza."}]}, {"id": "u9-g08", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Voy a casa.", "respuestas": ["etxera noa", "ni etxera noa"], "pista": "Dos palabras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿Adónde vas?", "respuestas": ["nora zoaz", "nora zoaz zu", "zu nora zoaz"], "pista": "Dos palabras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Vengo de Gernika.", "respuestas": ["gernikatik nator", "ni gernikatik nator"], "pista": "Procedencia con -tik."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Vamos en autobús.", "respuestas": ["autobusez goaz", "gu autobusez goaz"], "pista": "El transporte lleva -z."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿Dónde está la playa?", "respuestas": ["non dago hondartza", "hondartza non dago"], "pista": "Tres palabras, con «egon»."}]}, {"id": "u9-g09", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Voy al mercado a pie.", "eu": "Ni oinez merkatura noa.", "palabras": ["Ni", "oinez", "merkatura", "noa."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Está lejos de aquí.", "eu": "Hemendik urrun dago.", "palabras": ["Hemendik", "urrun", "dago."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Los lunes voy a la feria.", "eu": "Astelehenean azokara joaten naiz.", "palabras": ["Astelehenean", "azokara", "joaten", "naiz."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Recto y luego a la izquierda.", "eu": "Zuzen eta gero ezkerrera.", "palabras": ["Zuzen", "eta", "gero", "ezkerrera."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Nosotros venimos en coche.", "eu": "Gu kotxez gatoz.", "palabras": ["Gu", "kotxez", "gatoz."]}]}, {"id": "u9-g10", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«hemen» con movimiento hacia aquí es ____", "opciones": ["hemendik", "hona", "hemen", "honetan"], "correcta": 1, "explicacion": "hemen (aquí) → hona (hacia aquí)."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«han» con movimiento hacia allí es ____", "opciones": ["handik", "hara", "hemen", "hantxe"], "correcta": 1, "explicacion": "han (allí) → hara (hacia allí)."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«desde ahí» se dice ____", "opciones": ["horra", "hortik", "hor", "honetatik"], "correcta": 1, "explicacion": "hor (ahí) → hortik (desde ahí)."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«a la derecha» se dice ____", "opciones": ["eskuina", "eskuinera", "eskuinean", "eskuinetik"], "correcta": 1, "explicacion": "Ya lleva dentro el -ra de movimiento."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«a la izquierda» se dice ____", "opciones": ["ezkerra", "ezkerrean", "ezkerrera", "ezkerretik"], "correcta": 2, "explicacion": "Igual que la derecha: ezkerrera."}]}, {"id": "u9-g11", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Vengo de Bilbao» en bizkaiera: Bilbo____ nator.", "opciones": ["tik", "ti", "tan", "ra"], "correcta": 1, "explicacion": "El bizkaiera deja el ablativo en -ti, sin la k."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Salir» en bizkaiera es ____", "opciones": ["irten", "urten", "sartu", "joan"], "correcta": 1, "explicacion": "«urten», y se conjuga con «dot»: urten dot."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Voy a la feria» en bizkaiera: Azokara joaten ____.", "opciones": ["naiz", "naz", "dot", "nago"], "correcta": 1, "explicacion": "El «naiz» del batua es «naz» en bizkaiera."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Vengo de casa» en bizkaiera: ____ nator.", "opciones": ["Etxetik", "Etxeti", "Etxean", "Etxera"], "correcta": 1, "explicacion": "Otra vez el -ti sin k."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«ellos van» en bizkaiera suena ____", "opciones": ["doaz", "doiaz", "goaz", "datoz"], "correcta": 1, "explicacion": "En plural asoma esa -z alargada del bizkaiera: doiaz."}]}, {"id": "u9-g12", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nora zoaz? — ____ noa.", "opciones": ["Etxean", "Etxera", "Etxetik", "Etxe"], "correcta": 1, "explicacion": "La respuesta lleva la misma cola que la pregunta: nora → -ra."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Non zaude? — ____ nago.", "opciones": ["Lanean", "Lanera", "Lanetik", "Lana"], "correcta": 0, "explicacion": "non → -n."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nondik zatoz? — ____ nator.", "opciones": ["Merkatuan", "Merkatura", "Merkatutik", "Merkatua"], "correcta": 2, "explicacion": "nondik → -tik."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Geltokia gertu dago? — Ez, ____ dago.", "opciones": ["zuzen", "urrun", "oinez", "hona"], "correcta": 1, "explicacion": "Lo contrario de «gertu» (cerca) es «urrun» (lejos)."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni ez ____ trenez: oinez noa.", "opciones": ["naiz", "noa", "nago", "dut"], "correcta": 1, "explicacion": "«Ez noa trenez»: se niega el mismo verbo, «noa»."}]}]}, {"id": "u10", "numero": 10, "titulo": "Zer gustatzen zaizu?", "subtitulo": "Gustos y el dativo", "objetivo": "Decir lo que te gusta y lo que no, y aprender a marcar «a quién».", "color": "morado", "vocabulario": [{"eu": "gustatu", "es": "gustar", "nota": null}, {"eu": "gustatzen zait", "es": "me gusta", "nota": null}, {"eu": "niri", "es": "a mí", "nota": null}, {"eu": "zuri", "es": "a ti", "nota": null}, {"eu": "hari", "es": "a él, a ella", "nota": null}, {"eu": "guri", "es": "a nosotros", "nota": null}, {"eu": "zuei", "es": "a vosotros", "nota": null}, {"eu": "haiei", "es": "a ellos", "nota": null}, {"eu": "asko", "es": "mucho", "nota": null}, {"eu": "gutxi", "es": "poco", "nota": null}, {"eu": "pixka bat", "es": "un poco", "nota": null}, {"eu": "batere ez", "es": "nada en absoluto", "nota": "Se usa en frases negativas: «ez zait batere gustatzen»."}, {"eu": "eman", "es": "dar", "nota": null}, {"eu": "esan", "es": "decir", "nota": null}, {"eu": "galdetu", "es": "preguntar", "nota": null}, {"eu": "erantzun", "es": "responder", "nota": null}, {"eu": "lagundu", "es": "ayudar", "nota": "Se construye con dativo: «lagundu diot»."}, {"eu": "iruditzen zait", "es": "me parece", "nota": null}, {"eu": "interesatzen zait", "es": "me interesa", "nota": null}, {"eu": "axola zait", "es": "me importa", "nota": null}, {"eu": "kirola", "es": "el deporte", "nota": null}, {"eu": "futbola", "es": "el fútbol", "nota": null}, {"eu": "pilota", "es": "la pelota", "nota": "El deporte y el objeto, las dos cosas."}, {"eu": "dantza", "es": "la danza, el baile", "nota": null}, {"eu": "zinema", "es": "el cine", "nota": null}, {"eu": "antzerkia", "es": "el teatro", "nota": null}, {"eu": "janaria", "es": "la comida (en general)", "nota": "«bazkaria» es la del mediodía; «janaria», la comida como sustancia."}, {"eu": "edaria", "es": "la bebida", "nota": null}, {"eu": "euria", "es": "la lluvia", "nota": null}, {"eu": "eguzkia", "es": "el sol", "nota": null}, {"eu": "negua", "es": "el invierno", "nota": null}, {"eu": "uda", "es": "el verano", "nota": null}, {"eu": "gauza", "es": "la cosa", "nota": null}, {"eu": "guztia", "es": "todo", "nota": null}], "gramatica": [{"titulo": "«Me gusta» no funciona como en castellano… o sí", "cuerpo": "En castellano no dices «yo gusto el euskera»: dices <b>me gusta el euskera<\/b>. El que gusta es el euskera, y tú eres el «me».\n\nEl euskera hace exactamente lo mismo:\n\n<b>Niri euskara gustatzen zait.<\/b>\n\n<i>euskara<\/i> es el sujeto, <i>niri<\/i> es «a mí», y <b>zait<\/b> es un auxiliar nuevo que junta las dos cosas: «(él) a mí».\n\nLa serie entera:\n\n<b>niri … zait<\/b> — me\n<b>zuri … zaizu<\/b> — te\n<b>hari … zaio<\/b> — le\n<b>guri … zaigu<\/b> — nos\n<b>zuei … zaizue<\/b> — os\n<b>haiei … zaie<\/b> — les\n\nY como en castellano, el <i>niri<\/i> se puede callar cuando está claro: <b>Euskara gustatzen zait.<\/b>", "ejemplos": [{"eu": "Niri kirola gustatzen zait.", "es": "A mí me gusta el deporte."}, {"eu": "Zer gustatzen zaizu?", "es": "¿Qué te gusta?"}, {"eu": "Hari zinema gustatzen zaio.", "es": "A él le gusta el cine."}]}, {"titulo": "Si lo que gusta va en plural: zaizkit", "cuerpo": "Igual que <i>dut<\/i> se convertía en <i>ditut<\/i>, aquí <b>zait<\/b> se convierte en <b>zaizkit<\/b>:\n\n<b>Sagarra gustatzen zait.<\/b> — Me gusta la manzana.\n<b>Sagarrak gustatzen zaizkit.<\/b> — Me gustan las manzanas.\n\nLa serie:\n\n<b>zaizkit<\/b> — me gustan\n<b>zaizkizu<\/b> — te gustan\n<b>zaizkio<\/b> — le gustan\n<b>zaizkigu<\/b> — nos gustan\n<b>zaizkizue<\/b> — os gustan\n<b>zaizkie<\/b> — les gustan\n\nEs el mismo <b>-zki-<\/b> que verás en muchos otros sitios: la marca de que hay varios.", "ejemplos": [{"eu": "Liburuak gustatzen zaizkit.", "es": "Me gustan los libros."}, {"eu": "Barazkiak ez zaizkio gustatzen.", "es": "A él no le gustan las verduras."}, {"eu": "Zer gustatzen zaizkizu?", "es": "¿Qué cosas te gustan?"}]}, {"titulo": "Cuánto, y cómo negarlo", "cuerpo": "La cantidad va detrás del sujeto:\n\n<b>Kirola asko gustatzen zait.<\/b> — Me gusta mucho el deporte.\n<b>Zinema pixka bat gustatzen zait.<\/b> — Me gusta un poco el cine.\n\nY para negar, el <b>ez<\/b> con su salto de siempre. El auxiliar se coloca justo detrás:\n\n<b>Ez zait futbola gustatzen.<\/b> — No me gusta el fútbol.\n<b>Ez zaizkit barazkiak gustatzen.<\/b> — No me gustan las verduras.\n\nPara «nada en absoluto»:\n<b>Ez zait batere gustatzen.<\/b>\n\nY una respuesta corta que oirás mucho: <b>Niri ere bai.<\/b> (a mí también) y <b>Niri ez.<\/b> (a mí no).", "ejemplos": [{"eu": "Ez zait euria gustatzen.", "es": "No me gusta la lluvia."}, {"eu": "Eguzkia asko gustatzen zait.", "es": "Me gusta mucho el sol."}, {"eu": "Niri ere bai.", "es": "A mí también."}]}, {"titulo": "Otros verbos que funcionan igual", "cuerpo": "Una vez tienes <i>zait<\/i>, se te abren unos cuantos más. Todos siguen el patrón «algo … a mí»:\n\n<b>iruditzen zait<\/b> — me parece\n<b>interesatzen zait<\/b> — me interesa\n<b>axola zait<\/b> — me importa\n<b>ahaztu zait<\/b> — se me ha olvidado\n<b>gertatzen zait<\/b> — me pasa\n\nY un aviso, porque es la confusión típica: la fórmula para presentarse <b>no<\/b> es de esta familia.\n\n<b>Ane dut izena.<\/b> — Me llamo Ane. (literalmente: «tengo Ane por nombre»)\n\nVa con <i>dut<\/i>, no con <i>zait<\/i>. La dejo aquí al lado solo porque se aprenden juntas y es fácil mezclarlas.", "ejemplos": [{"eu": "Ondo iruditzen zait.", "es": "Me parece bien."}, {"eu": "Euskara asko interesatzen zait.", "es": "Me interesa mucho el euskera."}, {"eu": "Ez zait axola.", "es": "No me importa."}]}, {"titulo": "A quién: la -(r)i de los nombres", "cuerpo": "Los pronombres ya los tienes (<i>niri, zuri, hari…<\/i>). Con nombres corrientes, «a alguien» se dice con <b>-ri<\/b> tras vocal y <b>-i<\/b> tras consonante, siempre después del artículo:\n\n<b>Ane<\/b> → <b>Aneri<\/b> — a Ane\n<b>laguna<\/b> → <b>lagunari<\/b> — al amigo\n<b>ama<\/b> → <b>amari<\/b> — a la madre\n<b>lagunak<\/b> → <b>lagunei<\/b> — a los amigos\n\nY con verbos de dar y decir aparece otro auxiliar, que junta las tres cosas (quién, qué y a quién):\n\n<b>dit<\/b> — me lo\n<b>dizu<\/b> — te lo\n<b>dio<\/b> — se lo (a él)\n<b>digu<\/b> — nos lo\n<b>dizue<\/b> — os lo\n<b>die<\/b> — se lo (a ellos)\n\n<b>Liburua eman dit.<\/b> — Me ha dado el libro.\n<b>Aneri liburua eman diot.<\/b> — Le he dado el libro a Ane.\n\nNo hace falta que lo domines hoy. Basta con reconocerlo cuando lo oigas.", "ejemplos": [{"eu": "Aneri esan diot.", "es": "Se lo he dicho a Ane."}, {"eu": "Lagunari lagundu diot.", "es": "He ayudado al amigo."}, {"eu": "Zer esan dizu?", "es": "¿Qué te ha dicho?"}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "<b>La z se vuelve j<\/b>\nToda la serie de <i>zait<\/i> cambia de inicial en bizkaiera:\n\n<b>jat<\/b> — batua: zait\n<b>jatzu<\/b> — zaizu\n<b>jako<\/b> — zaio\n<b>jaku<\/b> — zaigu\n<b>jatzue<\/b> — zaizue\n<b>jake<\/b> — zaie\n\nAsí que «me gusta» por allí es <b>gustetan jat<\/b>, con el verbo también cambiado: donde el batua dice <i>gustatzen<\/i>, el bizkaiera dice <b>gustetan<\/b>.\n\n<b>Gustetan jat euskerea.<\/b> — Me gusta el euskera.\n\nY en plural, la <b>-z<\/b> de siempre: <b>jataz<\/b> donde el batua pone <i>zaizkit<\/i>.\n\n<b>Dar y decir<\/b>\nEl <i>dit<\/i> del batua es <b>deust<\/b> o <b>dost<\/b> en bizkaiera, y <i>dio<\/i> es <b>deutso<\/b>:\n\n<b>Emon deust.<\/b> — Me lo ha dado. (batua: eman dit)\n<b>Esan deutso.<\/b> — Se lo ha dicho. (batua: esan dio)\n\nY «dar» es <b>emon<\/b>, no <i>eman<\/i>.", "ejemplos": [{"eu": "Gustetan jat.", "es": "Me gusta. — batua: gustatzen zait."}, {"eu": "Ez jat gustetan.", "es": "No me gusta. — batua: ez zait gustatzen."}, {"eu": "Emon deust liburua.", "es": "Me ha dado el libro. — batua: eman dit."}]}], "ejercicios": [{"id": "u10-g01", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A mí me gusta el deporte. → Niri kirola gustatzen ____.", "opciones": ["zait", "zaizu", "zaio", "zaigu"], "correcta": 0, "explicacion": "«a mí» → zait."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "¿Qué te gusta? → Zer gustatzen ____?", "opciones": ["zait", "zaizu", "zaio", "zaie"], "correcta": 1, "explicacion": "«a ti» → zaizu."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A él le gusta el cine. → Hari zinema gustatzen ____.", "opciones": ["zait", "zaizu", "zaio", "zaigu"], "correcta": 2, "explicacion": "«a él» → zaio."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A nosotros nos gusta el euskera. → Guri euskara gustatzen ____.", "opciones": ["zait", "zaigu", "zaizue", "zaie"], "correcta": 1, "explicacion": "«a nosotros» → zaigu."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A ellos les gusta el fútbol. → Haiei futbola gustatzen ____.", "opciones": ["zaizue", "zaigu", "zaie", "zaio"], "correcta": 2, "explicacion": "«a ellos» → zaie."}]}, {"id": "u10-g02", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Me gustan los libros. → Liburuak gustatzen ____.", "opciones": ["zait", "zaizkit", "zaizu", "ditut"], "correcta": 1, "explicacion": "Lo que gusta va en plural → zaizkit."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Me gusta el libro. → Liburua gustatzen ____.", "opciones": ["zaizkit", "zait", "zaizu", "zaie"], "correcta": 1, "explicacion": "Singular → zait."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Te gustan las manzanas. → Sagarrak gustatzen ____.", "opciones": ["zaizu", "zaizkizu", "zaizkit", "zaizkie"], "correcta": 1, "explicacion": "«a ti» + plural = zaizkizu."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A él le gustan las verduras. → Barazkiak gustatzen ____.", "opciones": ["zaio", "zaizkio", "zaizkit", "zaie"], "correcta": 1, "explicacion": "«a él» + plural = zaizkio."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nos gustan los montes. → Mendiak gustatzen ____.", "opciones": ["zaigu", "zaizkigu", "zaizkie", "zaizkizue"], "correcta": 1, "explicacion": "«a nosotros» + plural = zaizkigu."}]}, {"id": "u10-g03", "variantes": [{"tipo": "pares", "instruccion": "Empareja los pronombres de dativo", "pares": [{"eu": "niri", "es": "a mí"}, {"eu": "zuri", "es": "a ti"}, {"eu": "hari", "es": "a él"}, {"eu": "guri", "es": "a nosotros"}]}, {"tipo": "pares", "instruccion": "Empareja los auxiliares", "pares": [{"eu": "zait", "es": "me (gusta)"}, {"eu": "zaizu", "es": "te (gusta)"}, {"eu": "zaio", "es": "le (gusta)"}, {"eu": "zaie", "es": "les (gusta)"}]}, {"tipo": "pares", "instruccion": "Empareja las aficiones", "pares": [{"eu": "kirola", "es": "el deporte"}, {"eu": "zinema", "es": "el cine"}, {"eu": "dantza", "es": "el baile"}, {"eu": "antzerkia", "es": "el teatro"}]}, {"tipo": "pares", "instruccion": "Empareja el tiempo y las estaciones", "pares": [{"eu": "euria", "es": "la lluvia"}, {"eu": "eguzkia", "es": "el sol"}, {"eu": "negua", "es": "el invierno"}, {"eu": "uda", "es": "el verano"}]}, {"tipo": "pares", "instruccion": "Empareja los verbos", "pares": [{"eu": "eman", "es": "dar"}, {"eu": "esan", "es": "decir"}, {"eu": "galdetu", "es": "preguntar"}, {"eu": "lagundu", "es": "ayudar"}]}]}, {"id": "u10-g04", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No me gusta el fútbol. → ____ futbola gustatzen.", "opciones": ["Ez zait", "Zait ez", "Ez gustatzen", "Gustatzen ez"], "correcta": 0, "explicacion": "El auxiliar salta detrás del «ez»: «Ez zait futbola gustatzen»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No me gustan las verduras. → ____ barazkiak gustatzen.", "opciones": ["Ez zait", "Ez zaizkit", "Zaizkit ez", "Ez zaizu"], "correcta": 1, "explicacion": "Plural y negativa: «Ez zaizkit … gustatzen»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No me gusta nada. → Ez zait ____ gustatzen.", "opciones": ["asko", "batere", "pixka bat", "gutxi"], "correcta": 1, "explicacion": "«batere» en negativa es «nada en absoluto»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Me gusta mucho. → ____ gustatzen zait.", "opciones": ["Asko", "Batere", "Ez", "Gutxi"], "correcta": 0, "explicacion": "«asko» es mucho."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "A mí también. → ____", "opciones": ["Niri ez.", "Niri ere bai.", "Niri bai ez.", "Ni ere."], "correcta": 1, "explicacion": "«ere» es «también», y el «bai» remata la respuesta corta."}]}, {"id": "u10-g05", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Me gusta el euskera.", "eu": "Niri euskara gustatzen zait.", "palabras": ["Niri", "euskara", "gustatzen", "zait."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Qué te gusta?", "eu": "Zer gustatzen zaizu?", "palabras": ["Zer", "gustatzen", "zaizu?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "A él le gusta el cine.", "eu": "Hari zinema gustatzen zaio.", "palabras": ["Hari", "zinema", "gustatzen", "zaio."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "No me gusta la lluvia.", "eu": "Ez zait euria gustatzen.", "palabras": ["Ez", "zait", "euria", "gustatzen."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Me gustan mucho los libros.", "eu": "Liburuak asko gustatzen zaizkit.", "palabras": ["Liburuak", "asko", "gustatzen", "zaizkit."]}]}, {"id": "u10-g06", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Me parece bien. → Ondo ____ zait.", "opciones": ["gustatzen", "iruditzen", "interesatzen", "axola"], "correcta": 1, "explicacion": "«iruditzen zait» es «me parece»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Me interesa el euskera. → Euskara ____ zait.", "opciones": ["gustatzen", "iruditzen", "interesatzen", "ahaztu"], "correcta": 2, "explicacion": "«interesatzen zait»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "No me importa. → Ez zait ____.", "opciones": ["gustatzen", "axola", "iruditzen", "eman"], "correcta": 1, "explicacion": "«axola zait» es «me importa»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "preg
