unta": "Se me ha olvidado. → ____ zait.", "opciones": ["Gustatzen", "Ahaztu", "Iruditzen", "Eman"], "correcta": 1, "explicacion": "«ahaztu zait»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Me llamo Ane. → Ane ____ izena.", "opciones": ["zait", "dut", "naiz", "zaio"], "correcta": 1, "explicacion": "Este va con «dut»: «Ane dut izena»."}]}, {"id": "u10-g07", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "a Ane → ____", "opciones": ["Ane", "Anera", "Aneri", "Anetik"], "correcta": 2, "explicacion": "«a alguien» se dice con -ri tras vocal."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "al amigo → ____", "opciones": ["laguna", "lagunari", "lagunera", "lagunik"], "correcta": 1, "explicacion": "laguna → lagunari."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "a la madre → ____", "opciones": ["ama", "amari", "amara", "amatik"], "correcta": 1, "explicacion": "ama → amari."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "a los amigos → ____", "opciones": ["lagunak", "lagunei", "lagunari", "lagunetan"], "correcta": 1, "explicacion": "El plural del dativo es -ei: lagunei."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "a mí → ____", "opciones": ["ni", "nik", "niri", "nire"], "correcta": 2, "explicacion": "«niri». Con -k sería el sujeto de un verbo con objeto; con -re, «mi»."}]}, {"id": "u10-g08", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Me gusta el euskera.", "respuestas": ["euskara gustatzen zait", "niri euskara gustatzen zait"], "pista": "El auxiliar es «zait»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿Qué te gusta?", "respuestas": ["zer gustatzen zaizu", "ze gustatzen zaizu", "zuri zer gustatzen zaizu"], "pista": "Tres palabras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "No me gusta el café.", "respuestas": ["ez zait kafea gustatzen", "niri ez zait kafea gustatzen"], "pista": "El auxiliar salta detrás del «ez»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Me gustan los libros.", "respuestas": ["liburuak gustatzen zaizkit", "niri liburuak gustatzen zaizkit"], "pista": "Plural: zaizkit."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Me parece bien.", "respuestas": ["ondo iruditzen zait", "niri ondo iruditzen zait"], "pista": "Tres palabras."}]}, {"id": "u10-g09", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "A nosotros nos gusta el monte.", "eu": "Guri mendia gustatzen zaigu.", "palabras": ["Guri", "mendia", "gustatzen", "zaigu."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "A ella no le gusta el fútbol.", "eu": "Hari ez zaio futbola gustatzen.", "palabras": ["Hari", "ez", "zaio", "futbola", "gustatzen."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Se lo he dicho a Ane.", "eu": "Nik Aneri esan diot.", "palabras": ["Nik", "Aneri", "esan", "diot."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Me interesa mucho el euskera.", "eu": "Euskara asko interesatzen zait.", "palabras": ["Euskara", "asko", "interesatzen", "zait."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "A ellos les gusta el verano.", "eu": "Haiei uda gustatzen zaie.", "palabras": ["Haiei", "uda", "gustatzen", "zaie."]}]}, {"id": "u10-g10", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Me ha dado el libro. → Liburua eman ____.", "opciones": ["dut", "dit", "dio", "zait"], "correcta": 1, "explicacion": "«a mí» con objeto → dit."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Se lo he dicho a Ane. → Aneri esan ____.", "opciones": ["dut", "dit", "diot", "zaio"], "correcta": 2, "explicacion": "Yo, a ella → diot."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "¿Qué te ha dicho? → Zer esan ____?", "opciones": ["duzu", "dizu", "diozu", "zaizu"], "correcta": 1, "explicacion": "Él, a ti → dizu."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nos ha ayudado. → Lagundu ____.", "opciones": ["du", "digu", "dugu", "zaigu"], "correcta": 1, "explicacion": "Él, a nosotros → digu."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Le he dado el libro. → Liburua eman ____.", "opciones": ["dut", "dit", "diot", "zaio"], "correcta": 2, "explicacion": "Yo, a él → diot."}]}, {"id": "u10-g11", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Me gusta» en bizkaiera: Gustetan ____.", "opciones": ["zait", "jat", "jako", "dot"], "correcta": 1, "explicacion": "El «zait» del batua es «jat» en bizkaiera."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Te gusta» en bizkaiera: Gustetan ____.", "opciones": ["zaizu", "jatzu", "jako", "jaku"], "correcta": 1, "explicacion": "zaizu → jatzu."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«No me gusta» en bizkaiera: Ez ____ gustetan.", "opciones": ["zait", "jat", "jako", "dot"], "correcta": 1, "explicacion": "«Ez jat gustetan»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Me lo ha dado» en bizkaiera: Emon ____.", "opciones": ["dit", "deust", "dio", "dut"], "correcta": 1, "explicacion": "dit → deust (o dost)."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«dar» en bizkaiera es ____", "opciones": ["eman", "emon", "esan", "hartu"], "correcta": 1, "explicacion": "«emon». En batua, «eman»."}]}, {"id": "u10-g12", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Niri euria ez zait gustatzen. Niri ____ gustatzen zait.", "opciones": ["euria", "eguzkia", "negua", "batere"], "correcta": 1, "explicacion": "Si no le gusta la lluvia, encaja el sol: eguzkia."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zer gustatzen zaizu? — ____ gustatzen zait.", "opciones": ["Kirolak", "Kirola", "Kirolari", "Kirolez"], "correcta": 1, "explicacion": "La pregunta es en singular, así que «kirola» con «zait»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Barazkiak ____ gustatzen.", "opciones": ["ez zait", "ez zaizkit", "ez zaizu", "zait ez"], "correcta": 1, "explicacion": "«barazkiak» es plural y la frase es negativa: «ez zaizkit»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hari ____ gustatzen zaio, eta niri ere bai.", "opciones": ["dantza", "dantzak", "dantzari", "dantzaz"], "correcta": 0, "explicacion": "Singular con «zaio»: dantza."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ez zait ____ gustatzen: ura edaten dut.", "opciones": ["ardoa", "ardorik", "ardoak", "ardoz"], "correcta": 0, "explicacion": "Con «gustatu» el sujeto no lleva partitivo: «ardoa»."}]}]}, {"id": "u11", "numero": 11, "titulo": "Atzo zer egin zenuen?", "subtitulo": "El pasado", "objetivo": "Contar lo que pasó ayer, el año pasado o cuando eras pequeño.", "color": "ocre", "vocabulario": [{"eu": "nintzen", "es": "(yo) era, fui", "nota": null}, {"eu": "zinen", "es": "(tú) eras, fuiste", "nota": null}, {"eu": "zen", "es": "(él/ella) era, fue", "nota": null}, {"eu": "ginen", "es": "(nosotros) éramos", "nota": null}, {"eu": "zineten", "es": "(vosotros) erais", "nota": null}, {"eu": "ziren", "es": "(ellos) eran", "nota": null}, {"eu": "nuen", "es": "(yo) tenía, tuve", "nota": null}, {"eu": "zenuen", "es": "(tú) tenías", "nota": null}, {"eu": "zuen", "es": "(él/ella) tenía", "nota": null}, {"eu": "genuen", "es": "(nosotros) teníamos", "nota": null}, {"eu": "zuten", "es": "(ellos) tenían", "nota": null}, {"eu": "nengoen", "es": "(yo) estaba", "nota": null}, {"eu": "zegoen", "es": "(él/ella) estaba", "nota": null}, {"eu": "lehen", "es": "antes", "nota": null}, {"eu": "orduan", "es": "entonces", "nota": null}, {"eu": "gero", "es": "luego", "nota": "Ya lo viste como «después»; aquí encadena hechos pasados."}, {"eu": "herenegun", "es": "anteayer", "nota": null}, {"eu": "iaz", "es": "el año pasado", "nota": null}, {"eu": "aurten", "es": "este año", "nota": null}, {"eu": "joan den astean", "es": "la semana pasada", "nota": "«joan den» es «la que se ha ido»."}, {"eu": "duela bi urte", "es": "hace dos años", "nota": "«duela» + el tiempo: duela hilabete, duela urtebete."}, {"eu": "txikitan", "es": "de pequeño", "nota": "De «txiki» + esa -tan de plural que ya conoces."}, {"eu": "garai hartan", "es": "en aquella época", "nota": null}, {"eu": "jaio", "es": "nacer", "nota": null}, {"eu": "ezagutu", "es": "conocer", "nota": null}, {"eu": "gogoratu", "es": "recordar", "nota": null}, {"eu": "ahaztu", "es": "olvidar", "nota": null}, {"eu": "hasi", "es": "empezar", "nota": null}, {"eu": "bukatu", "es": "terminar", "nota": "También «amaitu»."}, {"eu": "gertatu", "es": "ocurrir, pasar", "nota": null}, {"eu": "oporrak", "es": "las vacaciones", "nota": "Siempre en plural."}, {"eu": "jaiak", "es": "las fiestas", "nota": "Las de un pueblo. En singular, «jaia» es la fiesta suelta."}, {"eu": "aspaldi", "es": "hace mucho tiempo", "nota": null}, {"eu": "berriro", "es": "otra vez", "nota": null}], "gramatica": [{"titulo": "El pasado de «izan»", "cuerpo": "El presente lo tienes desde la cuarta unidad. El pasado se parece bastante:\n\n<b>ni nintzen<\/b> — yo era, yo fui\n<b>zu zinen<\/b> — tú eras\n<b>hura zen<\/b> — él/ella era\n<b>gu ginen<\/b> — nosotros éramos\n<b>zuek zineten<\/b> — vosotros erais\n<b>haiek ziren<\/b> — ellos eran\n\nMira la lógica: donde el presente pone <i>n-<\/i> para «yo» (<i>naiz<\/i>), el pasado también (<i>nintzen<\/i>); donde pone <i>z-<\/i> para «tú» (<i>zara<\/i>), el pasado también (<i>zinen<\/i>). Y todas las formas de pasado acaban en <b>-n<\/b>.\n\nEsa <b>-n<\/b> final es la marca del pasado en euskera. Una vez la ves, la reconoces en todas partes.", "ejemplos": [{"eu": "Ni Gernikan jaio nintzen.", "es": "Nací en Gernika."}, {"eu": "Atzo Bilbon zen.", "es": "Ayer estuvo en Bilbao."}, {"eu": "Gu lagunak ginen.", "es": "Éramos amigos."}]}, {"titulo": "El pasado de «ukan» (tener)", "cuerpo": "Y el otro auxiliar, el de los verbos con objeto:\n\n<b>nik nuen<\/b> — yo tenía / lo hice\n<b>zuk zenuen<\/b>\n<b>hark zuen<\/b>\n<b>guk genuen<\/b>\n<b>zuek zenuten<\/b>\n<b>haiek zuten<\/b>\n\nOtra vez la <b>-n<\/b> del final, y el sujeto con <b>-k<\/b> como siempre que hay objeto.\n\nSi el objeto es plural, se cuela el <b>-it-<\/b> de la octava unidad:\n\n<b>nik nituen<\/b> — yo los/las…\n<b>zuk zenituen<\/b> — tú\n<b>hark zituen<\/b> — él/ella\n<b>guk genituen<\/b> — nosotros\n<b>zuek zenituzten<\/b> — vosotros\n<b>haiek zituzten<\/b> — ellos\n\n<b>Liburua irakurri nuen.<\/b> — Leí el libro.\n<b>Liburuak irakurri nituen.<\/b> — Leí los libros.", "ejemplos": [{"eu": "Atzo film bat ikusi nuen.", "es": "Ayer vi una película."}, {"eu": "Zer egin zenuen?", "es": "¿Qué hiciste?"}, {"eu": "Haiek etxe bat zuten.", "es": "Ellos tenían una casa."}]}, {"titulo": "El pasado de «egon»", "cuerpo": "<b>ni nengoen<\/b> — yo estaba\n<b>zu zeunden<\/b>\n<b>hura zegoen<\/b>\n<b>gu geunden<\/b>\n<b>zuek zeundeten<\/b>\n<b>haiek zeuden<\/b>\n\nSirve igual que en presente: para dónde estaba algo y para cómo estaba alguien.\n\n<b>Etxean nengoen.<\/b> — Estaba en casa.\n<b>Non zegoen?<\/b> — ¿Dónde estaba?\n<b>Nekatuta geunden.<\/b> — Estábamos cansados.", "ejemplos": [{"eu": "Atzo etxean nengoen.", "es": "Ayer estaba en casa."}, {"eu": "Non zegoen liburua?", "es": "¿Dónde estaba el libro?"}, {"eu": "Haiek tabernan zeuden.", "es": "Ellos estaban en el bar."}]}, {"titulo": "«Comí», «he comido» y «comía»", "cuerpo": "El euskera separa las tres con mucha limpieza. La pieza del verbo dice el aspecto, y el auxiliar dice el tiempo:\n\n<b>jan dut<\/b> — he comido (participio + presente)\n<b>jan nuen<\/b> — comí (participio + pasado)\n<b>jaten nuen<\/b> — comía, solía comer (forma en -t(z)en + pasado)\n\nY con los verbos sin objeto, igual:\n<b>etorri naiz<\/b> — he venido\n<b>etorri nintzen<\/b> — vine\n<b>etortzen nintzen<\/b> — venía, solía venir\n\nEs el mismo mecanismo de dos piezas de la octava unidad. Lo único nuevo es el auxiliar.", "ejemplos": [{"eu": "Atzo Bilbora joan nintzen.", "es": "Ayer fui a Bilbao."}, {"eu": "Txikitan Gernikan bizi nintzen.", "es": "De pequeño vivía en Gernika."}, {"eu": "Gaur ez naiz joan.", "es": "Hoy no he ido."}]}, {"titulo": "Cuándo pasó", "cuerpo": "Los que ya conoces: <b>atzo<\/b> (ayer), <b>bart<\/b> (anoche), <b>herenegun<\/b> (anteayer).\n\nY los nuevos:\n\n<b>lehen<\/b> — antes\n<b>orduan<\/b> — entonces\n<b>aspaldi<\/b> — hace mucho\n<b>iaz<\/b> — el año pasado\n<b>joan den astean<\/b> — la semana pasada\n<b>joan den hilean<\/b> — el mes pasado\n<b>duela bi urte<\/b> — hace dos años\n<b>txikitan<\/b> — de pequeño\n<b>garai hartan<\/b> — en aquella época\n\n<b>duela<\/b> se usa con cualquier medida de tiempo: <i>duela ordubete<\/i> (hace una hora), <i>duela hilabete<\/i> (hace un mes), <i>duela urtebete<\/i> (hace un año).\n\nY como con las horas, lo normal es que el «cuándo» abra la frase.", "ejemplos": [{"eu": "Joan den astean Bilbon nengoen.", "es": "La semana pasada estaba en Bilbao."}, {"eu": "Duela bi urte ezagutu nuen.", "es": "La conocí hace dos años."}, {"eu": "Txikitan euskaraz hitz egiten nuen.", "es": "De pequeño hablaba en euskera."}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "El pasado es uno de los sitios donde más se separan las dos variedades. Si el batua acaba en <b>-en<\/b>, el bizkaiera tiende a <b>-an<\/b>:\n\n<b>ni nintzan<\/b> — batua: nintzen\n<b>zu zinan<\/b> — zinen\n<b>hura zan<\/b> — zen\n<b>gu ginan<\/b> — ginen\n<b>haiek ziran<\/b> — ziren\n\nAsí que «era de Gernika» por allí es <b>Gernikakoa zan<\/b>.\n\n<b>El pasado de tener<\/b>\nAquí el cambio es mayor todavía:\n\n<b>neban<\/b> — batua: nuen\n<b>zenduan<\/b> — zenuen\n<b>eban<\/b> — zuen\n<b>genduan<\/b> — genuen\n<b>eben<\/b> — zuten\n\n<b>Ikusi neban.<\/b> — Lo vi. (batua: ikusi nuen)\n<b>Esan eban.<\/b> — Lo dijo. (batua: esan zuen)\n\n<b>Estar<\/b>\nY <i>zegoen<\/i> es <b>egoan<\/b>: <b>Etxean egoan.<\/b> — Estaba en casa.\n\nEste es el bloque que más cuesta de oído al principio, porque <i>eban<\/i> y <i>zuen<\/i> no se parecen en nada. Pero son media docena de formas, y salen constantemente.", "ejemplos": [{"eu": "Ni Gernikan jaio nintzan.", "es": "Nací en Gernika. — batua: nintzen."}, {"eu": "Ikusi neban.", "es": "Lo vi. — batua: ikusi nuen."}, {"eu": "Etxean egoan.", "es": "Estaba en casa. — batua: etxean zegoen."}]}], "ejercicios": [{"id": "u11-g01", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ni Gernikan jaio ____.", "opciones": ["naiz", "nintzen", "nengoen", "nuen"], "correcta": 1, "explicacion": "«nacer» no lleva objeto: el pasado de «izan» con «ni» es «nintzen»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zu atzo Bilbon ____.", "opciones": ["zara", "zinen", "zenuen", "zeunden"], "correcta": 1, "explicacion": "Pasado de «izan» con «zu»: zinen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hura nire laguna ____.", "opciones": ["da", "zen", "zuen", "zegoen"], "correcta": 1, "explicacion": "Pasado de «izan» con «hura»: zen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gu lagunak ____.", "opciones": ["gara", "ginen", "genuen", "geunden"], "correcta": 1, "explicacion": "Pasado de «izan» con «gu»: ginen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek ikasleak ____.", "opciones": ["dira", "ziren", "zuten", "zeuden"], "correcta": 1, "explicacion": "Pasado de «izan» con «haiek»: ziren."}]}, {"id": "u11-g02", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Nik atzo film bat ikusi ____.", "opciones": ["dut", "nuen", "nintzen", "nengoen"], "correcta": 1, "explicacion": "Hay objeto (una película) y es pasado: nuen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Zer egin ____? (tú)", "opciones": ["duzu", "zenuen", "zinen", "zeunden"], "correcta": 1, "explicacion": "Pasado de «ukan» con «zuk»: zenuen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hark liburua irakurri ____.", "opciones": ["du", "zuen", "zen", "zegoen"], "correcta": 1, "explicacion": "Pasado de «ukan» con «hark»: zuen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Guk etxe bat ____.", "opciones": ["dugu", "genuen", "ginen", "geunden"], "correcta": 1, "explicacion": "Pasado de «ukan» con «guk»: genuen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Haiek euskara ikasi ____.", "opciones": ["dute", "zuten", "ziren", "zeuden"], "correcta": 1, "explicacion": "Pasado de «ukan» con «haiek»: zuten."}]}, {"id": "u11-g03", "variantes": [{"tipo": "pares", "instruccion": "Empareja el pasado de «izan»", "pares": [{"eu": "nintzen", "es": "yo era"}, {"eu": "zinen", "es": "tú eras"}, {"eu": "zen", "es": "él era"}, {"eu": "ziren", "es": "ellos eran"}]}, {"tipo": "pares", "instruccion": "Empareja el pasado de «ukan»", "pares": [{"eu": "nuen", "es": "yo tenía"}, {"eu": "zenuen", "es": "tú tenías"}, {"eu": "zuen", "es": "él tenía"}, {"eu": "zuten", "es": "ellos tenían"}]}, {"tipo": "pares", "instruccion": "Empareja los marcadores de pasado", "pares": [{"eu": "atzo", "es": "ayer"}, {"eu": "herenegun", "es": "anteayer"}, {"eu": "bart", "es": "anoche"}, {"eu": "iaz", "es": "el año pasado"}]}, {"tipo": "pares", "instruccion": "Empareja los verbos", "pares": [{"eu": "jaio", "es": "nacer"}, {"eu": "ezagutu", "es": "conocer"}, {"eu": "hasi", "es": "empezar"}, {"eu": "bukatu", "es": "terminar"}]}, {"tipo": "pares", "instruccion": "Empareja las expresiones de tiempo", "pares": [{"eu": "lehen", "es": "antes"}, {"eu": "orduan", "es": "entonces"}, {"eu": "aspaldi", "es": "hace mucho"}, {"eu": "txikitan", "es": "de pequeño"}]}]}, {"id": "u11-g04", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ayer estaba en casa. → Atzo etxean ____.", "opciones": ["nago", "nengoen", "nintzen", "nuen"], "correcta": 1, "explicacion": "Ubicación y pasado → «egon» en pasado: nengoen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "¿Dónde estaba el libro? → Non ____ liburua?", "opciones": ["dago", "zegoen", "zen", "zuen"], "correcta": 1, "explicacion": "«egon» en pasado con «hura»: zegoen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ellos estaban en el bar. → Haiek tabernan ____.", "opciones": ["daude", "zeuden", "ziren", "zuten"], "correcta": 1, "explicacion": "«egon» en pasado con «haiek»: zeuden."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Estábamos cansados. → Nekatuta ____.", "opciones": ["gaude", "geunden", "ginen", "genuen"], "correcta": 1, "explicacion": "Estado pasajero → «egon»: geunden."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "¿Dónde estabas? → Non ____?", "opciones": ["zaude", "zeunden", "zinen", "zenuen"], "correcta": 1, "explicacion": "«egon» en pasado con «zu»: zeunden."}]}, {"id": "u11-g05", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ayer fui a Bilbao.", "eu": "Atzo Bilbora joan nintzen.", "palabras": ["Atzo", "Bilbora", "joan", "nintzen."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "De pequeño vivía en Gernika.", "eu": "Txikitan Gernikan bizi nintzen.", "palabras": ["Txikitan", "Gernikan", "bizi", "nintzen."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ayer vi una película.", "eu": "Atzo film bat ikusi nuen.", "palabras": ["Atzo", "film", "bat", "ikusi", "nuen."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "La semana pasada estaba en casa.", "eu": "Joan den astean etxean nengoen.", "palabras": ["Joan", "den", "astean", "etxean", "nengoen."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Ellos eran mis amigos.", "eu": "Haiek nire lagunak ziren.", "palabras": ["Haiek", "nire", "lagunak", "ziren."]}]}, {"id": "u11-g06", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "He comido. → Jan ____.", "opciones": ["dut", "nuen", "naiz", "nintzen"], "correcta": 0, "explicacion": "Participio + presente = «he comido»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Comí. → Jan ____.", "opciones": ["dut", "nuen", "naiz", "nintzen"], "correcta": 1, "explicacion": "Participio + pasado = «comí»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Comía, solía comer. → ____ nuen.", "opciones": ["Jan", "Jaten", "Jango", "Jatea"], "correcta": 1, "explicacion": "La forma en -t(z)en + pasado = lo habitual en el pasado."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "He venido. → Etorri ____.", "opciones": ["naiz", "nintzen", "dut", "nuen"], "correcta": 0, "explicacion": "Sin objeto y presente: naiz."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Vine. → Etorri ____.", "opciones": ["naiz", "nintzen", "dut", "nuen"], "correcta": 1, "explicacion": "Sin objeto y pasado: nintzen."}]}, {"id": "u11-g07", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Hace dos años. → ____ bi urte.", "opciones": ["Joan den", "Duela", "Orduan", "Aspaldi"], "correcta": 1, "explicacion": "«duela» + la medida de tiempo."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "La semana pasada. → ____ astean.", "opciones": ["Duela", "Joan den", "Garai", "Aurten"], "correcta": 1, "explicacion": "«joan den astean», la semana que se ha ido."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "El año pasado. → ____", "opciones": ["aurten", "iaz", "aspaldi", "orduan"], "correcta": 1, "explicacion": "«iaz» es el año pasado; «aurten», este año."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "De pequeño. → ____", "opciones": ["txikia", "txikitan", "txikira", "txikiz"], "correcta": 1, "explicacion": "«txikitan», con esa -tan de plural."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Anteayer. → ____", "opciones": ["atzo", "bart", "herenegun", "etzi"], "correcta": 2, "explicacion": "«herenegun». «etzi» es pasado mañana, hacia el otro lado."}]}, {"id": "u11-g08", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Nací en Gernika.", "respuestas": ["gernikan jaio nintzen", "ni gernikan jaio nintzen"], "pista": "Tres palabras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Ayer fui a Bilbao.", "respuestas": ["atzo bilbora joan nintzen", "ni atzo bilbora joan nintzen", "atzo ni bilbora joan nintzen"], "pista": "Empieza por «atzo»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿Qué hiciste?", "respuestas": ["zer egin zenuen", "ze egin zenuen"], "pista": "Tres palabras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "Estaba en casa.", "respuestas": ["etxean nengoen", "ni etxean nengoen"], "pista": "Con «egon» en pasado."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "La conocí hace dos años.", "respuestas": ["duela bi urte ezagutu nuen", "nik duela bi urte ezagutu nuen"], "pista": "Empieza por «duela»."}]}, {"id": "u11-g09", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Dónde estabas ayer?", "eu": "Non zeunden zu atzo?", "palabras": ["Non", "zeunden", "zu", "atzo?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Leí los libros.", "eu": "Nik liburuak irakurri nituen.", "palabras": ["Nik", "liburuak", "irakurri", "nituen."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Entonces éramos amigos.", "eu": "Orduan lagunak ginen.", "palabras": ["Orduan", "lagunak", "ginen."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Hace mucho no hablaba en euskera.", "eu": "Aspaldi ez nuen euskaraz hitz egiten.", "palabras": ["Aspaldi", "ez", "nuen", "euskaraz", "hitz", "egiten."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Anoche estuve en el bar.", "eu": "Bart tabernan nengoen.", "palabras": ["Bart", "tabernan", "nengoen."]}]}, {"id": "u11-g10", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Leí los libros. → Liburuak irakurri ____.", "opciones": ["nuen", "nituen", "dut", "ditut"], "correcta": 1, "explicacion": "Objeto plural en pasado: nituen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Leí el libro. → Liburua irakurri ____.", "opciones": ["nituen", "nuen", "dut", "ditut"], "correcta": 1, "explicacion": "Objeto singular en pasado: nuen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Compraste las manzanas. → Sagarrak erosi ____.", "opciones": ["zenuen", "zenituen", "duzu", "dituzu"], "correcta": 1, "explicacion": "Objeto plural, pasado, «zuk»: zenituen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Ellos vieron las casas. → Etxeak ikusi ____.", "opciones": ["zuten", "zituzten", "dute", "dituzte"], "correcta": 1, "explicacion": "Objeto plural, pasado, «haiek»: zituzten."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Vimos la película. → Filma ikusi ____.", "opciones": ["genituen", "genuen", "dugu", "ditugu"], "correcta": 1, "explicacion": "Objeto singular, pasado, «guk»: genuen."}]}, {"id": "u11-g11", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Nací en Gernika» en bizkaiera: Gernikan jaio ____.", "opciones": ["nintzen", "nintzan", "neban", "naz"], "correcta": 1, "explicacion": "El «-en» del batua se vuelve «-an»: nintzan."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Lo vi» en bizkaiera: Ikusi ____.", "opciones": ["nuen", "neban", "nintzan", "dot"], "correcta": 1, "explicacion": "El «nuen» del batua es «neban»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Lo dijo» en bizkaiera: Esan ____.", "opciones": ["zuen", "eban", "zan", "dau"], "correcta": 1, "explicacion": "«eban», donde el batua pone «zuen»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Estaba en casa» en bizkaiera: Etxean ____.", "opciones": ["zegoen", "egoan", "zan", "dago"], "correcta": 1, "explicacion": "«egoan», donde el batua pone «zegoen»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "«Ellos eran» en bizkaiera: ____", "opciones": ["ziren", "ziran", "eben", "dira"], "correcta": 1, "explicacion": "ziren → ziran."}]}, {"id": "u11-g12", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Gaur ez naiz joan, baina atzo ____.", "opciones": ["joan naiz", "joan nintzen", "joaten naiz", "joango naiz"], "correcta": 1, "explicacion": "Ayer es pasado y el verbo no lleva objeto: joan nintzen."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Lehen Bilbon bizi ____, orain Gernikan.", "opciones": ["naiz", "nintzen", "nuen", "nago"], "correcta": 1, "explicacion": "«lehen» pide pasado, y «bizi izan» va con «izan»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Atzo ____ nuen, gaur ez.", "opciones": ["lan egiten", "lan egin", "lana", "lanean"], "correcta": 1, "explicacion": "«ayer trabajé»: participio + pasado."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Txikitan euskaraz ____ nuen.", "opciones": ["hitz egin", "hitz egiten", "hitz", "hitza"], "correcta": 1, "explicacion": "«de pequeño hablaba»: es habitual, así que -t(z)en."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Duela bi urte Gernikan ____.", "opciones": ["nago", "nengoen", "naiz", "nuen"], "correcta": 1, "explicacion": "«hace dos años» es pasado, y «estar» → nengoen."}]}]}, {"id": "u12", "numero": 12, "titulo": "Dena batera", "subtitulo": "Preguntar, comparar y cerrar el A1", "objetivo": "Rematar el nivel: preguntas de sí o no, comparaciones, conectores y un repaso de todo.", "color": "bezier", "vocabulario": [{"eu": "al", "es": "(partícula de pregunta)", "nota": "No significa nada por sí sola: solo marca que la frase es una pregunta de sí o no."}, {"eu": "baino", "es": "que (en comparaciones)", "nota": null}, {"eu": "-ago", "es": "más", "nota": "Se pega al adjetivo: handi → handiago."}, {"eu": "-ena", "es": "el más", "nota": "handi → handiena."}, {"eu": "gehiago", "es": "más (cantidad)", "nota": null}, {"eu": "gutxiago", "es": "menos", "nota": null}, {"eu": "hobea", "es": "mejor", "nota": "Irregular: de «ona» (bueno)."}, {"eu": "txarragoa", "es": "peor", "nota": "Comparativo de «txarra» (malo). También se oye «okerragoa», sobre todo como adverbio."}, {"eu": "hobeto", "es": "mejor (adverbio)", "nota": "De «ondo». «Hobea» es el adjetivo; «hobeto», el adverbio."}, {"eu": "bezain", "es": "tan… como", "nota": null}, {"eu": "berdin", "es": "igual", "nota": null}, {"eu": "beraz", "es": "así que, por tanto", "nota": null}, {"eu": "hala ere", "es": "aun así", "nota": null}, {"eu": "gainera", "es": "además", "nota": null}, {"eu": "adibidez", "es": "por ejemplo", "nota": null}, {"eu": "bakarrik", "es": "solo, únicamente", "nota": null}, {"eu": "denak", "es": "todos", "nota": null}, {"eu": "norbait", "es": "alguien", "nota": null}, {"eu": "inor ez", "es": "nadie", "nota": null}, {"eu": "zerbait", "es": "algo", "nota": null}, {"eu": "nonbait", "es": "en algún sitio", "nota": null}, {"eu": "noski", "es": "claro, por supuesto", "nota": null}, {"eu": "benetan", "es": "de verdad", "nota": null}, {"eu": "azkar", "es": "rápido", "nota": null}, {"eu": "poliki", "es": "despacio", "nota": null}, {"eu": "zaila", "es": "difícil", "nota": null}, {"eu": "erraza", "es": "fácil", "nota": null}, {"eu": "garrantzitsua", "es": "importante", "nota": null}, {"eu": "-lako", "es": "porque", "nota": "Se pega al verbo: «euskalduna naizelako»."}, {"eu": "hitza", "es": "la palabra", "nota": null}, {"eu": "aditza", "es": "el verbo", "nota": null}, {"eu": "esaldia", "es": "la frase", "nota": null}, {"eu": "hurrengoa", "es": "el siguiente", "nota": null}, {"eu": "zorionak", "es": "felicidades", "nota": "Literalmente «suertes buenas»."}], "gramatica": [{"titulo": "Preguntas de sí o no: la partícula «al»", "cuerpo": "Hasta ahora has preguntado con <i>nor, zer, non, noiz…<\/i>. Para las preguntas que se responden con <b>bai<\/b> o <b>ez<\/b> hay una palabrita que se cuela justo antes del verbo: <b>al<\/b>.\n\n<b>Euskalduna zara.<\/b> — Hablas euskera.\n<b>Euskalduna <u>al<\/u> zara?<\/b> — ¿Hablas euskera?\n\n<b>Kafea nahi <u>al<\/u> duzu?<\/b> — ¿Quieres café?\n<b>Etxean <u>al<\/u> zaude?<\/b> — ¿Estás en casa?\n<b>Euskara ikasten <u>al<\/u> duzu?<\/b> — ¿Estudias euskera? (con <i>euskaraz<\/i> sería «¿estudias <b>en<\/b> euskera?»)\n\nNo significa nada: solo avisa de que viene una pregunta. Se puede omitir y la frase sigue entendiéndose por la entonación, igual que en castellano, pero con <b>al<\/b> queda mucho más natural.\n\nY las respuestas cortas repiten el verbo: <b>Bai, naiz.<\/b> / <b>Ez, ez naiz.<\/b>", "ejemplos": [{"eu": "Euskalduna al zara?", "es": "¿Hablas euskera?"}, {"eu": "Kafea nahi al duzu?", "es": "¿Quieres café?"}, {"eu": "Bai, nahi dut.", "es": "Sí, quiero."}]}, {"titulo": "Más, menos, el que más", "cuerpo": "El comparativo se pega detrás del adjetivo:\n\n<b>handi<\/b> (grande) → <b>handiago<\/b> — más grande\n<b>txiki<\/b> (pequeño) → <b>txikiago<\/b> — más pequeño\n<b>polit<\/b> (bonito) → <b>politago<\/b> — más bonito\n\nOjo: el adjetivo va aquí <b>sin el artículo -a<\/b>. <i>handia<\/i> es «grande», pero para comparar se parte de <i>handi<\/i>.\n\nY el «que» de la comparación es <b>baino<\/b>, que va <b>delante<\/b>:\n\n<b>Bilbo Gernika <u>baino<\/u> handiagoa da.<\/b> — Bilbao es más grande que Gernika.\n\nEl superlativo es <b>-ena<\/b>:\n<b>handiena<\/b> — el más grande\n<b>Bilbo Bizkaiko hiri handiena da.<\/b> — Bilbao es la ciudad más grande de Bizkaia.\n\nPara «tan… como», <b>bezain<\/b>:\n<b>Ni zu bezain altua naiz.<\/b> — Soy tan alto como tú.\n\nY tres irregulares que salen a diario:\n<b>ona<\/b> (bueno) → <b>hobea<\/b> (mejor) → <b>onena<\/b> (el mejor)\n<b>asko<\/b> (mucho) → <b>gehiago<\/b> (más) → <b>gehien<\/b> (el que más)\n<b>ondo<\/b> (bien) → <b>hobeto<\/b> (mejor)", "ejemplos": [{"eu": "Bilbo Gernika baino handiagoa da.", "es": "Bilbao es más grande que Gernika."}, {"eu": "Gaur hobeto nago.", "es": "Hoy estoy mejor."}, {"eu": "Zu bezain azkar.", "es": "Tan rápido como tú."}]}, {"titulo": "Enlazar frases", "cuerpo": "Los que ya tienes: <b>eta<\/b> (y), <b>baina<\/b> (pero), <b>edo<\/b> (o), <b>ere<\/b> (también).\n\nCuidado con <b>ere<\/b>: va <b>detrás<\/b> de lo que acompaña, no delante.\n<b>Ni ere euskalduna naiz.<\/b> — Yo también hablo euskera.\n\nY unos cuantos más:\n<b>beraz<\/b> — así que\n<b>gainera<\/b> — además\n<b>hala ere<\/b> — aun así\n<b>adibidez<\/b> — por ejemplo\n\nPara «porque» el euskera no usa una palabra suelta, sino un sufijo pegado al verbo: <b>-lako<\/b>.\n\n<b>Zergatik ikasten duzu euskara?<\/b>\n<b>Gustatzen zaidalako.<\/b> — Porque me gusta.\n<b>Euskalduna naizelako.<\/b> — Porque hablo euskera.\n\nNo hace falta que lo produzcas todavía. Reconocerlo ya es bastante: cuando oigas un verbo acabado en <b>-lako<\/b>, alguien te está dando una razón.", "ejemplos": [{"eu": "Nekatuta nago, beraz etxean geratzen naiz.", "es": "Estoy cansado, así que me quedo en casa."}, {"eu": "Ni ere Gernikakoa naiz.", "es": "Yo también soy de Gernika."}, {"eu": "Gustatzen zaidalako.", "es": "Porque me gusta."}]}, {"titulo": "Todo el A1 en un cuadro", "cuerpo": "Los sufijos que has visto, sobre <i>etxe<\/i> (casa):\n\n<b>etxea<\/b> — la casa\n<b>etxeak<\/b> — las casas\n<b>etxean<\/b> — en la casa (non?)\n<b>etxera<\/b> — a la casa (nora?)\n<b>etxetik<\/b> — desde la casa (nondik?)\n<b>etxeko<\/b> — de la casa (nongoa?)\n<b>etxeetan / etxeetara / etxeetatik<\/b> — los mismos, en plural\n<b>etxerik<\/b> — casa (en negativas)\n\nY sobre personas: <b>-k<\/b> para el sujeto de un verbo con objeto (<i>nik<\/i>), <b>-ri<\/b> para «a quien» (<i>niri<\/i>), <b>-ren<\/b> para «de quien» (<i>nire<\/i>), <b>-rekin<\/b> para «con quien» (<i>nirekin<\/i>).\n\nLos verbos:\n<b>izan<\/b> — naiz, zara, da… / nintzen, zinen, zen…\n<b>ukan<\/b> — dut, duzu, du… / nuen, zenuen, zuen…\n<b>egon<\/b> — nago, zaude, dago… / nengoen, zeunden, zegoen…\n<b>joan<\/b> — noa, zoaz, doa… <b>etorri<\/b> — nator, zatoz, dator…\n<b>zait<\/b> y su serie, para los gustos.\n\nY las dos piezas: <b>jan dut<\/b> (he comido), <b>jaten dut<\/b> (como), <b>jan nuen<\/b> (comí), <b>jaten nuen<\/b> (comía).", "ejemplos": [{"eu": "Etxetik etxera.", "es": "De casa a casa."}, {"eu": "Nirekin zatoz?", "es": "¿Vienes conmigo?"}, {"eu": "Jaten dut, jan dut, jan nuen.", "es": "Como, he comido, comí."}]}, {"titulo": "Qué viene después", "cuerpo": "Con esto tienes un A1 completo: te presentas, preguntas, cuentas tu día, dices lo que te gusta y hablas del pasado. Es suficiente para sostener una conversación corta y para entender bastante más de lo que puedes decir.\n\nLo que falta, por orden de utilidad:\n\n<b>El futuro<\/b>: <i>jango dut<\/i> (comeré). Es el participio con <b>-ko<\/b> y el mismo auxiliar. Se aprende en una tarde.\n\n<b>El imperativo<\/b>: <i>etorri!<\/i>, <i>esan!<\/i>. Casi siempre es el participio a secas.\n\n<b>Las subordinadas<\/b>: el <b>-la<\/b> de «dice que…», el <b>-n<\/b> de «cuando…», el <b>-lako<\/b> que ya has visto. Aquí es donde el euskera se pone realmente distinto del castellano.\n\n<b>El hitano<\/b>: la forma de tuteo con <i>hi<\/i>, con verbo propio según hables a un hombre o a una mujer. En Bizkaia se usa, y mucho, entre gente de confianza.\n\n<b>Los verbos sintéticos<\/b> que faltan: <i>jakin<\/i> (saber: dakit, dakizu…), <i>eduki<\/i> (tener: daukat), <i>ekarri<\/i>, <i>eraman<\/i>.\n\nPero antes de nada: habla. Con lo de estas doce unidades ya puedes.", "ejemplos": [{"eu": "Bihar Bilbora joango naiz.", "es": "Mañana iré a Bilbao."}, {"eu": "Ez dakit.", "es": "No sé."}, {"eu": "Zorionak!", "es": "¡Felicidades!"}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "El repaso del dialecto, que ha ido saliendo unidad a unidad:\n\n<b>naiz → naz<\/b> · <b>dut → dot<\/b> · <b>zaude → zagoz<\/b> · <b>zait → jat<\/b>\n<b>nintzen → nintzan<\/b> · <b>nuen → neban<\/b> · <b>zegoen → egoan<\/b>\n<b>-tik → -ti<\/b> · <b>eman → emon<\/b> · <b>irten → urten<\/b>\n<b>nola → zelan<\/b> · <b>-rekin → -gaz<\/b> · <b>zer → ze<\/b>\nLos días: <b>martitzena, eguaztena, eguena, barikua, zapatua, domeka<\/b>\n\nY lo que faltaba:\n\n<b>ere → be<\/b>\n«También» es <b>be<\/b> en bizkaiera: <b>Ni be bai.<\/b> — Yo también. Es de las palabras que más se oyen.\n\n<b>zergatik → zegaitik<\/b>\nY «porque» es <b>-lako<\/b> en los dos.\n\n<b>ete<\/b>\nUna partícula preciosa que el batua casi no usa: marca la duda. <b>Etorriko ete da?<\/b> — ¿Vendrá?, me pregunto si vendrá.\n\n<b>-txu<\/b>\nEl diminutivo cariñoso. Donde el batua pone <i>-txo<\/i>, el bizkaiera pone <b>-txu<\/b>: <i>etxetxu<\/i>, <i>polittxu<\/i>.\n\nY el aviso de siempre: esto es Busturialdea en general, no Gernika calle por calle, y quien tenga menos de cuarenta años mezclará con batua sin darse cuenta. Úsalo para entender, no para corregir a nadie.", "ejemplos": [{"eu": "Ni be bai.", "es": "Yo también. — batua: Ni ere bai."}, {"eu": "Etorriko ete da?", "es": "¿Vendrá? — matiz de duda."}, {"eu": "Zegaitik?", "es": "¿Por qué? — batua: Zergatik?"}]}], "ejercicios": [{"id": "u12-g01", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "¿Hablas euskera? → Euskalduna ____ zara?", "opciones": ["al", "ala", "ere", "bai"], "correcta": 0, "explicacion": "La partícula «al» va justo antes del verbo."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "¿Quieres café? → Kafea nahi ____ duzu?", "opciones": ["ere", "al", "edo", "bai"], "correcta": 1, "explicacion": "«al» delante del auxiliar."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "¿Estás en casa? → Etxean ____ zaude?", "opciones": ["ere", "bai", "al", "baina"], "correcta": 2, "explicacion": "Etxean al zaude?"}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "¿Te gusta el euskera? → Euskara gustatzen ____ zaizu?", "opciones": ["al", "ere", "bai", "edo"], "correcta": 0, "explicacion": "También aquí «al» va antes del auxiliar."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "¿Vienes mañana? → Bihar ____ zatoz?", "opciones": ["ere", "al", "bai", "edo"], "correcta": 1, "explicacion": "Bihar al zatoz?"}]}, {"id": "u12-g02", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "más grande → ____", "opciones": ["handia", "handiago", "handiena", "handirik"], "correcta": 1, "explicacion": "El comparativo se pega detrás: -ago."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "el más grande → ____", "opciones": ["handiago", "handiena", "handia", "handiz"], "correcta": 1, "explicacion": "El superlativo es -ena."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Bilbao es más grande que Gernika. → Bilbo Gernika ____ handiagoa da.", "opciones": ["eta", "baino", "bezain", "ere"], "correcta": 1, "explicacion": "«baino» es el «que» de la comparación."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "tan rápido como tú → zu ____ azkar", "opciones": ["baino", "bezain", "eta", "ere"], "correcta": 1, "explicacion": "«bezain» es «tan… como»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "mejor (adjetivo) → ____", "opciones": ["onago", "hobea", "onena", "hobeto"], "correcta": 1, "explicacion": "«ona» hace «hobea», irregular."}]}, {"id": "u12-g03", "variantes": [{"tipo": "pares", "instruccion": "Empareja las comparaciones", "pares": [{"eu": "baino", "es": "que (comparando)"}, {"eu": "bezain", "es": "tan… como"}, {"eu": "gehiago", "es": "más"}, {"eu": "gutxiago", "es": "menos"}]}, {"tipo": "pares", "instruccion": "Empareja los conectores", "pares": [{"eu": "beraz", "es": "así que"}, {"eu": "gainera", "es": "además"}, {"eu": "hala ere", "es": "aun así"}, {"eu": "adibidez", "es": "por ejemplo"}]}, {"tipo": "pares", "instruccion": "Empareja los adverbios", "pares": [{"eu": "noski", "es": "claro"}, {"eu": "benetan", "es": "de verdad"}, {"eu": "bakarrik", "es": "solo"}, {"eu": "berdin", "es": "igual"}]}, {"tipo": "pares", "instruccion": "Empareja los adjetivos y adverbios", "pares": [{"eu": "zaila", "es": "difícil"}, {"eu": "erraza", "es": "fácil"}, {"eu": "azkar", "es": "rápido"}, {"eu": "poliki", "es": "despacio"}]}, {"tipo": "pares", "instruccion": "Empareja los indefinidos", "pares": [{"eu": "norbait", "es": "alguien"}, {"eu": "zerbait", "es": "algo"}, {"eu": "nonbait", "es": "en algún sitio"}, {"eu": "denak", "es": "todos"}]}]}, {"id": "u12-g04", "variantes": [{"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Yo también hablo euskera. → Ni ____ euskalduna naiz.", "opciones": ["ere", "bai", "al", "baina"], "correcta": 0, "explicacion": "«ere» va detrás de lo que acompaña: «ni ere»."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Estoy cansado, así que me quedo. → Nekatuta nago, ____ etxean geratzen naiz.", "opciones": ["baina", "beraz", "edo", "ere"], "correcta": 1, "explicacion": "«beraz» introduce la consecuencia."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Además, es difícil. → ____, zaila da.", "opciones": ["Baina", "Gainera", "Edo", "Beraz"], "correcta": 1, "explicacion": "«gainera» añade: además."}, {"tipo": "opcion", "instruccion": "Completa la frase", "pregunta": "Aun así, me gusta. → ____, gustatzen zait.", "opciones": ["Beraz", "Hala ere", "Gainera", "Adibidez"], "correcta": 1, "explicacion": "«hala ere» es «aun así»."}, {"tipo": "opcion", "instruccion <script>
/* ═══════════════════════════════════════════════════════════
   Euskaraz — lógica de la aplicación
