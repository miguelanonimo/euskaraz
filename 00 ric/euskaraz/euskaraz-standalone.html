<title>Euskaraz · Aprende euskera desde cero</title>

<style>
/* ═══════════════════════════════════════════════════════════
   Euskaraz — hoja de estilos
   Estilo tipográfico internacional: retícula, jerarquía por
   tamaño y peso, filetes finos, un único acento cromático.
   Mobile-first. Cuerpo base 20px.
   ═══════════════════════════════════════════════════════════ */

:root{
  /* ── Color ──────────────────────────────────────────────
     Papel, tinta, un rojo y un verde. Los grises son la
     misma tinta rebajada, para que todo case.               */
  --papel:      #f2f0ec;
  --papel-alto: #ffffff;
  --tinta:      #161513;
  --tinta-70:   #5a5852;
  --tinta-45:   #8e8b84;
  --tinta-20:   #c9c6bf;
  --filete:     #d6d3cc;
  --filete-alto:#161513;

  --acento:     #d8321b;
  --acento-10:  #fbeae7;

  /* El verde del acierto. `--bien` es el color elegido; `--bien-txt`
     es el mismo tono bajado hasta donde contrasta como el rojo (4.2
     sobre el papel), para el texto pequeño. El claro sirve para tipo
     grande, filetes y fondos, donde el tamaño ya hace de contraste. */
  --bien:       #0caa39;
  --bien-txt:   #09852d;
  --bien-10:    #e7f6ec;

  --ok:         #161513;
  --ok-fondo:   #e8e6e0;
  --mal:        #d8321b;
  --mal-fondo:  #fbeae7;

  /* ── Tipografía ─────────────────────────────────────────
     Inter para todo. Los términos en euskera se distinguen
     por peso y color, no por otra familia.                  */
  --f: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;

  /* Escala tipográfica, base 20px */
  --t-xs:  13px;
  --t-s:   15px;
  --t-m:   17px;
  --t-b:   20px;   /* cuerpo */
  --t-l:   23px;
  --t-xl:  30px;
  --t-2xl: 40px;
  --t-3xl: 54px;

  /* ── Retícula ───────────────────────────────────────────
     Un módulo de 8px. Todo espaciado es múltiplo.           */
  --u: 8px;
  --margen: 20px;

  --h-top: 60px;
  --h-act: calc(84px + env(safe-area-inset-bottom, 0px));
}

*, *::before, *::after{ box-sizing: border-box; }

html{ -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body{
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--f);
  font-size: var(--t-b);
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: -0.011em;
  font-feature-settings: "kern" 1, "liga" 1, "cv05" 1;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: contain;
}

button{ font: inherit; color: inherit; letter-spacing: inherit; }

svg{
  width: 100%; height: 100%;
  fill: none; stroke: currentColor;
  stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: miter;
}

/* Números tabulares en todo lo que cuenta */
.stat__num, .scorebox__num, .hearts, .progresslabel{ font-variant-numeric: tabular-nums; }

/* ═══════════ CABECERA ═══════════ */

.topbar{
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center;
  gap: calc(var(--u) * 1.5);
  height: var(--h-top);
  padding: 0 var(--margen);
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--papel);
  border-bottom: 1px solid var(--filete-alto);
}

.topbar__back{
  flex: 0 0 auto;
  width: 32px; height: 32px;
  margin-left: -6px;
  padding: 6px;
  border: 0; background: transparent;
  color: var(--tinta);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.topbar__back:active{ color: var(--acento); }
.topbar__back[hidden]{ display: none; }

.topbar__mid{ flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 7px; }

.topbar__title{
  font-size: var(--t-s);
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.topbar__right{ flex: 0 0 auto; display: flex; align-items: center; }

.hearts{
  font-size: var(--t-s);
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--tinta-45);
}
.hearts b{ color: var(--tinta); font-weight: 600; }

.progressbar{
  height: 3px;
  background: var(--tinta-20);
}
.progressbar[hidden]{ display: none; }
.progressbar__fill{
  height: 100%; width: 0%;
  background: var(--acento);
  transition: width .3s cubic-bezier(.2,.7,.3,1);
}

/* ═══════════ PANTALLAS ═══════════ */

.screen{
  padding: calc(var(--u) * 5) var(--margen) calc(var(--u) * 8 + env(safe-area-inset-bottom, 0px));
  max-width: 680px;
  margin: 0 auto;
}
.screen[hidden]{ display: none; }

/* ═══════════ INICIO ═══════════ */

.hero{
  padding-bottom: calc(var(--u) * 4);
  border-bottom: 1px solid var(--filete-alto);
  margin-bottom: calc(var(--u) * 3);
}

.hero__mark{
  width: 44px; height: 44px;
  margin-bottom: calc(var(--u) * 3);
  display: grid; place-items: center;
  background: var(--acento);
  color: #fff;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1;
}

.hero__title{
  margin: 0;
  font-size: var(--t-3xl);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.95;
}

.hero__sub{
  margin: calc(var(--u) * 1.5) 0 0;
  max-width: 22em;
  font-size: var(--t-s);
  line-height: 1.45;
  color: var(--tinta-70);
}

/* Estadísticas: tres columnas de retícula con filetes verticales */
.stats{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin-bottom: calc(var(--u) * 6);
  border-bottom: 1px solid var(--filete);
}
.stat{
  padding: 0 0 calc(var(--u) * 2.5);
  border-left: 1px solid var(--filete);
  padding-left: calc(var(--u) * 1.5);
  min-width: 0;
}
.stat:first-child{ border-left: 0; padding-left: 0; }
.stat__num{
  display: block;
  font-size: var(--t-xl);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1;
}
.stat__num small{ font-size: 0.55em; font-weight: 500; letter-spacing: -0.01em; }
.stat__lbl{
  display: block;
  margin-top: var(--u);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--tinta-45);
}

/* El aire de arriba separa una sección de la anterior. En la primera
   («Unidades») no sobra: colapsa con el margen inferior de las cifras,
   que ya vale lo mismo, así que las dos quedan a la misma distancia de
   lo que tienen encima. */
.section-head{
  margin: calc(var(--u) * 6) 0 calc(var(--u) * 2);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--tinta-45);
}

/* Lista de unidades: filas separadas por filete, sin cajas */
.unitlist{ list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--filete-alto); }
.unitlist li{ border-bottom: 1px solid var(--filete); }

.unitcard{
  display: grid;
  grid-template-columns: 34px 1fr 16px;
  align-items: start;
  gap: calc(var(--u) * 2);
  width: 100%;
  padding: calc(var(--u) * 3) 0;
  text-align: left;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .12s ease;
}
.unitcard:active{ opacity: .5; }

.unitcard__badge{
  font-size: var(--t-s);
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1.55;
  color: var(--tinta-45);
  font-variant-numeric: tabular-nums;
}
.unitcard__badge svg{ width: 15px; height: 15px; stroke-width: 2.4; color: var(--acento); }
.c-rojo  .unitcard__badge{ color: var(--acento); }

.unitcard__body{ min-width: 0; }
.unitcard__title{
  display: block;
  font-size: var(--t-l);
  font-weight: 600;
  letter-spacing: -0.028em;
  line-height: 1.2;
}
.unitcard__sub{
  display: block;
  margin-top: 3px;
  font-size: var(--t-m);
  line-height: 1.35;
  color: var(--tinta-70);
}
.unitcard__meta{
  display: block;
  margin-top: calc(var(--u) * 1.5);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--acento);
}
.unitcard__meta--pend{ color: var(--tinta-45); }
.unitcard__meta svg{ display: none; }

.unitcard__chev{ width: 16px; height: 16px; margin-top: 7px; color: var(--tinta-20); }

.home-foot{
  margin-top: calc(var(--u) * 5);
}
.home-foot__note{
  margin: calc(var(--u) * 1.5) 0 0;
  font-size: var(--t-xs);
  line-height: 1.45;
  color: var(--tinta-45);
  max-width: 24em;
}

/* ═══════════ PORTADA DE UNIDAD ═══════════ */

.unithero{
  padding-bottom: calc(var(--u) * 4);
  border-bottom: 1px solid var(--filete-alto);
  margin-bottom: calc(var(--u) * 4);
}
.unithero__num{
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--acento);
}
.unithero__title{
  margin: calc(var(--u) * 2) 0 0;
  font-size: var(--t-2xl);
  font-weight: 700;
  letter-spacing: -0.04em;
  line-height: 1.02;
}
.unithero__sub{
  margin: var(--u) 0 0;
  font-size: var(--t-l);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 1.25;
  color: var(--tinta-70);
}
.unithero__goal{
  margin: calc(var(--u) * 3) 0 0;
  max-width: 30em;
  font-size: var(--t-m);
  line-height: 1.5;
  color: var(--tinta-70);
}

.cardstack{ border-top: 1px solid var(--filete); }
/* El filete que abre una sección va en negro, como el de la lista de
   unidades: es lo que hace que se lea el cambio de sección. Solo en la
   home; la portada de unidad no lleva encabezados y se queda como
   estaba. */
.section-head + .cardstack{ border-top-color: var(--filete-alto); }

/* Tres columnas: cuerpo, cifra de pendientes y flecha. La cifra falta en
   la mayoría de tarjetas, así que la separación va en márgenes y no en
   `gap`: una columna vacía no debe dejar hueco. */
.navcard{
  display: grid;
  grid-template-columns: 1fr auto 16px;
  align-items: center;
  gap: 0;
  width: 100%;
  padding: calc(var(--u) * 2.5) 0;
  text-align: left;
  border: 0;
  border-bottom: 1px solid var(--filete);
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .12s ease;
}
.navcard:active{ opacity: .5; }

.navcard__icon{ display: none; }

.navcard__body{ min-width: 0; }
.navcard__title{
  display: block;
  font-size: var(--t-l);
  font-weight: 500;
  letter-spacing: -0.026em;
}
.navcard__sub{
  display: block;
  margin-top: 2px;
  font-size: var(--t-s);
  color: var(--tinta-45);
}
/* Siempre en la última columna, lleve o no la tarjeta cifra de pendientes. */
.navcard__chev{
  grid-column: -1;
  margin-left: calc(var(--u) * 2);
  width: 16px; height: 16px;
  color: var(--tinta-20);
}

/* Cuántos ítems vencen hoy. Solo aparece si hay alguno. */
.navcard__due{
  align-self: center;
  margin-left: calc(var(--u) * 2);
  min-width: 30px;
  padding: 3px var(--u);
  background: var(--acento);
  color: var(--papel);
  font-size: var(--t-xs);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
  text-align: center;
}
.navcard__due[hidden]{ display: none; }

.navcard--accent{
  margin-top: calc(var(--u) * 3);
  padding: calc(var(--u) * 3);
  border: 0;
  background: var(--tinta);
  color: var(--papel);
  grid-template-columns: 1fr 16px;
}
.navcard--accent .navcard__title{ font-weight: 600; }
.navcard--accent .navcard__sub{ color: rgba(242,240,236,.6); }
.navcard--accent .navcard__chev{ color: var(--papel); }

/* ═══════════ LECTURA ═══════════ */

.reader{ max-width: 33em; margin: 0 auto; }

.gcard{
  padding-bottom: calc(var(--u) * 5);
  margin-bottom: calc(var(--u) * 5);
  border-bottom: 1px solid var(--filete);
}
.gcard:last-child{ border-bottom: 0; margin-bottom: 0; }

.gcard__title{
  margin: 0 0 calc(var(--u) * 2.5);
  font-size: var(--t-xl);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.12;
  text-wrap: balance;
}

.gcard__body{
  margin: 0;
  font-size: var(--t-b);
  line-height: 1.6;
  color: var(--tinta-70);
}
.gcard__body p{ margin: 0 0 1em; }
.gcard__body p:last-child{ margin-bottom: 0; }
.gcard__body b{ font-weight: 600; color: var(--tinta); }
.gcard__body i{ font-style: normal; color: var(--acento); }

/* Ejemplos: retícula de dos columnas con filete separador */
.exlist{
  margin: calc(var(--u) * 3) 0 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--filete-alto);
}
.exlist li{
  display: grid;
  grid-template-columns: 1fr;
  gap: 2px;
  padding: calc(var(--u) * 1.5) 0;
  border-bottom: 1px solid var(--filete);
}
.exlist .eu{
  font-size: var(--t-m);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.35;
}
.exlist .es{
  font-size: var(--t-s);
  line-height: 1.35;
  color: var(--tinta-45);
}

/* Vocabulario */
.vocabgroup{ border-top: 1px solid var(--filete-alto); }
.vitem{
  display: block;
  padding: calc(var(--u) * 2) 0;
  border-bottom: 1px solid var(--filete);
}
.vitem__row{
  display: grid;
  grid-template-columns: minmax(0, 11em) 1fr;
  gap: calc(var(--u) * 2);
  align-items: baseline;
}
.vitem__eu{
  font-size: var(--t-m);
  font-weight: 600;
  letter-spacing: -0.02em;
}
.vitem__es{ font-size: var(--t-m); color: var(--tinta-70); }
.vitem__nota{
  display: block;
  margin-top: var(--u);
  font-size: var(--t-s);
  line-height: 1.45;
  color: var(--tinta-45);
}

.reader-foot{
  max-width: 33em;
  margin: calc(var(--u) * 6) auto 0;
  padding-top: calc(var(--u) * 3);
  border-top: 2px solid var(--filete-alto);
}
.footnav__head{
  margin: 0 0 calc(var(--u) * 2);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--tinta-45);
}
.footnav{ display: grid; gap: var(--u); }
@media (min-width: 560px){
  .footnav{ grid-template-columns: 1fr 1fr; }
}

/* ═══════════ EJERCICIOS ═══════════ */

.screen--quiz{ padding-bottom: calc(var(--h-act) + var(--u) * 5); }
.quiz{ max-width: 33em; margin: 0 auto; }

.q__inst{
  margin: 0 0 calc(var(--u) * 2);
  padding-bottom: var(--u);
  border-bottom: 1px solid var(--filete);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--tinta-45);
}

.q__prompt{
  margin: 0 0 calc(var(--u) * 4);
  font-size: var(--t-xl);
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1.15;
  text-wrap: balance;
}
.q__prompt--es{ font-weight: 600; }

.q__hint{
  margin: calc(var(--u) * -2) 0 calc(var(--u) * 4);
  font-size: var(--t-s);
  line-height: 1.45;
  color: var(--tinta-45);
}

/* — Opción múltiple — */
.opts{ border-top: 1px solid var(--filete-alto); }
.opt{
  display: grid;
  grid-template-columns: 26px 1fr;
  align-items: baseline;
  gap: calc(var(--u) * 1.5);
  width: 100%;
  min-height: 62px;
  padding: calc(var(--u) * 2) var(--u) calc(var(--u) * 2) 0;
  text-align: left;
  font-size: var(--t-b);
  line-height: 1.35;
  border: 0;
  border-bottom: 1px solid var(--filete);
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .1s ease, padding .1s ease;
}
.opt__key{
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--tinta-45);
}
.opt[aria-pressed="true"]{ background: var(--tinta); color: var(--papel); padding-left: var(--u); }
.opt[aria-pressed="true"] .opt__key{ color: rgba(242,240,236,.55); }
.opt.is-ok{
  background: var(--tinta); color: var(--papel); padding-left: var(--u);
  box-shadow: inset 3px 0 0 var(--bien);
}
.opt.is-ok .opt__key{ color: var(--bien); }
.opt.is-mal{
  background: transparent; color: var(--tinta-45);
  text-decoration: line-through;
  text-decoration-color: var(--acento);
  text-decoration-thickness: 1px;
  padding-left: var(--u);
}
.opt.is-mal .opt__key{ color: var(--acento); text-decoration: none; }
.opt[disabled]{ cursor: default; }

/* — Emparejar — */
.pairs{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--filete);
  border: 1px solid var(--filete);
}
.paircol{ display: grid; gap: 1px; align-content: start; background: var(--filete); }
.pair{
  min-height: 62px;
  padding: calc(var(--u) * 1.5) var(--u);
  border: 0;
  background: var(--papel);
  font-size: var(--t-m);
  line-height: 1.3;
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .1s ease, color .1s ease, opacity .2s ease;
}
.pair--eu{ font-weight: 600; letter-spacing: -0.02em; }
.pair--es{ color: var(--tinta-70); }
.pair[aria-pressed="true"]{ background: var(--tinta); color: var(--papel); }
.pair.is-ok{
  background: var(--bien-10);
  color: var(--bien-txt);
  opacity: .6;
  pointer-events: none;
}
.pair.is-mal{ background: var(--acento); color: #fff; animation: nudge .28s; }
@keyframes nudge{
  0%,100%{ transform: translateX(0); }
  30%{ transform: translateX(-4px); }
  70%{ transform: translateX(4px); }
}

/* — Ordenar palabras — */
.build{
  min-height: 96px;
  margin-bottom: calc(var(--u) * 3);
  padding: calc(var(--u) * 1.5) 0;
  border-bottom: 2px solid var(--filete-alto);
  display: flex; flex-wrap: wrap;
  gap: var(--u);
  align-content: flex-start;
}
.build:empty{ align-items: center; }
.build:empty::after{
  content: "Toca las palabras de abajo";
  font-size: var(--t-s);
  color: var(--tinta-45);
}
.bank{ display: flex; flex-wrap: wrap; gap: var(--u); }
.chip{
  min-height: 46px;
  padding: 10px 14px;
  border: 1px solid var(--filete-alto);
  background: transparent;
  font-size: var(--t-m);
  font-weight: 500;
  letter-spacing: -0.018em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .12s ease, background .1s ease;
}
.chip:active{ background: var(--tinta); color: var(--papel); }
.chip.is-used{ opacity: 0; pointer-events: none; }
.chip--in{ background: var(--tinta); color: var(--papel); border-color: var(--tinta); }

/* — Escribir — */
.typebox{
  display: block;
  width: 100%;
  min-height: 104px;
  padding: calc(var(--u) * 1.5) 0;
  border: 0;
  border-bottom: 2px solid var(--filete-alto);
  border-radius: 0;
  background: transparent;
  font-family: var(--f);
  font-size: var(--t-l);
  font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1.4;
  color: var(--tinta);
  resize: none;
  -webkit-appearance: none; appearance: none;
}
.typebox:focus{ outline: none; border-bottom-color: var(--acento); }
.typebox::placeholder{ color: var(--tinta-20); font-weight: 400; letter-spacing: -0.01em; }

/* Una palabra suelta no necesita dos renglones ni la caja alta. */
.typebox--corta{
  min-height: 56px;
  font-size: var(--t-xl);
  letter-spacing: -0.035em;
}

/* — Enseñar el error — */
.dif__par{
  display: grid;
  grid-template-columns: 7em 1fr;
  align-items: baseline;
  gap: var(--u);
  margin-top: var(--u);
  padding-top: var(--u);
  border-top: 1px solid var(--filete);
}
.dif__lbl{
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--tinta-45);
}
.dif__mal, .dif__ok{
  font-size: var(--t-l);
  font-weight: 600;
  letter-spacing: -0.028em;
  overflow-wrap: anywhere;
}
.dif__mal{ color: var(--tinta-45); }
.dif__ok{ color: var(--tinta); }
.dif{
  text-decoration: none;
  background: var(--bien-txt);   /* texto pequeño: hace falta el tono fuerte */
  color: var(--papel);
  border-radius: 2px;
  padding: 0 1px;
}
.dif__ok{ color: var(--bien-txt); }
.dif__mal .dif{ background: transparent; color: var(--acento); text-decoration: line-through; }
.dif__nota{
  margin: calc(var(--u) * 2) 0 0;
  font-size: var(--t-s);
  line-height: 1.45;
  color: var(--tinta-45);
}


/* ═══════════ BARRA DE ACCIÓN ═══════════ */

.actionbar{
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  padding: calc(var(--u) * 2) var(--margen) calc(var(--u) * 2 + env(safe-area-inset-bottom, 0px));
  background: var(--papel);
  border-top: 1px solid var(--filete-alto);
}
.actionbar[hidden]{ display: none; }
.actionbar > .btn{ max-width: 640px; margin: 0 auto; }

/* ═══════════ BOTONES ═══════════ */

.btn{
  display: block;
  width: 100%;
  min-height: 56px;
  padding: 16px 20px;
  border: 1px solid var(--tinta);
  border-radius: 0;
  font-size: var(--t-m);
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s ease, color .12s ease, opacity .12s ease;
}

.btn--primary{ background: var(--tinta); color: var(--papel); }
.btn--primary:active{ background: var(--acento); border-color: var(--acento); }
.btn--primary:disabled{
  background: transparent;
  color: var(--tinta-20);
  border-color: var(--filete);
  cursor: default;
}

.btn--ghost{ background: transparent; color: var(--tinta); border-color: var(--filete-alto); }
.btn--ghost:active{ background: var(--tinta); color: var(--papel); }

.btn--sm{
  min-height: 44px;
  padding: 12px 18px;
  font-size: var(--t-xs);
  width: auto;
}

.btn--feedback{ background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.is-mal-fb .btn--feedback{ background: var(--acento); border-color: var(--acento); }
.is-ok-fb .btn--feedback{ background: var(--bien-txt); border-color: var(--bien-txt); }

/* ═══════════ FEEDBACK ═══════════ */

.feedback{
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  padding: calc(var(--u) * 3) var(--margen) calc(var(--u) * 2.5 + env(safe-area-inset-bottom, 0px));
  background: var(--papel);
  border-top: 2px solid var(--filete-alto);
  animation: sube .22s cubic-bezier(.2,.8,.3,1) both;
}
.feedback[hidden]{ display: none; }
.feedback.is-mal-fb{ border-top-color: var(--acento); }
.feedback.is-ok-fb{ border-top-color: var(--bien); }

@keyframes sube{ from{ transform: translateY(100%); } to{ transform: none; } }

.feedback__inner{ max-width: 640px; margin: 0 auto; }

.feedback__head{ display: flex; align-items: baseline; gap: calc(var(--u) * 1.5); }
.feedback__icon{
  flex: 0 0 auto;
  font-size: var(--t-m);
  font-weight: 600;
  line-height: 1;
  color: var(--tinta);
}
.is-mal-fb .feedback__icon{ color: var(--acento); }
.is-ok-fb .feedback__icon{ color: var(--bien-txt); }

.feedback__title{
  font-size: var(--t-l);
  font-weight: 600;
  letter-spacing: -0.028em;
}
.is-mal-fb .feedback__title{ color: var(--acento); }
.is-ok-fb .feedback__title{ color: var(--bien-txt); }

.feedback__body{
  margin: calc(var(--u) * 1.5) 0 calc(var(--u) * 3);
  font-size: var(--t-m);
  line-height: 1.5;
  color: var(--tinta-70);
}
.feedback__body:empty{ display: none; }
.feedback__body b{ color: var(--tinta); font-weight: 600; }
.feedback__body i{ font-style: normal; color: var(--acento); }
.feedback__body .sol{
  display: block;
  margin-top: var(--u);
  padding-top: var(--u);
  border-top: 1px solid var(--filete);
  font-size: var(--t-l);
  font-weight: 600;
  letter-spacing: -0.028em;
  color: var(--tinta);
}

/* ═══════════ RESULTADO ═══════════ */

.screen--result{ min-height: calc(100vh - var(--h-top)); display: flex; align-items: center; }
.result{ max-width: 33em; width: 100%; margin: 0 auto; }

.result__mark{ display: none; }

.result__title{
  margin: 0;
  font-size: var(--t-3xl);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 0.98;
  color: var(--acento);
}
.result__title--bien{ color: var(--bien); }
.result__sub{
  margin: calc(var(--u) * 2) 0 calc(var(--u) * 5);
  max-width: 22em;
  font-size: var(--t-m);
  line-height: 1.5;
  color: var(--tinta-70);
}

.result__score{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin-bottom: calc(var(--u) * 5);
  border-top: 1px solid var(--filete-alto);
  border-bottom: 1px solid var(--filete-alto);
}
.scorebox{
  padding: calc(var(--u) * 2.5) 0 calc(var(--u) * 2.5) calc(var(--u) * 1.5);
  border-left: 1px solid var(--filete);
}
.scorebox:first-child{ border-left: 0; padding-left: 0; }
.scorebox__num{
  display: block;
  font-size: var(--t-2xl);
  font-weight: 600;
  letter-spacing: -0.04em;
  line-height: 1;
}
.scorebox--ok  .scorebox__num{ color: var(--bien-txt); }
.scorebox--mal .scorebox__num{ color: var(--acento); }
.scorebox__lbl{
  display: block;
  margin-top: var(--u);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--tinta-45);
}

.result__actions{ display: grid; gap: var(--u); }

/* ═══════════ PANTALLAS MÁS ANCHAS ═══════════ */

@media (min-width: 640px){
  :root{
    --t-b: 21px; --t-l: 26px; --t-xl: 36px; --t-2xl: 52px; --t-3xl: 76px;
    --margen: 40px;
  }
  .screen{ padding-top: calc(var(--u) * 7); }
  .unitcard{ grid-template-columns: 48px 1fr 16px; }
  .vitem__row{ grid-template-columns: minmax(0, 13em) 1fr; }
}

@media (min-width: 1000px){
  .screen--home{ max-width: 900px; }
  .unitlist{ display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(var(--u) * 6); }
  .unitlist li:nth-child(2){ border-top: 0; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

:focus-visible{ outline: 2px solid var(--acento); outline-offset: 2px; }

/* ═══════════ DICCIONARIO ═══════════ */

.dictbar{
  position: sticky; top: var(--h-top); z-index: 5;
  background: var(--papel);
  padding: calc(var(--u) * 2) 0 var(--u);
  margin-bottom: calc(var(--u) * 2);
}

.dictinput{
  width: 100%;
  font: inherit;
  font-size: var(--t-m);
  color: var(--tinta);
  background: var(--papel-alto);
  border: 1px solid var(--filete);
  border-radius: 0;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 1.5);
  letter-spacing: inherit;
  -webkit-appearance: none;
  appearance: none;
}
.dictinput::placeholder{ color: var(--tinta-45); }
.dictinput:focus{ outline: none; border-color: var(--filete-alto); }
.dictinput::-webkit-search-cancel-button{ -webkit-appearance: none; }

.dictcount{
  margin: var(--u) 0 0;
  font-size: var(--t-xs);
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--tinta-45);
}

.vitem__unidad{
  display: block;
  margin-top: 3px;
  font-size: var(--t-xs);
  color: var(--tinta-45);
  letter-spacing: .04em;
}

/* ═══════════ RESULTADO: LO FALLADO ═══════════ */

/* Tras el repaso de vocabulario, las palabras que no han salido.
   Van dentro de la pantalla de resultado, alineadas a su izquierda. */
.result__miss{
  margin: calc(var(--u) * 5) 0 0;
  padding-top: calc(var(--u) * 3);
  border-top: 1px solid var(--filete);
  text-align: left;
}
.result__miss .footnav__head{ margin-top: 0; }

/* ═══════════ REPASO MEZCLADO ═══════════ */

.q__from{
  margin: 0 0 calc(var(--u) * 2);
  font-size: var(--t-xs);
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--acento);
}

</style>
</head>

"eta zu?", "es": "¿y tú?", "nota": "«eta» = y."}, {"eu": "oso", "es": "muy", "nota": null}], "gramatica": [{"titulo": "El euskera no se parece al castellano, y eso ayuda", "cuerpo": "El euskera es una lengua aislada: no tiene parientes conocidos. No viene del latín ni del indoeuropeo. Casi ningún truco del castellano, del francés o del inglés te va a servir aquí.\n\nLa contrapartida buena es que la pronunciación es muy regular. Se lee prácticamente como se escribe y, una vez aprendes las reglas, no hay excepciones caprichosas.\n\nEste primer módulo va despacio a propósito. En esta unidad solo saludos; en la siguiente, los pronombres; en la tercera, las preguntas. Los verbos no llegan hasta la cuarta. Merece la pena tener el suelo firme antes de construir encima.", "ejemplos": []}, {"titulo": "Pronunciación: lo que necesitas hoy", "cuerpo": "Las cinco vocales suenan como en castellano: <b>a, e, i, o, u<\/b>. Sin diptongos raros, sin vocales mudas.\n\nLas consonantes que cambian:\n\n<b>z<\/b> — s silbante, como la «s» del inglés <i>see<\/i>. Nunca como la «z» castellana.\n<b>s<\/b> — una s más apagada, con la punta de la lengua algo retraída. Al principio pronúnciala como una s normal.\n<b>x<\/b> — «sh», como en <i>show<\/i>.\n<b>tx<\/b> — «ch», como en <i>chico<\/i>.\n<b>ts<\/b> y <b>tz<\/b> — «ts», como en <i>pizza<\/i>.\n<b>j<\/b> — normalmente «y», como en <i>yo<\/i>. En Gipuzkoa suena como la jota castellana.\n<b>h<\/b> — muda en casi todo el País Vasco.\n<b>ñ<\/b> y <b>ll<\/b> — como en castellano.", "ejemplos": [{"eu": "zu", "es": "tú → suena «su»"}, {"eu": "etxe", "es": "casa → suena «eche»"}, {"eu": "kaixo", "es": "hola → suena «kaisho»"}, {"eu": "jaso", "es": "recoger → suena «yaso»"}]}, {"titulo": "«on» = bueno, y va detrás", "cuerpo": "Los tres saludos del día comparten la misma pieza:\n\n<b>egun<\/b> (día) + <b>on<\/b> → egun on\n<b>arratsalde<\/b> (tarde) + <b>on<\/b> → arratsalde on\n<b>gau<\/b> (noche) + <b>on<\/b> → gabon\n\nEl adjetivo va <b>detrás<\/b> del sustantivo, al revés que en «buenos días». No es una excepción de los saludos, es una regla general del idioma: <i>etxe handia<\/i> es «casa grande», nunca «grande casa».\n\nGuárdate esta regla, porque va a aparecer en todas las unidades.", "ejemplos": [{"eu": "egun on", "es": "buenos días (día bueno)"}, {"eu": "etxe polita", "es": "casa bonita"}, {"eu": "kale zaharra", "es": "calle vieja"}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "Gernika está en Busturialdea, dentro del <b>bizkaiera<\/b> (euskera occidental). Lo que aprendes aquí es batua, el estándar, y con eso te entiendes en todas partes. Pero si vas a estar por allí, estos rasgos te van a saltar a la oreja desde el primer día.\n\n<b>Zelan?<\/b> en vez de <b>nola?<\/b>\nEl «¿cómo?» del bizkaiera es <i>zelan<\/i>. Así que el «¿qué tal?» más habitual no es <i>zer moduz?<\/i> sino <b>Zelan zagoz?<\/b> Y verás <i>holan, halan, honan<\/i> donde el batua pone <i>horrela, hala, honela<\/i>.\n\n<b>La j suena «y»<\/b>\nEn Bizkaia <i>jan<\/i> (comer) suena «yan», no «jan» con jota castellana. La jota fuerte es cosa guipuzcoana. La <b>h<\/b> es muda en todo Bizkaia.\n\n<b>Aupa! Epa!<\/b>\nMuy usados como saludo informal, más que <i>kaixo<\/i> entre conocidos.\n\n<b>Gero arte<\/b>\nPara despedirse se oye más que <i>ikusi arte<\/i>.", "ejemplos": [{"eu": "Zelan zagoz?", "es": "¿Qué tal estás? (bizkaiera) — batua: Zer moduz zaude?"}, {"eu": "Aupa!", "es": "¡Hola! (informal, muy de Bizkaia)"}, {"eu": "Gero arte!", "es": "¡Hasta luego!"}]}, {"titulo": "Un aviso sobre los dialectos", "cuerpo": "El habla cambia de pueblo a pueblo, y a veces de barrio a barrio. Lo que te cuento como «de Gernika» es bizkaiera de Busturialdea en general, y no todo el mundo de allí lo dice igual: quien se ha escolarizado en batua mezcla las dos cosas constantemente.\n\nTómalo como oído entrenado, no como norma. Para escribir, para exámenes y para entenderte con cualquiera, usa batua. Para captar lo que oyes en una taberna de Gernika, ten estas notas a mano.\n\nY contrástalo con alguien de allí en cuanto puedas. Ninguna app sustituye eso.", "ejemplos": []}], "ejercicios": [{"id": "u1-g01", "variantes": [{"tipo": "pares", "instruccion": "Empareja cada saludo con su traducción", "pares": [{"eu": "kaixo", "es": "hola"}, {"eu": "egun on", "es": "buenos días"}, {"eu": "gabon", "es": "buenas noches"}, {"eu": "agur", "es": "adiós"}]}, {"tipo": "pares", "instruccion": "Empareja cada expresión con su traducción", "pares": [{"eu": "arratsalde on", "es": "buenas tardes"}, {"eu": "bihar arte", "es": "hasta mañana"}, {"eu": "ikusi arte", "es": "hasta luego"}, {"eu": "barkatu", "es": "perdón"}]}, {"tipo": "pares", "instruccion": "Empareja las fórmulas de cortesía", "pares": [{"eu": "eskerrik asko", "es": "muchas gracias"}, {"eu": "ez horregatik", "es": "de nada"}, {"eu": "mesedez", "es": "por favor"}, {"eu": "gero arte", "es": "hasta luego"}]}, {"tipo": "pares", "instruccion": "Empareja los saludos según la hora", "pares": [{"eu": "egun on", "es": "por la mañana"}, {"eu": "arratsalde on", "es": "por la tarde"}, {"eu": "gabon", "es": "por la noche"}, {"eu": "kaixo", "es": "a cualquier hora"}]}, {"tipo": "pares", "instruccion": "Empareja las despedidas", "pares": [{"eu": "agur", "es": "adiós"}, {"eu": "gero arte", "es": "hasta luego"}, {"eu": "bihar arte", "es": "hasta mañana"}, {"eu": "aupa", "es": "hola (informal)"}]}]}, {"id": "u1-g02", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Son las 6 de la tarde y entras en una tienda. ¿Qué dices?", "opciones": ["Egun on", "Arratsalde on", "Gabon", "Bihar arte"], "correcta": 1, "explicacion": "«Arratsalde on» cubre desde el mediodía hasta el anochecer."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Son las 9 de la mañana y saludas a un vecino. ¿Qué dices?", "opciones": ["Gabon", "Arratsalde on", "Egun on", "Agur"], "correcta": 2, "explicacion": "«Egun on» va desde que amanece hasta el mediodía."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Son las 11 de la noche y te cruzas con alguien. ¿Qué dices?", "opciones": ["Gabon", "Egun on", "Arratsalde on", "Eskerrik asko"], "correcta": 0, "explicacion": "«Gabon» viene de «gau» (noche) + «on» (bueno)."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "No sabes qué hora es y quieres saludar sin equivocarte. ¿Qué dices?", "opciones": ["Egun on", "Kaixo", "Gabon", "Agur"], "correcta": 1, "explicacion": "«Kaixo» sirve a cualquier hora del día."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Son las 2 del mediodía. ¿Qué saludo es el más apropiado?", "opciones": ["Egun on", "Arratsalde on", "Gabon", "Gero arte"], "correcta": 1, "explicacion": "A partir del mediodía ya se entra en «arratsalde»."}]}, {"id": "u1-g03", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa «Zer moduz?»", "opciones": ["¿Cómo te llamas?", "¿Qué tal?", "¿De dónde eres?", "¿Cuántos años tienes?"], "correcta": 1, "explicacion": "Es el «¿qué tal?» de cada día. Puedes responder «Ondo, eskerrik asko»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Alguien te dice «Zer moduz?». ¿Qué respondes?", "opciones": ["Kaixo", "Ondo, eskerrik asko", "Bihar arte", "Mesedez"], "correcta": 1, "explicacion": "«Ondo, eskerrik asko» = «bien, gracias». Y puedes devolver la pregunta con «Eta zu?»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En Bizkaia oyes «Zelan zagoz?». ¿Qué te preguntan?", "opciones": ["De dónde eres", "Qué tal estás", "Cómo te llamas", "Adónde vas"], "correcta": 1, "explicacion": "«Zelan» es el «nola» (cómo) del bizkaiera, y «zagoz» es «zaude»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo devuelves la pregunta después de contestar?", "opciones": ["Eta zu?", "Zer moduz", "Bai", "Oso"], "correcta": 0, "explicacion": "«Eta» es «y». Literalmente: «¿y tú?»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa «oso» en «oso ondo»?", "opciones": ["Bastante", "Muy", "Poco", "Todo"], "correcta": 1, "explicacion": "«Oso» es «muy», y va delante del adjetivo o adverbio."}]}, {"id": "u1-g04", "variantes": [{"tipo": "pares", "instruccion": "Empareja las respuestas", "pares": [{"eu": "ondo", "es": "bien"}, {"eu": "oso ondo", "es": "muy bien"}, {"eu": "hala-hola", "es": "regular"}, {"eu": "gaizki", "es": "mal"}]}, {"tipo": "pares", "instruccion": "Empareja estas palabras", "pares": [{"eu": "bai", "es": "sí"}, {"eu": "ez", "es": "no"}, {"eu": "eta", "es": "y"}, {"eu": "oso", "es": "muy"}]}, {"tipo": "pares", "instruccion": "Empareja las preguntas y respuestas", "pares": [{"eu": "eta zu?", "es": "¿y tú?"}, {"eu": "gaizki", "es": "mal"}, {"eu": "oso ondo", "es": "muy bien"}, {"eu": "zer moduz?", "es": "¿qué tal?"}]}, {"tipo": "pares", "instruccion": "Empareja cada saludo con su momento", "pares": [{"eu": "aupa", "es": "informal, a un conocido"}, {"eu": "egun on", "es": "al llegar por la mañana"}, {"eu": "gero arte", "es": "al irte"}, {"eu": "barkatu", "es": "al pedir paso"}]}, {"tipo": "pares", "instruccion": "Empareja las expresiones", "pares": [{"eu": "mesedez", "es": "por favor"}, {"eu": "barkatu", "es": "perdón"}, {"eu": "eskerrik asko", "es": "gracias"}, {"eu": "ez horregatik", "es": "de nada"}]}]}, {"id": "u1-g05", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Muy bien, muchas gracias.", "eu": "Oso ondo, eskerrik asko.", "palabras": ["Oso", "ondo,", "eskerrik", "asko."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Buenos días. ¿Qué tal?", "eu": "Egun on. Zer moduz?", "palabras": ["Egun", "on.", "Zer", "moduz?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Perdón, muchas gracias.", "eu": "Barkatu, eskerrik asko.", "palabras": ["Barkatu,", "eskerrik", "asko."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Bien, gracias. ¿Y tú?", "eu": "Ondo, eskerrik asko. Eta zu?", "palabras": ["Ondo,", "eskerrik", "asko.", "Eta", "zu?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Buenas tardes. ¿Qué tal?", "eu": "Arratsalde on. Zer moduz?", "palabras": ["Arratsalde", "on.", "Zer", "moduz?"]}]}, {"id": "u1-g06", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo se pronuncia «kaixo»?", "opciones": ["ka-i-ko", "kai-sho", "kai-cho", "kai-jo"], "correcta": 1, "explicacion": "La «x» en euskera suena «sh», como en el inglés show."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo se pronuncia «etxe» (casa)?", "opciones": ["et-she", "e-che", "et-ke", "e-tse"], "correcta": 1, "explicacion": "«tx» suena «ch», como en chico. La «x» sola sería «sh»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "La palabra «zu» (tú) se pronuncia…", "opciones": ["«zu» con z castellana", "«su» con s silbante", "«chu»", "«yu»"], "correcta": 1, "explicacion": "La «z» del euskera nunca es la z castellana: es una s silbante."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo suena la «h» en casi todo el País Vasco?", "opciones": ["Como una jota", "Como una g suave", "Es muda", "Como una s"], "correcta": 2, "explicacion": "Se escribe pero no se pronuncia, igual que en castellano."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo suena «tz», por ejemplo en «zortzi» (ocho)?", "opciones": ["Como «ch»", "Como «ts» de pizza", "Como «z» castellana", "Como «sh»"], "correcta": 1, "explicacion": "«ts» y «tz» suenan las dos como la doble z de pizza."}]}, {"id": "u1-g07", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "muchas gracias", "respuestas": ["eskerrik asko", "mila esker"], "pista": "Literalmente: «gracias muchas»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "buenas tardes", "respuestas": ["arratsalde on"], "pista": "«tarde» + «bueno», en ese orden."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "hasta mañana", "respuestas": ["bihar arte"], "pista": "«arte» significa «hasta» y va al final."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "buenos días", "respuestas": ["egun on"], "pista": "«día» + «bueno»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "hasta luego", "respuestas": ["ikusi arte", "gero arte"], "pista": "Dos formas válidas: «hasta ver» o «hasta después»."}]}, {"id": "u1-g08", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "por favor", "respuestas": ["mesedez"], "pista": "Una sola palabra, empieza por m-."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "perdón", "respuestas": ["barkatu"], "pista": "Una sola palabra, empieza por b-."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "adiós", "respuestas": ["agur"], "pista": "Cuatro letras. Se usa también en el castellano del norte."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "mal", "respuestas": ["gaizki"], "pista": "Seis letras, empieza por g-."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "regular, así así", "respuestas": ["hala-hola", "hala hola"], "pista": "Dos palabras casi iguales, unidas por un guion."}]}, {"id": "u1-g09", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Te despides de un amigo al que verás mañana. ¿Qué dices?", "opciones": ["Ikusi arte", "Bihar arte", "Egun on", "Ez horregatik"], "correcta": 1, "explicacion": "«Bihar» es mañana y «arte» es hasta."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa literalmente «ikusi arte»?", "opciones": ["Hasta pronto", "Hasta ver", "Hasta mañana", "Buen viaje"], "correcta": 1, "explicacion": "«ikusi» es ver y «arte» es hasta. El equivalente al «hasta luego»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En Gernika, ¿qué despedida oirás con más frecuencia?", "opciones": ["Gero arte", "Bihar arte", "Egun on", "Barkatu"], "correcta": 0, "explicacion": "«Gero arte» («hasta después») es la despedida más habitual en Bizkaia."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa la palabra «arte» en estas despedidas?", "opciones": ["Adiós", "Hasta", "Luego", "Pronto"], "correcta": 1, "explicacion": "Va detrás: «bihar arte», «ikusi arte», «gero arte»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Alguien te da las gracias. ¿Qué respondes?", "opciones": ["Eskerrik asko", "Ez horregatik", "Mesedez", "Barkatu"], "correcta": 1, "explicacion": "«Ez horregatik» es el «de nada»."}]}, {"id": "u1-g10", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "¿Qué tal? ¿Y tú?", "eu": "Zer moduz? Eta zu?", "palabras": ["Zer", "moduz?", "Eta", "zu?"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Regular, gracias.", "eu": "Hala-hola, eskerrik asko.", "palabras": ["Hala-hola,", "eskerrik", "asko."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Adiós, hasta luego.", "eu": "Agur, gero arte.", "palabras": ["Agur,", "gero", "arte."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Buenas noches, hasta mañana.", "eu": "Gabon, bihar arte.", "palabras": ["Gabon,", "bihar", "arte."]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "Perdón, ¿qué tal?", "eu": "Barkatu, zer moduz?", "palabras": ["Barkatu,", "zer", "moduz?"]}]}, {"id": "u1-g11", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "de nada", "respuestas": ["ez horregatik"], "pista": "Dos palabras. Empieza con «ez»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "muy bien", "respuestas": ["oso ondo"], "pista": "«muy» va delante de «bien»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "buenas noches", "respuestas": ["gabon"], "pista": "Una sola palabra: «gau» + «on», contraído."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "bien", "respuestas": ["ondo"], "pista": "Cuatro letras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "¿y tú?", "respuestas": ["eta zu", "eta zu?"], "pista": "Dos palabras. «eta» es «y»."}]}, {"id": "u1-g12", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En euskera, «casa bonita» se dice…", "opciones": ["polita etxe", "etxe polita", "polit etxea", "etxea polit"], "correcta": 1, "explicacion": "El adjetivo va siempre detrás del sustantivo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Egun on» significa literalmente…", "opciones": ["Buen día", "Día bueno", "Buenos días a ti", "El día es bueno"], "correcta": 1, "explicacion": "«egun» (día) + «on» (bueno). El adjetivo detrás, como siempre."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Si «gau» es noche y «on» es bueno, ¿qué esperarías que significase «gabon»?", "opciones": ["Buena noche", "Media noche", "Toda la noche", "Esta noche"], "correcta": 0, "explicacion": "«gau» + «on» → «gabon». La -u se convierte en -b- al juntarse."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Dónde coloca el euskera el adjetivo?", "opciones": ["Delante del sustantivo", "Detrás del sustantivo", "Al final de la frase", "Depende del adjetivo"], "correcta": 1, "explicacion": "Siempre detrás. Es una regla sin excepciones prácticas."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Kale zaharra» significa…", "opciones": ["Vieja calle", "Calle vieja", "La calle es vieja", "Calle nueva"], "correcta": 1, "explicacion": "Sustantivo primero, adjetivo después. Como en «Parte Zaharra»."}]}]}, {"id": "u2", "numero": 2, "titulo": "Ni eta zu", "subtitulo": "Los pronombres, sin prisa", "objetivo": "Aprenderte las seis personas y los posesivos antes de tocar ningún verbo. Sin esto, todo lo demás cuesta el doble.", "color": "negro", "vocabulario": [{"eu": "ni", "es": "yo", "nota": null}, {"eu": "zu", "es": "tú / usted", "nota": "Una sola palabra para las dos cosas."}, {"eu": "hura", "es": "él / ella", "nota": "Sin género. Vale para los dos."}, {"eu": "gu", "es": "nosotros / nosotras", "nota": null}, {"eu": "zuek", "es": "vosotros / vosotras", "nota": "«zu» + la marca de plural."}, {"eu": "haiek", "es": "ellos / ellas", "nota": null}, {"eu": "bera", "es": "él / ella", "nota": "Alternativa a «hura», muy usada al hablar."}, {"eu": "hi", "es": "tú (muy familiar)", "nota": "Trato de confianza. Solo para reconocerlo, de momento."}, {"eu": "nire", "es": "mi", "nota": null}, {"eu": "zure", "es": "tu / su (de usted)", "nota": null}, {"eu": "haren", "es": "su (de él / de ella)", "nota": null}, {"eu": "gure", "es": "nuestro/a", "nota": null}, {"eu": "zuen", "es": "vuestro/a", "nota": null}, {"eu": "haien", "es": "su (de ellos / de ellas)", "nota": null}, {"eu": "neu", "es": "yo mismo/a", "nota": "Forma reforzada, para enfatizar."}, {"eu": "zeu", "es": "tú mismo/a", "nota": null}, {"eu": "geu", "es": "nosotros mismos", "nota": null}, {"eu": "laguna", "es": "el/la amigo/a", "nota": null}, {"eu": "etxea", "es": "la casa", "nota": null}, {"eu": "herria", "es": "el pueblo", "nota": null}, {"eu": "izena", "es": "el nombre", "nota": null}, {"eu": "handia", "es": "grande", "nota": null}, {"eu": "txikia", "es": "pequeño/a", "nota": null}, {"eu": "polita", "es": "bonito/a", "nota": null}], "gramatica": [{"titulo": "Seis personas, y ni una sola con género", "cuerpo": "Empecemos por lo básico. Estos son los seis pronombres del euskera:\n\n<b>ni<\/b> — yo\n<b>zu<\/b> — tú\n<b>hura<\/b> — él, ella\n<b>gu<\/b> — nosotros, nosotras\n<b>zuek<\/b> — vosotros, vosotras\n<b>haiek<\/b> — ellos, ellas\n\nLo primero que salta a la vista: <b>no hay género<\/b>. En euskera no existe «él» frente a «ella». <i>Hura<\/i> sirve para los dos, igual que <i>haiek<\/i> vale para ellos y para ellas.\n\nEsto no es una carencia, es cómo funciona la lengua. El género gramatical simplemente no forma parte del sistema. Ni en los pronombres, ni en los sustantivos, ni en los adjetivos.\n\nTómate esta unidad con calma. Son seis palabras cortas, pero van a aparecer en absolutamente todo lo que aprendas después.", "ejemplos": [{"eu": "ni", "es": "yo"}, {"eu": "hura", "es": "él o ella, indistintamente"}, {"eu": "haiek", "es": "ellos o ellas"}]}, {"titulo": "«zu» es tú y usted a la vez", "cuerpo": "En castellano tienes que decidir constantemente entre tutear o tratar de usted. En euskera batua, no: <b>zu<\/b> cubre las dos cosas.\n\nHablas con tu mejor amigo: <b>zu<\/b>.\nHablas con el médico al que ves por primera vez: <b>zu<\/b>.\n\nUna preocupación menos.\n\nHay una forma aún más familiar, <b>hi<\/b>, que se usa entre amigos muy cercanos, dentro de la familia o con niños. Tiene la particularidad de que <b>hace cambiar el verbo entero<\/b>, y por eso se aprende bastante más tarde. De momento reconócela si la oyes y sigue con <i>zu<\/i> para todo.", "ejemplos": [{"eu": "Zu ondo zaude?", "es": "¿Estás bien? — vale para cualquiera"}, {"eu": "hi", "es": "tú, muy familiar. Reconocer, no usar todavía."}]}, {"titulo": "«hura» o «bera»: las dos se oyen", "cuerpo": "Junto a <i>hura<\/i> vas a oír muchísimo <b>bera<\/b>, que significa lo mismo: él o ella.\n\n<i>Hura<\/i> es la forma que sale en las tablas y en los libros de texto. <b>Bera<\/b> es la que sale en la conversación real, y además tiene el matiz de «ese mismo, el que ya hemos mencionado».\n\nEn plural, la pareja es <i>haiek<\/i> y <b>beraiek<\/b>.\n\nNo te agobies con la diferencia ahora. Quédate con que si oyes <i>bera<\/i>, están diciendo «él» o «ella».", "ejemplos": [{"eu": "hura / bera", "es": "él, ella"}, {"eu": "haiek / beraiek", "es": "ellos, ellas"}]}, {"titulo": "Los posesivos: nire, zure, gure…", "cuerpo": "Los posesivos salen de los pronombres, y se parecen bastante. Van <b>delante<\/b> del sustantivo, como en castellano:\n\n<b>nire<\/b> — mi\n<b>zure<\/b> — tu, su (de usted)\n<b>haren<\/b> — su (de él, de ella)\n<b>gure<\/b> — nuestro\n<b>zuen<\/b> — vuestro\n<b>haien<\/b> — su (de ellos)\n\nY el sustantivo mantiene su artículo <b>-a<\/b>:\n\n<b>nire etxea<\/b> — mi casa\n<b>zure laguna<\/b> — tu amigo\n<b>gure herria<\/b> — nuestro pueblo\n\nSi además metes un adjetivo, va al final del grupo, con el artículo pegado a él:\n\n<b>nire etxe handia<\/b> — mi casa grande", "ejemplos": [{"eu": "nire izena", "es": "mi nombre"}, {"eu": "zure herria", "es": "tu pueblo"}, {"eu": "gure etxe txikia", "es": "nuestra casa pequeña"}]}, {"titulo": "Las formas reforzadas: neu, zeu, geu", "cuerpo": "El euskera tiene una segunda serie de pronombres para cuando quieres subrayar quién:\n\n<b>neu<\/b> — yo mismo\n<b>zeu<\/b> — tú mismo\n<b>geu<\/b> — nosotros mismos\n<b>zeuek<\/b> — vosotros mismos\n\nEs la diferencia entre «yo lo hice» y «lo hice <i>yo<\/i>». Los posesivos correspondientes son <b>neure, zeure, geure<\/b>.\n\nSon muy frecuentes en el habla, sobre todo en Bizkaia. No hace falta que los uses todavía, pero conviene que no te suenen a chino cuando aparezcan.", "ejemplos": [{"eu": "Neu naiz.", "es": "Soy yo. (con énfasis)"}, {"eu": "neure etxea", "es": "mi propia casa"}]}, {"titulo": "Aviso: estos pronombres van a cambiar de forma", "cuerpo": "Te lo digo ahora para que no te pille por sorpresa dentro de dos unidades.\n\nEn euskera los pronombres <b>se declinan<\/b>, igual que los sustantivos. Es decir, cambian de terminación según la función que cumplan en la frase. Vas a ver cosas como:\n\n<b>ni<\/b> → <b>nik<\/b> (cuando yo hago algo a algo)\n<b>ni<\/b> → <b>niri<\/b> (cuando algo me lo dan a mí)\n<b>ni<\/b> → <b>nirekin<\/b> (conmigo)\n\nNo son palabras nuevas. Es <i>ni<\/i> con distintos sufijos, igual que <i>etxe<\/i> se convierte en <i>etxean<\/i>, <i>etxera<\/i>, <i>etxetik<\/i>.\n\nNo intentes memorizarlas ahora. Solo quédate con la idea: <b>la raíz siempre está ahí, y lo que cambia es la cola<\/b>. Cuando lleguemos a ellas ya sabrás reconocer de dónde vienen.", "ejemplos": [{"eu": "ni · nik · niri · nirekin", "es": "yo · yo (que hago) · a mí · conmigo"}, {"eu": "zu · zuk · zuri · zurekin", "es": "tú · tú (que haces) · a ti · contigo"}]}, {"titulo": "Y muchas veces ni se dicen", "cuerpo": "Un consuelo. En euskera, igual que en castellano, el pronombre sujeto <b>se omite casi siempre<\/b>, porque el verbo ya dice quién es.\n\nEn castellano dices «vivo en Bilbao», no «yo vivo en Bilbao», salvo que quieras marcar el contraste.\n\nEn euskera pasa lo mismo. Verás muchísimas frases sin <i>ni<\/i>, sin <i>zu<\/i> y sin <i>hura<\/i>. Aparecen cuando hay algo que enfatizar o que aclarar.\n\nAsí que aprenderte estos seis pronombres no es para usarlos todo el rato. Es para <b>entender la lógica del verbo<\/b>, que es donde de verdad vive la información en euskera.", "ejemplos": []}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "Los pronombres son terreno muy dialectal, y en Bizkaia hay dos cosas que notarás enseguida.\n\n<b>Las formas reforzadas son las normales<\/b>\nDonde el batua dice <i>ni<\/i>, en Bizkaia se oye <b>neu<\/b> con muchísima frecuencia, sin necesidad de énfasis especial. Lo mismo con <b>zeu, geu, zeuek<\/b>. Y los posesivos <b>neure, zeure, geure<\/b> compiten de tú a tú con <i>nire, zure, gure<\/i>.\n\n<b>El «hika» está vivo<\/b>\nEse <i>hi<\/i> que en batua parece una curiosidad de manual, en muchos pueblos de Bizkaia se usa a diario entre amigos y en familia. Si oyes formas verbales que no reconoces de nada, con <i>-k<\/i> o <i>-n<\/i> al final, probablemente sea hika.\n\n<b>«-gaz» en lugar de «-rekin»<\/b>\nPara decir «conmigo, contigo», el batua usa <i>-rekin<\/i>: <i>nirekin, zurekin<\/i>. El bizkaiera usa <b>-gaz<\/b>: <b>nigaz, zugaz<\/b>. Y para «con quién», donde el batua pregunta <i>norekin?<\/i>, en Gernika se dice <b>nogaz?<\/b>", "ejemplos": [{"eu": "Neu naz.", "es": "Soy yo. (bizkaiera) — batua: Ni naiz."}, {"eu": "nigaz", "es": "conmigo — batua: nirekin"}, {"eu": "Nogaz zagoz?", "es": "¿Con quién estás? — batua: Norekin zaude?"}]}, {"titulo": "Un aviso sobre los dialectos", "cuerpo": "El habla cambia de pueblo a pueblo, y a veces de barrio a barrio. Lo que te cuento como «de Gernika» es bizkaiera de Busturialdea en general, y no todo el mundo de allí lo dice igual: quien se ha escolarizado en batua mezcla las dos cosas constantemente.\n\nTómalo como oído entrenado, no como norma. Para escribir, para exámenes y para entenderte con cualquiera, usa batua. Para captar lo que oyes en una taberna de Gernika, ten estas notas a mano.\n\nY contrástalo con alguien de allí en cuanto puedas. Ninguna app sustituye eso.", "ejemplos": []}], "ejercicios": [{"id": "u2-g01", "variantes": [{"tipo": "pares", "instruccion": "Empareja los pronombres", "pares": [{"eu": "ni", "es": "yo"}, {"eu": "zu", "es": "tú"}, {"eu": "hura", "es": "él / ella"}, {"eu": "gu", "es": "nosotros"}]}, {"tipo": "pares", "instruccion": "Empareja los pronombres", "pares": [{"eu": "zuek", "es": "vosotros"}, {"eu": "haiek", "es": "ellos"}, {"eu": "gu", "es": "nosotros"}, {"eu": "ni", "es": "yo"}]}, {"tipo": "pares", "instruccion": "Empareja los pronombres", "pares": [{"eu": "hura", "es": "él / ella"}, {"eu": "haiek", "es": "ellos / ellas"}, {"eu": "zu", "es": "tú"}, {"eu": "zuek", "es": "vosotros"}]}, {"tipo": "pares", "instruccion": "Empareja las formas reforzadas", "pares": [{"eu": "neu", "es": "yo mismo"}, {"eu": "zeu", "es": "tú mismo"}, {"eu": "geu", "es": "nosotros mismos"}, {"eu": "bera", "es": "él / ella"}]}, {"tipo": "pares", "instruccion": "Empareja cada singular con su plural", "pares": [{"eu": "ni", "es": "gu"}, {"eu": "zu", "es": "zuek"}, {"eu": "hura", "es": "haiek"}, {"eu": "bera", "es": "beraiek"}]}]}, {"id": "u2-g02", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa «hura»?", "opciones": ["Él", "Ella", "Él o ella, indistintamente", "Ellos"], "correcta": 2, "explicacion": "El euskera no tiene género gramatical. «Hura» sirve para los dos."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cómo se dice «ella» en euskera?", "opciones": ["hura", "haiek", "no existe una palabra distinta de «él»", "bera-a"], "correcta": 2, "explicacion": "Un poco trampa: «hura» es correcto, pero lo importante es que no hay forma femenina aparte."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Haiek» puede referirse a…", "opciones": ["Solo a hombres", "Solo a mujeres", "A un grupo mixto únicamente", "A cualquier grupo, del sexo que sea"], "correcta": 3, "explicacion": "Sin género: vale para ellos, para ellas y para cualquier mezcla."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué palabra oirás a menudo en lugar de «hura» al hablar?", "opciones": ["bera", "beraz", "berri", "batera"], "correcta": 0, "explicacion": "«Bera» significa lo mismo y es muchísimo más frecuente en conversación."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuántos pronombres personales tiene el euskera?", "opciones": ["Cuatro", "Seis", "Ocho", "Doce"], "correcta": 1, "explicacion": "Seis: ni, zu, hura, gu, zuek, haiek. Sin distinción de género."}]}, {"id": "u2-g03", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Hablas con alguien mayor a quien no conoces. ¿Qué pronombre usas?", "opciones": ["hi", "zu", "hura", "zuek"], "correcta": 1, "explicacion": "«Zu» cubre el tú y el usted. No hay que elegir."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Hablas con tu mejor amigo de toda la vida. ¿Qué pronombre es siempre seguro?", "opciones": ["zu", "hi", "hura", "gu"], "correcta": 0, "explicacion": "«Zu» vale para todo el mundo. «Hi» es más familiar, pero cambia el verbo entero."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué tiene de particular el pronombre «hi»?", "opciones": ["Es plural", "Hace cambiar la forma del verbo", "Solo se usa por escrito", "Es femenino"], "correcta": 1, "explicacion": "El trato «hika» conjuga los verbos de otra manera. Por eso se aprende más tarde."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿En qué se diferencian «zu» y «zuek»?", "opciones": ["«zu» es informal y «zuek» formal", "«zu» es singular y «zuek» plural", "Son sinónimos", "«zuek» es solo femenino"], "correcta": 1, "explicacion": "«Zuek» es «vosotros»: «zu» más la marca de plural."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En castellano eliges entre tutear y tratar de usted. En euskera batua…", "opciones": ["También, con «zu» y «hura»", "No hace falta: «zu» vale para ambos", "Se usa siempre «hi»", "Depende de la provincia"], "correcta": 1, "explicacion": "Una decisión menos que tomar al hablar."}]}, {"id": "u2-g04", "variantes": [{"tipo": "pares", "instruccion": "Empareja los posesivos", "pares": [{"eu": "nire", "es": "mi"}, {"eu": "zure", "es": "tu"}, {"eu": "gure", "es": "nuestro"}, {"eu": "zuen", "es": "vuestro"}]}, {"tipo": "pares", "instruccion": "Empareja los posesivos", "pares": [{"eu": "haren", "es": "su (de él/ella)"}, {"eu": "haien", "es": "su (de ellos)"}, {"eu": "nire", "es": "mi"}, {"eu": "gure", "es": "nuestro"}]}, {"tipo": "pares", "instruccion": "Empareja cada pronombre con su posesivo", "pares": [{"eu": "ni", "es": "nire"}, {"eu": "zu", "es": "zure"}, {"eu": "gu", "es": "gure"}, {"eu": "haiek", "es": "haien"}]}, {"tipo": "pares", "instruccion": "Empareja las expresiones", "pares": [{"eu": "nire etxea", "es": "mi casa"}, {"eu": "zure laguna", "es": "tu amigo"}, {"eu": "gure herria", "es": "nuestro pueblo"}, {"eu": "haren izena", "es": "su nombre"}]}, {"tipo": "pares", "instruccion": "Empareja los posesivos reforzados", "pares": [{"eu": "neure", "es": "mi propio"}, {"eu": "zeure", "es": "tu propio"}, {"eu": "geure", "es": "nuestro propio"}, {"eu": "haren", "es": "su (de él/ella)"}]}]}, {"id": "u2-g05", "variantes": [{"tipo": "opcion", "instruccion": "Completa la expresión", "pregunta": "____ etxea (mi casa)", "opciones": ["zure", "nire", "gure", "haren"], "correcta": 1, "explicacion": "«Nire» viene de «ni»."}, {"tipo": "opcion", "instruccion": "Completa la expresión", "pregunta": "____ herria (nuestro pueblo)", "opciones": ["gure", "zuen", "haien", "nire"], "correcta": 0, "explicacion": "«Gure» viene de «gu»."}, {"tipo": "opcion", "instruccion": "Completa la expresión", "pregunta": "____ laguna (vuestro amigo)", "opciones": ["zure", "gure", "zuen", "haien"], "correcta": 2, "explicacion": "«Zuen» viene de «zuek». No lo confundas con «zure» (tu)."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuál es la diferencia entre «zure» y «zuen»?", "opciones": ["Ninguna", "«zure» es tu y «zuen» vuestro", "«zure» es formal", "«zuen» es pasado"], "correcta": 1, "explicacion": "«zure» sale de «zu» (tú) y «zuen» de «zuek» (vosotros)."}, {"tipo": "opcion", "instruccion": "Completa la expresión", "pregunta": "____ izena (su nombre, de ella)", "opciones": ["haien", "haren", "zuen", "gure"], "correcta": 1, "explicacion": "«Haren» es de una persona; «haien» de varias."}]}, {"id": "u2-g06", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Dónde va el posesivo en euskera?", "opciones": ["Detrás del sustantivo", "Delante del sustantivo", "Al final de la frase", "Pegado al verbo"], "correcta": 1, "explicacion": "Delante, como en castellano: «nire etxea»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Mi casa grande» se dice…", "opciones": ["nire handi etxea", "handia nire etxe", "nire etxe handia", "etxea nire handia"], "correcta": 2, "explicacion": "Posesivo, sustantivo, adjetivo. Y el artículo -a se pega al adjetivo."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Nuestro pueblo bonito» se dice…", "opciones": ["gure herri polita", "polita gure herria", "gure polita herria", "herri gure polita"], "correcta": 0, "explicacion": "Mismo orden: gure + herri + polit + a."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Por qué está mal «nire etxea handia»?", "opciones": ["El posesivo va detrás", "El artículo -a aparece dos veces", "«handia» no existe", "Falta el verbo"], "correcta": 1, "explicacion": "El artículo se pone una sola vez, al final del grupo: «nire etxe handia»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Tu casa pequeña» se dice…", "opciones": ["zure txiki etxea", "zure etxe txikia", "txikia zure etxea", "zuen etxe txikia"], "correcta": 1, "explicacion": "«zuen» sería «vuestra». Aquí toca «zure»."}]}, {"id": "u2-g07", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "mi casa", "respuestas": ["nire etxea"], "pista": "Posesivo delante, y el sustantivo con su artículo -a."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "tu amigo", "respuestas": ["zure laguna"], "pista": "De «zu» sale «zure»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "nuestro pueblo", "respuestas": ["gure herria"], "pista": "De «gu» sale «gure»."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "mi nombre", "respuestas": ["nire izena"], "pista": "«izen» + artículo."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "vuestra casa", "respuestas": ["zuen etxea"], "pista": "Cuidado: no es «zure», que sería «tu casa»."}]}, {"id": "u2-g08", "variantes": [{"tipo": "orden", "instruccion": "Ordena las palabras", "es": "mi casa grande", "eu": "nire etxe handia", "palabras": ["nire", "etxe", "handia"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "nuestro pueblo bonito", "eu": "gure herri polita", "palabras": ["gure", "herri", "polita"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "tu casa pequeña", "eu": "zure etxe txikia", "palabras": ["zure", "etxe", "txikia"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "su amigo (de ella)", "eu": "haren lagun polita", "palabras": ["haren", "lagun", "polita"]}, {"tipo": "orden", "instruccion": "Ordena las palabras", "es": "vuestro pueblo pequeño", "eu": "zuen herri txikia", "palabras": ["zuen", "herri", "txikia"]}]}, {"id": "u2-g09", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Vas a ver «nik» y «niri» más adelante. ¿Qué son?", "opciones": ["Pronombres nuevos", "El pronombre «ni» con distintos sufijos", "Formas del plural", "Errores de escritura"], "correcta": 1, "explicacion": "La raíz «ni» siempre está ahí; lo que cambia es la cola."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué significa «nirekin»?", "opciones": ["A mí", "De mí", "Conmigo", "Para mí"], "correcta": 2, "explicacion": "«-rekin» es el sufijo de compañía: nirekin, zurekin."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En euskera, los pronombres…", "opciones": ["Son invariables", "Cambian de terminación según su función", "Solo cambian en plural", "No existen"], "correcta": 1, "explicacion": "Se declinan, igual que los sustantivos: ni, nik, niri, nirekin."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿De qué pronombre viene «zurekin»?", "opciones": ["zuek", "zu", "zure", "hura"], "correcta": 1, "explicacion": "zu + rekin. Significa «contigo»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "«Nigaz» es la forma de Bizkaia para…", "opciones": ["nirekin (conmigo)", "niri (a mí)", "nik (yo)", "nire (mi)"], "correcta": 0, "explicacion": "El bizkaiera usa «-gaz» donde el batua usa «-rekin»."}]}, {"id": "u2-g10", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Por qué en euskera se omite el pronombre sujeto a menudo?", "opciones": ["Por pereza", "Porque el verbo ya dice quién es", "Porque está prohibido", "Solo se omite por escrito"], "correcta": 1, "explicacion": "Igual que en castellano: «vivo en Bilbao», no «yo vivo en Bilbao»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Cuándo sí conviene decir el pronombre?", "opciones": ["Siempre", "Nunca", "Cuando quieres marcar contraste o énfasis", "Solo en preguntas"], "correcta": 2, "explicacion": "«Yo sí, tú no»: ahí el pronombre hace falta."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Para qué sirve entonces aprenderse los seis pronombres?", "opciones": ["Para usarlos en cada frase", "Para entender la lógica del verbo", "Para los exámenes solamente", "Para nada práctico"], "correcta": 1, "explicacion": "El verbo vasco concuerda con las personas. Sin los pronombres claros, el verbo no se sostiene."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "¿Qué añade «neu» frente a «ni»?", "opciones": ["Plural", "Énfasis", "Formalidad", "Pasado"], "correcta": 1, "explicacion": "Es la diferencia entre «yo» y «yo mismo»."}, {"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "En Bizkaia, las formas «neu, zeu, geu»…", "opciones": ["No se usan", "Son de uso muy corriente", "Son solo escritas", "Significan otra cosa"], "correcta": 1, "explicacion": "Allí se oyen constantemente, sin necesidad de énfasis especial."}]}, {"id": "u2-g11", "variantes": [{"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "yo", "respuestas": ["ni"], "pista": "Dos letras."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "nosotros", "respuestas": ["gu"], "pista": "Dos letras, empieza por g."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "vosotros", "respuestas": ["zuek"], "pista": "Es «zu» más la marca de plural."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "ellos", "respuestas": ["haiek", "beraiek"], "pista": "Vale la forma de manual o la coloquial."}, {"tipo": "traducir", "instruccion": "Escríbelo en euskera", "es": "él o ella", "respuestas": ["hura", "bera"], "pista": "Una sola palabra sirve para ambos."}]}, {"id": "u2-g12", "variantes": [{"tipo": "pares", "instruccion": "Empareja las expresiones", "pares": [{"eu": "nire herria", "es": "mi pueblo"}, {"eu": "zure etxea", "es": "tu casa"}, {"eu": "gure laguna", "es": "nuestro amigo"}, {"eu": "haien izena", "es": "su nombre (de ellos)"}]}, {"tipo": "pares", "instruccion": "Empareja los adjetivos", "pares": [{"eu": "handia", "es": "grande"}, {"eu": "txikia", "es": "pequeño"}, {"eu": "polita", "es": "bonito"}, {"eu": "laguna", "es": "el amigo"}]}, {"tipo": "pares", "instruccion": "Empareja las expresiones", "pares": [{"eu": "nire etxe handia", "es": "mi casa grande"}, {"eu": "zure herri txikia", "es": "tu pueblo pequeño"}, {"eu": "gure lagun polita", "es": "nuestro amigo guapo"}, {"eu": "haren izena", "es": "su nombre"}]}, {"tipo": "pares", "instruccion": "Empareja los pronombres reforzados con los normales", "pares": [{"eu": "neu", "es": "ni"}, {"eu": "zeu", "es": "zu"}, {"eu": "geu", "es": "gu"}, {"eu": "zeuek", "es": "zuek"}]}, {"tipo": "pares", "instruccion": "Empareja el batua con el bizkaiera", "pares": [{"eu": "nirekin", "es": "nigaz"}, {"eu": "zurekin", "es": "zugaz"}, {"eu": "norekin?", "es": "nogaz?"}, {"eu": "ni", "es": "neu"}]}]}]}, {"id": "u3", "numero": 3, "titulo": "Nor? Zer? Non?", "subtitulo": "Las preguntas básicas", "objetivo": "Reconocer las palabras interrogativas y saber qué te están preguntando, aunque todavía no sepas responder con frases largas.", "color": "rojo", "vocabulario": [{"eu": "nor?", "es": "¿quién?", "nota": null}, {"eu": "zer?", "es": "¿qué?", "nota": null}, {"eu": "zein?", "es": "¿cuál? ¿qué (de varios)?", "nota": null}, {"eu": "non?", "es": "¿dónde?", "nota": null}, {"eu": "nora?", "es": "¿adónde?", "nota": null}, {"eu": "nondik?", "es": "¿de dónde? ¿por dónde?", "nota": "Movimiento desde un sitio."}, {"eu": "nongoa?", "es": "¿de dónde (eres)?", "nota": "Origen, no movimiento."}, {"eu": "noiz?", "es": "¿cuándo?", "nota": null}, {"eu": "nola?", "es": "¿cómo?", "nota": null}, {"eu": "zergatik?", "es": "¿por qué?", "nota": null}, {"eu": "zenbat?", "es": "¿cuánto? ¿cuántos?", "nota": null}, {"eu": "norekin?", "es": "¿con quién?", "nota": null}, {"eu": "noren?", "es": "¿de quién?", "nota": "El genitivo de «nor». Para cosas es «zeren?» (¿de qué?)."}, {"eu": "galdera", "es": "la pregunta", "nota": null}, {"eu": "erantzuna", "es": "la respuesta", "nota": null}, {"eu": "bai", "es": "sí", "nota": null}, {"eu": "ez", "es": "no", "nota": null}, {"eu": "ez dakit", "es": "no sé", "nota": "Frase hecha. Muy útil desde el primer día."}, {"eu": "agian", "es": "quizás", "nota": null}, {"eu": "beti", "es": "siempre", "nota": null}, {"eu": "inoiz ez", "es": "nunca", "nota": null}, {"eu": "gaur", "es": "hoy", "nota": null}, {"eu": "bihar", "es": "mañana", "nota": null}, {"eu": "atzo", "es": "ayer", "nota": null}, {"eu": "orain", "es": "ahora", "nota": null}], "gramatica": [{"titulo": "Casi todas empiezan por n- o por z-", "cuerpo": "Antes de meterte en verbos, merece la pena tener a mano las palabras con las que se hacen preguntas. Son pocas y siguen un patrón muy claro.\n\nLas de <b>n-<\/b> preguntan por <b>personas y lugares<\/b>:\n\n<b>nor?<\/b> — quién\n<b>non?<\/b> — dónde\n<b>nora?<\/b> — adónde\n<b>nondik?<\/b> — de dónde, por dónde\n<b>noiz?<\/b> — cuándo\n<b>nola?<\/b> — cómo\n\nLas de <b>z-<\/b> preguntan por <b>cosas, causas y cantidades<\/b>:\n\n<b>zer?<\/b> — qué\n<b>zein?<\/b> — cuál\n<b>zergatik?<\/b> — por qué\n<b>zenbat?<\/b> — cuánto\n\nNo es una regla infalible (<i>nola<\/i> es de cómo, no de lugar), pero como gancho para memorizarlas funciona muy bien.", "ejemplos": [{"eu": "Nor?", "es": "¿Quién?"}, {"eu": "Zer?", "es": "¿Qué?"}, {"eu": "Zenbat?", "es": "¿Cuánto?"}]}, {"titulo": "La familia de «non»: un anticipo del sistema", "cuerpo": "Fíjate en estas cuatro. Son la misma raíz con distintas colas, y cada una pide un tipo de respuesta:\n\n<b>Non?<\/b> (¿dónde?) → se responde con <b>-n<\/b>: <i>Bilbo<b>n<\/b><\/i>, en Bilbao\n<b>Nora?<\/b> (¿adónde?) → se responde con <b>-ra<\/b>: <i>Bilbo<b>ra<\/b><\/i>, a Bilbao\n<b>Nondik?<\/b> (¿de dónde?) → se responde con <b>-tik<\/b>: <i>Bilbo<b>tik<\/b><\/i>, desde Bilbao\n<b>Nongoa?<\/b> (¿de dónde eres?) → se responde con <b>-koa<\/b>: <i>Bilbo<b>koa<\/b><\/i>, de Bilbao\n\n¿Ves lo que pasa? <b>La pregunta y la respuesta llevan la misma terminación.<\/b> Si la pregunta acaba en <i>-ra<\/i>, la respuesta también.\n\nEsto no es una casualidad bonita: es el mecanismo central del euskera. Toda la gramática que viene después funciona así, encajando sufijos. Si te quedas con esta idea ahora, las próximas unidades te van a parecer mucho menos arbitrarias.", "ejemplos": [{"eu": "Non? — Bilbon.", "es": "¿Dónde? — En Bilbao."}, {"eu": "Nora? — Bilbora.", "es": "¿Adónde? — A Bilbao."}, {"eu": "Nondik? — Bilbotik.", "es": "¿De dónde? — Desde Bilbao."}, {"eu": "Nongoa? — Bilbokoa.", "es": "¿De dónde eres? — De Bilbao."}]}, {"titulo": "«nondik» y «nongoa» no son lo mismo", "cuerpo": "Las dos se traducen al castellano por «de dónde», y ahí está la trampa.\n\n<b>Nondik?<\/b> pregunta por un <b>movimiento<\/b>: de dónde vienes, por dónde has pasado.\n<i>Bilbotik nator<\/i> — vengo desde Bilbao.\n\n<b>Nongoa?<\/b> pregunta por el <b>origen<\/b>: de dónde eres, dónde están tus raíces.\n<i>Bilbokoa naiz<\/i> — soy de Bilbao.\n\nPuedes ser <i>Gernikakoa<\/i> (de Gernika) y venir hoy <i>Bilbotik<\/i> (desde Bilbao). Son dos cosas distintas y el euskera las separa.", "ejemplos": [{"eu": "Nongoa zara?", "es": "¿De dónde eres? (origen)"}, {"eu": "Nondik zatoz?", "es": "¿De dónde vienes? (movimiento)"}]}, {"titulo": "La palabra interrogativa va justo antes del verbo", "cuerpo": "Esta regla es sencilla y muy útil, porque en euskera el orden de las palabras es bastante libre… salvo aquí.\n\nEn una pregunta, la palabra interrogativa se coloca <b>inmediatamente antes del verbo<\/b>. Pegada. Sin nada en medio.\n\n<i><b>Non<\/b> zaude?<\/i> — ¿Dónde estás?\n<i><b>Nor<\/b> zara zu?<\/i> — ¿Quién eres tú?\n<i>Zu <b>nongoa<\/b> zara?<\/i> — ¿De dónde eres tú?\n\nFíjate en la última: el sujeto <i>zu<\/i> puede irse al principio, pero <i>nongoa<\/i> sigue pegado a <i>zara<\/i>.\n\nSi alguna vez dudas de dónde colocar algo en una pregunta, empieza por esto: interrogativa + verbo, juntos.", "ejemplos": [{"eu": "Zer da hau?", "es": "¿Qué es esto?"}, {"eu": "Noiz da festa?", "es": "¿Cuándo es la fiesta?"}, {"eu": "Zergatik ez?", "es": "¿Por qué no?"}]}, {"titulo": "Frases hechas: apréndetelas enteras por ahora", "cuerpo": "En los ejemplos de esta unidad aparecen formas verbales que todavía no hemos explicado: <i>zara, zaude, da, dituzu<\/i>.\n\nNo pasa nada. Trátalas como bloques cerrados, igual que aprendiste <i>zer moduz?<\/i> sin desmontarlo.\n\n<b>Nor zara zu?<\/b> — ¿Quién eres tú?\n<b>Non zaude?<\/b> — ¿Dónde estás?\n<b>Nongoa zara?<\/b> — ¿De dónde eres?\n<b>Zer da hau?<\/b> — ¿Qué es esto?\n<b>Zenbat urte dituzu?<\/b> — ¿Cuántos años tienes?\n<b>Nola duzu izena?<\/b> — ¿Cómo te llamas?\n\nCon estas seis preguntas ya puedes sostener el principio de una conversación. En las próximas unidades desmontaremos los verbos pieza a pieza y entenderás por qué son así.", "ejemplos": [{"eu": "Nor zara zu?", "es": "¿Quién eres tú?"}, {"eu": "Nola duzu izena?", "es": "¿Cómo te llamas?"}, {"eu": "Zenbat urte dituzu?", "es": "¿Cuántos años tienes?"}]}, {"titulo": "Cuatro respuestas que salvan cualquier apuro", "cuerpo": "Antes de saber construir frases, conviene poder salir del paso:\n\n<b>Bai<\/b> — sí\n<b>Ez<\/b> — no\n<b>Ez dakit<\/b> — no sé\n<b>Agian<\/b> — quizás\n\n<i>Ez dakit<\/i> es probablemente la frase más útil de todo este módulo. Literalmente es «no lo sé», y te permite responder honestamente a cualquier pregunta que no entiendas sin cortar la conversación.\n\nY si no has entendido lo que te dicen, dos más:\n\n<b>Barkatu?<\/b> — ¿perdón?\n<b>Ez dut ulertzen<\/b> — no entiendo", "ejemplos": [{"eu": "Ez dakit.", "es": "No sé."}, {"eu": "Ez dut ulertzen.", "es": "No entiendo."}]}, {"titulo": "Cómo suena esto en Gernika", "cuerpo": "<b>zelan en lugar de nola<\/b>\nYa lo viste en la primera unidad, pero aquí es donde encaja del todo. El «¿cómo?» del bizkaiera es <b>zelan<\/b>. Y de ahí sale toda una familia:\n\n<b>zelan?<\/b> — cómo (batua: nola)\n<b>zelango?<\/b> — de qué tipo (batua: nolako)\n<b>holan, halan, honan<\/b> — así, de esa manera (batua: horrela, hala, honela)\n\n<b>nogaz en lugar de norekin<\/b>\nPara «¿con quién?», el bizkaiera usa el sufijo <b>-gaz<\/b>: <b>nogaz?<\/b>\n\n<b>La serie de «edo-» y «zeo-»<\/b>\nA cada interrogativa se le puede poner <b>edo-<\/b> delante para hacer el indefinido «cualquiera». Ojo: <b>edonor, edonon, edonora, edozein<\/b> son batua normal, no bizkaiera — te sirven en todas partes:\n\n<b>edonor<\/b> — cualquiera\n<b>edonon<\/b> — en cualquier sitio\n<b>edonora<\/b> — a cualquier sitio\n\nLo propiamente bizkaino es aplicárselo a <b>zelan<\/b>: <b>edozelan<\/b> (de cualquier manera), donde el batua dice <i>edonola<\/i>.\n\nY el <b>zeo-<\/b> del «alguno» sí es de allí: <b>zeozer<\/b> (algo), <b>zeozelan<\/b> (de alguna manera), donde el batua pone <i>zerbait<\/i> y <i>nolabait<\/i>. Es un sistema muy regular: aprendes la interrogativa y te salen tres palabras más.", "ejemplos": [{"eu": "Zelan zagoz?", "es": "¿Qué tal estás? — batua: Nola zaude?"}, {"eu": "Nogaz zoaz?", "es": "¿Con quién vas? — batua: Norekin zoaz?"}, {"eu": "Edonor etor daiteke.", "es": "Puede venir cualquiera."}]}, {"titulo": "Un aviso sobre los dialectos", "cuerpo": "El habla cambia de pueblo a pueblo, y a veces de barrio a barrio. Lo que te cuento como «de Gernika» es bizkaiera de Busturialdea en general, y no todo el mundo de allí lo dice igual: quien se ha escolarizado en batua mezcla las dos cosas constantemente.\n\nTómalo como oído entrenado, no como norma. Para escribir, para exámenes y para entenderte con cualquiera, usa batua. Para captar lo que oyes en una taberna de Gernika, ten estas notas a mano.\n\nY contrástalo con alguien de allí en cuanto puedas. Ninguna app sustituye eso.", "ejemplos": []}], "ejercicios": [{"id": "u3-g01", "variantes": [{"tipo": "pares", "instruccion": "Empareja las preguntas", "pares": [{"eu": "nor?", "es": "¿quién?"}, {"eu": "zer?", "es": "¿qué?"}, {"eu": "non?", "es": "¿dónde?"}, {"eu": "noiz?", "es": "¿cuándo?"}]}, {"tipo": "pares", "instruccion": "Empareja las preguntas", "pares": [{"eu": "nola?", "es": "¿cómo?"}, {"eu": "zergatik?", "es": "¿por qué?"}, {"eu": "zenbat?", "es": "¿cuánto?"}, {"eu": "zein?", "es": "¿cuál?"}]}, {"tipo": "pares", "instruccion": "Empareja las preguntas de lugar", "pares": [{"eu": "non?", "es": "¿dónde?"}, {"eu": "nora?", "es": "¿adónde?"}, {"eu": "nondik?", "es": "¿de dónde? (viniendo)"}, {"eu": "nongoa?", "es": "¿de dónde? (origen)"}]}, {"tipo": "pares", "instruccion": "Empareja las preguntas", "pares": [{"eu": "norekin?", "es": "¿con quién?"}, {"eu": "nor?", "es": "¿quién?"}, {"eu": "noiz?", "es": "¿cuándo?"}, {"eu": "zergatik?", "es": "¿por qué?"}]}, {"tipo": "pares", "instruccion": "Empareja las preguntas", "pares": [{"eu": "zer?", "es": "¿qué?"}, {"eu": "zein?", "es": "¿cuál?"}, {"eu": "zenbat?", "es": "¿cuántos?"}, {"eu": "nola?", "es": "¿cómo?"}]}]}, {"id": "u3-g02", "variantes": [{"tipo": "opcion", "instruccion": "Elige la opción correcta", "pregunta": "Quieres saber dónde está el baño. ¿Qué palabra usas?", "opciones": ["nor", "non", "nora", "noiz"], "correcta": 1, "explicacion": "«Non» pregunta por la ubicación, sin movimiento."}, {"tipo": "opcion"
