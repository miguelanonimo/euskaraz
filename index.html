<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Aprende euskera batua desde cero. Nivel A1.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Euskaraz · Aprende euskera desde cero</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Schibsted+Grotesk:wght@400..800&display=swap">
<!-- El ?v= se sube al cambiar CSS o JS: sin él, el navegador sirve
     la copia cacheada y se ven estilos viejos sobre marcado nuevo. -->
<link rel="stylesheet" href="css/styles.css?v=46">
</head>
<body>

<!-- Menú lateral: solo en escritorio y fuera de las pantallas de foco
     (ejercicio, fichas). En el móvil hace su papel la barra de abajo. -->
<nav class="sidenav" id="sidenav" aria-label="Secciones">
  <div class="sidenav__top">
    <button class="sidenav__logo" type="button" data-tab="today" aria-label="Hoy"></button>
    <div class="sidenav__items" id="sidenavItems"></div>
  </div>
  <button class="sidenav__item" type="button" data-tab="account" id="sidenavCuenta"></button>
</nav>

<div class="col" id="col">

  <header class="hdr" id="hdr"></header>

  <!-- ══════════ ACCESO ══════════ -->
  <main class="screen" id="screenAuth" hidden>
    <div class="auth">
      <span class="auth__logo" id="authLogo" aria-hidden="true"></span>
      <h1 class="pagetitle">Euskaraz</h1>
      <p class="lead" id="authSub"></p>
      <form class="auth__form" id="authForm">
        <input type="email" class="field" id="authEmail" placeholder="tú@correo.com"
               autocomplete="email" inputmode="email" required>
        <input type="password" class="field" id="authPassword" placeholder="Contraseña"
               autocomplete="current-password" required minlength="6">
        <button class="btn btn--ink btn--lg btn--block" type="submit" id="authSubmit">Entrar</button>
      </form>
      <button class="btn btn--outline btn--block" type="button" id="authToggle"></button>
      <button class="auth__link" type="button" id="authOlvido">¿Olvidaste tu contraseña?</button>
      <p class="auth__msg" id="authMsg" hidden aria-live="polite"></p>
    </div>
  </main>

  <main class="screen" id="screenHome" hidden></main>
  <main class="screen" id="screenLessons" hidden></main>
  <main class="screen" id="screenUnit" hidden></main>
  <main class="screen" id="screenSub" hidden></main>
  <main class="screen" id="screenGram" hidden></main>
  <main class="screen" id="screenVocab" hidden></main>
  <main class="screen" id="screenProgress" hidden></main>

  <!-- ══════════ DICCIONARIO ══════════
       El buscador y los filtros son fijos: si se repintaran en cada
       tecla, el campo perdería el foco. Solo se repinta la lista. -->
  <main class="screen" id="screenDict" hidden>
    <div class="stack">
      <h1 class="pagetitle" id="dictTitulo"></h1>
      <div class="dict__filtros">
        <label class="search">
          <span class="search__ico" data-ico="search"></span>
          <input type="search" id="dictInput" placeholder="Buscar en euskera o castellano…"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 aria-label="Buscar en el diccionario">
        </label>
        <div class="seg" id="dictSeg" role="tablist"></div>
      </div>
      <div class="alfa">
        <button class="alfa__chev alfa__chev--prev" type="button" id="alfaPrev" aria-label="Letras anteriores"></button>
        <div class="alfa__rail" id="dictLetras"></div>
        <button class="alfa__chev" type="button" id="alfaNext" aria-label="Letras siguientes"></button>
      </div>
      <div class="dict__lista" id="dictContent"></div>
    </div>
    <button class="goup" type="button" id="dictArriba" aria-label="Ir arriba"></button>
  </main>

  <main class="screen screen--quiz" id="screenQuiz" hidden>
    <div class="quiz" id="quizContent"></div>
  </main>

  <main class="screen" id="screenResult" hidden></main>
  <main class="screen" id="screenCuenta" hidden></main>

  <!-- ══════════ HOJA DEL EJERCICIO ══════════
       Un solo botón: «Comprobar» y, una vez corregido, «Continuar».
       El libro abre la ficha del tema sin salir del ejercicio. -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__in">
      <div class="fb" id="feedback" hidden aria-live="polite">
        <div class="fb__head">
          <span class="fb__icon" id="feedbackIcon" aria-hidden="true"></span>
          <span class="fb__title" id="feedbackTitle"></span>
        </div>
        <div class="fb__body" id="feedbackBody"></div>
      </div>
      <div class="sheet__row">
        <button class="checkbtn" id="btnCheck" type="button" disabled>Comprobar</button>
        <button class="lessonbtn" id="btnFicha" type="button" hidden aria-label="Ver la explicación"></button>
      </div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Secciones"><div class="tabbar__in" id="tabbarItems"></div></nav>
</div>

<!-- ══════════ MODAL ══════════ -->
<div class="modal" id="modal" hidden>
  <div class="modal__scrim" id="modalScrim"></div>
  <div class="modal__panel" role="dialog" aria-modal="true" id="modalPanel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/app.js?v=46"></script>
</body>
</html>
